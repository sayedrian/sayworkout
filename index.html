<!doctype html>
<!-- Published from sayedrian/fitness site/index.html by .github/workflows/publish-site.yml. Edit it there, not in sayworkout. -->
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Security: the page may only talk to api.github.com, loads nothing from other sites (only its own
     icon, manifest and offline helper), and sends no referrer. Even injected code could not send the
     token to another site. Checked by tests/check-site.sh. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://api.github.com; img-src 'self' data:; manifest-src 'self'; worker-src 'self'; media-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workout</title>
<!-- Installs as an app: home-screen icon, full screen, opens offline (sw.js) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f5f4f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101317" media="(prefers-color-scheme: dark)">
<style>
:root{
  --bg:#f5f4f0; --card:#ffffff; --ink:#1b1d21; --muted:#686c73; --line:#e2e0da;
  --input:#f0efea; --accent:#2a64d6; --accent-ink:#ffffff; --done:#1d8048;
  --done-bg:#e3f2e9; --hint:#9a5a12; --hint-bg:#fbf0e1; --bar:#1b1d21; --bar-ink:#ffffff; --bad:#b3261e;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101317; --card:#191d23; --ink:#e7e8eb; --muted:#9a9fa7; --line:#2a3038;
    --input:#222830; --accent:#5d8ff0; --accent-ink:#0b0d10; --done:#4cc27e;
    --done-bg:#15301f; --hint:#e3a65e; --hint-bg:#33260f; --bar:#e7e8eb; --bar-ink:#101317; --bad:#f2867d;
  }
}
:root[data-theme="dark"]{
  --bg:#101317; --card:#191d23; --ink:#e7e8eb; --muted:#9a9fa7; --line:#2a3038;
  --input:#222830; --accent:#5d8ff0; --accent-ink:#0b0d10; --done:#4cc27e;
  --done-bg:#15301f; --hint:#e3a65e; --hint-bg:#33260f; --bar:#e7e8eb; --bar-ink:#101317; --bad:#f2867d;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}

header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top)}
.top{display:flex;align-items:center;gap:8px;padding:10px 0 6px}
.top h1{font-size:17px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock,.prog{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.icon{border:0;background:none;font-size:22px;line-height:1;padding:2px 6px;color:var(--ink)}
.sdot{width:9px;height:9px;border-radius:50%;background:var(--done)}
.sdot.wait{background:var(--hint)}
header .wrap{position:relative}
.menu{position:absolute;right:16px;top:46px;z-index:6;background:var(--card);
  border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.18);overflow:hidden;min-width:170px}
.menu[hidden]{display:none}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:13px 16px;font-size:16px}
.menu button+button{border-top:1px solid var(--line)}
.menu button[aria-current="true"]{font-weight:700}
button.fold{display:flex;width:100%;align-items:center;gap:10px;text-align:left;background:var(--card);
  border:1px solid var(--done);border-radius:14px;padding:10px 14px;margin:10px 0}
button.fold .num{background:var(--done);color:var(--card)}
button.fold .what{flex:1;min-width:0}
button.fold .small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:13px}
.pill.on{background:var(--done);color:#fff;border-color:var(--done)}
#wake[hidden]{display:none}
#wake .clock{color:inherit;font-size:13px}
nav{display:flex;gap:6px;padding:4px 0 10px}
nav button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:10px;
  padding:9px 0;font-weight:600;position:relative}
nav button[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
nav button .dot{position:absolute;top:6px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--done)}

.focus{color:var(--muted);margin:14px 0 4px;font-size:14px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.box h3{margin:0 0 4px;font-size:15px}
.small{font-size:13px;color:var(--muted)}

.ex{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:10px 0;overflow:hidden}
.ex.complete{border-color:var(--done)}
.ex-head{display:flex;gap:10px;padding:12px 14px 6px;align-items:flex-start}
.num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--input);display:grid;place-items:center;
  font-size:13px;font-weight:700}
.ex.complete .num{background:var(--done);color:var(--card)}
.ex-title{flex:1;min-width:0}
.ex-title select{width:100%;border:0;background:transparent;font-weight:650;font-size:16px;padding:0;
  appearance:none;-webkit-appearance:none;text-overflow:ellipsis}
.ex-title .swap{font-size:12px;color:var(--accent);font-weight:500}
.rx{font-size:14px;color:var(--muted);margin-top:2px}
.cue{font-size:13px;color:var(--muted);padding:0 14px 8px;margin:0}
.hint{margin:0 14px 8px;font-size:13px;background:var(--hint-bg);color:var(--hint);border-radius:8px;padding:6px 9px}
.last{font-size:12px;color:var(--muted);padding:0 14px 6px}

.sets{padding:2px 10px 10px}
.row{display:grid;grid-template-columns:28px 1fr 1fr 56px;gap:8px;align-items:center;padding:4px}
.row.head{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding-bottom:0}
.row .i{text-align:center;color:var(--muted);font-size:14px}
.row input{width:100%;min-width:0;border:1px solid transparent;background:var(--input);border-radius:9px;
  padding:9px 8px;text-align:center;font-size:17px;font-variant-numeric:tabular-nums}
.rrow{display:grid;grid-template-columns:1fr 56px;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.demowrap{grid-column:1 / -1}
.mv{border:0;background:none;padding:0;text-align:left;font-size:14px;color:var(--ink)}
.mv .small{display:block}
.mv .play{color:var(--accent);font-size:13px}
.howlist{list-style:none;margin:6px 2px 4px;padding:0;font-size:13px;line-height:1.35}
.howlist li{padding:2px 0}
.howlist .ok{color:var(--done)}
.howlist .no{color:var(--bad)}
.vid{flex:none;width:40px;height:34px;border:1px solid var(--line);border-radius:10px;background:var(--input);color:var(--accent);display:grid;place-items:center;padding:0}
.vid svg{width:24px;height:24px}
.vid svg rect{fill:none;stroke:currentColor;stroke-width:1.8}
.vid svg path{fill:currentColor}
.vid[aria-expanded="true"]{background:var(--accent);color:var(--input);border-color:var(--accent)}
.ex .demowrap{padding:0 10px 10px}
.demo{display:block;width:100%;max-width:340px;margin:2px auto;background:var(--input);border-radius:12px}
.demo .floor{stroke:var(--line);stroke-width:2}
.demo .prop{fill:var(--muted);opacity:.45}
.demo .bar{stroke:var(--muted);stroke-width:4;stroke-linecap:round}
.demo .near polyline,.demo .far polyline,.demo .torso{fill:none;stroke:var(--ink);stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
.demo .far{opacity:.3}
.demo .head{fill:var(--input);stroke:var(--ink);stroke-width:4}
.demo .roller{fill:var(--line);stroke:var(--muted);stroke-width:2}
.demo .gaze{stroke:var(--ink);stroke-width:2.5;stroke-linecap:round}
.demo .hot{fill:var(--hint);opacity:.6}
.demo .say{font-size:9px;fill:var(--muted);text-anchor:middle}
.demo .say.left{text-anchor:start}
.demo .bad{fill:none;stroke:var(--bad);stroke-width:2.2}
.demo .badx{fill:var(--bad);font-size:10px;font-weight:700;text-anchor:middle}
.demo .gear{fill:var(--muted);stroke:var(--muted)}
.demo .band{fill:none;stroke-width:2;stroke-linecap:round}
.demowrap .cap{font-size:14px;font-weight:600;text-align:center;padding:4px 8px 2px;min-height:1.4em}
.demowrap .cap.good{color:var(--done)}
.demowrap .cap.bad{color:var(--bad)}
.rrow.done .tick{opacity:1;background:var(--done);border-color:var(--done);color:var(--card)}
.reset h3 .small{font-weight:400}
.row .bwcell{text-align:center;color:var(--muted);font-size:14px;padding:9px 0}
.row input:focus{outline:none;border-color:var(--accent)}
.row input::placeholder{color:var(--muted);opacity:.75}
.tick{height:42px;border-radius:10px;border:2px solid var(--accent);background:var(--card);color:var(--accent);font-size:20px;line-height:1;opacity:.55}
.row.done .tick{opacity:1}
.row.done input{background:var(--done-bg)}
.row.done .tick{background:var(--done);border-color:var(--done);color:var(--card)}
.setbtns{display:flex;gap:8px;padding:2px 14px 12px}
.link{border:0;background:none;color:var(--accent);font-size:13px;padding:4px 0}

.actions{display:flex;gap:8px;margin:16px 0}
.btn{flex:1;border:0;border-radius:12px;padding:13px;font-weight:650;background:var(--accent);color:var(--accent-ink)}
.btn.start{display:block;width:100%;margin:10px 0;padding:15px;font-size:17px;background:var(--done);color:#fff}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
textarea{width:100%;min-height:70px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px}

details.sess{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:10px 0;padding:0 14px}
details.sess summary{padding:12px 0;cursor:pointer;font-weight:600}
details.sess summary span{font-weight:400;color:var(--muted);font-size:13px}
.sess ul{margin:0 0 10px;padding-left:18px;font-size:14px}
.sess li{margin:3px 0}
.empty{color:var(--muted);text-align:center;padding:30px 0}
.gh label{display:block;font-size:13px;color:var(--muted);margin:8px 0}
.gh input{display:block;width:100%;margin-top:4px;border:1px solid var(--line);background:var(--input);border-radius:9px;padding:9px;font-size:16px;color:var(--ink)}

#bar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--bar);color:var(--bar-ink);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .2s}
#bar.show{transform:none}
#bar .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px}
#bar .t{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;min-width:84px}
#bar .l{flex:1;font-size:13px;opacity:.8;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#bar button{border:1px solid currentColor;background:transparent;color:inherit;border-radius:9px;padding:7px 10px;font-size:14px}
#bar.over{background:var(--done);color:#fff}
/* hold timer: full screen, big numbers readable from a plank on the floor */
#hold{position:fixed;inset:0;z-index:15;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;padding:24px 16px calc(24px + env(safe-area-inset-bottom));text-align:center}
#hold[hidden]{display:none}
#hold .hl{font-size:18px;font-weight:650}
#hold .hp{font-size:26px;font-weight:700;color:var(--accent)}
#hold .ht{font-size:110px;line-height:1;font-weight:750;font-variant-numeric:tabular-nums}
#hold .hs{font-size:16px;color:var(--muted);min-height:1.4em}
#hold .hd{font-size:15px;color:var(--muted);min-height:1.4em}
#hold .hb{display:flex;gap:10px;width:100%;max-width:420px;margin-top:14px}
#hold .hb button{flex:1;border-radius:14px;padding:18px;font-size:19px;font-weight:700;border:1px solid var(--line);background:var(--card)}
#hold .hb .go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);flex:2}
#hold.wait .ht{color:var(--hint)}
#hold.reached .ht,#hold.reached .hs{color:var(--done)}
/* timed sets: the whole seconds box is the play button (▶ + suggested seconds); press and hold to type */
.secbtn{flex:1;width:100%;min-width:0;border:1px solid transparent;background:var(--input);border-radius:9px;padding:9px 2px;
  font-size:17px;font-variant-numeric:tabular-nums;text-align:center;white-space:nowrap;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.secbtn .pl{color:var(--accent);font-size:14px}
.secbtn .sg{color:var(--muted)}
.row.done .secbtn{background:var(--done-bg)}
.lr .secbtn{font-size:16px}
.rrow.timed{grid-template-columns:1fr 46px 56px}
.tmrs{height:42px;border-radius:10px;border:1px solid var(--accent);background:var(--card);color:var(--accent);font-size:17px;padding:0}
.mv .got{color:var(--done)}
.lr{display:flex;gap:4px;min-width:0}
.lr > *{flex:1 1 0;min-width:0}
.lr input{padding:9px 2px;font-size:16px}
/* supplements tab */
.slot h3{display:flex;align-items:baseline;gap:8px}
.slot h3 .st{margin-left:auto;font-size:13px;font-weight:600;color:var(--muted)}
.slot h3 .st.due{color:var(--hint)}
.slot h3 .st.ok{color:var(--done)}
.slot.due{border-color:var(--hint)}
.slot.ok{border-color:var(--done)}
.srow{display:grid;grid-template-columns:1fr 56px;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
.srow .small{display:block}
.srow.done .tick{opacity:1;background:var(--done);border-color:var(--done);color:var(--card)}
.supped{display:grid;grid-template-columns:1fr 90px 36px;gap:6px;align-items:center;margin:4px 0}
.supped input,.slotTime{width:100%;min-width:0;border:1px solid var(--line);background:var(--input);border-radius:9px;padding:8px;font-size:15px;color:var(--ink)}
.supped .x{border:0;background:none;color:var(--bad);font-size:18px}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:8px 14px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
#toast.show{opacity:1}

.pick{display:flex;align-items:center;gap:6px}
.pick select{flex:1;min-width:0}
.pick::after{content:'▾';color:var(--accent);font-size:15px}
.unitnote{font-size:12px;color:var(--muted);padding:0 14px 4px}
.bands{display:flex;flex-wrap:wrap;gap:6px;padding:4px 14px 6px}
.chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 11px;font-size:13px}
.chip .sw{width:12px;height:12px;border-radius:50%;border:1px solid var(--muted)}
.chip .kg{opacity:.7;font-size:12px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.rep table{width:100%;border-collapse:collapse;font-size:14px}
.rep th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.rep th,.rep td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.rep td.n,.rep th.n{text-align:right;font-variant-numeric:tabular-nums}
.rep ul{margin:4px 0 0;padding-left:18px;font-size:14px}
.rep select{width:100%;border:1px solid var(--line);background:var(--input);border-radius:9px;padding:9px}
.up{color:var(--done);font-weight:700}
.down{color:var(--bad);font-weight:700}
.star{font-size:12px;color:var(--hint);white-space:nowrap}
@media print{
  header,#bar,#toast,.noprint{display:none!important}
  body{padding:0;background:#fff;color:#000}
  .box{break-inside:avoid;border-color:#ccc}
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <button class="icon" id="back" aria-label="Back to the workout" hidden>←</button>
      <h1 id="title">Full Body 3</h1>
      <span class="prog" id="prog"></span>
      <span class="sdot" id="sdot" hidden></span>
      <!-- training clock while a workout runs; green = the screen is kept on -->
      <span class="pill" id="wake" hidden>☀ <span class="clock" id="clock"></span></span>
      <button class="icon" id="more" aria-label="Menu" aria-expanded="false">⋯</button>
    </div>
    <div class="menu" id="menu" hidden>
      <button data-tab="history">History</button>
      <button data-tab="report">Report</button>
      <button data-tab="settings">Settings</button>
    </div>
    <nav id="tabs"></nav>
  </div>
</header>
<main class="wrap" id="main"></main>
<div id="bar"><div class="in">
  <span class="t" id="barT">0:00</span><span class="l" id="barL"></span>
  <button data-rest="-15">−15</button><button data-rest="15">+15</button><button data-rest="skip">Skip</button>
</div></div>
<div id="hold" hidden role="dialog" aria-label="Hold timer">
  <div class="hl" id="holdL"></div><div class="hp" id="holdP"></div>
  <div class="ht" id="holdT">0</div><div class="hs" id="holdS"></div><div class="hd" id="holdD"></div>
  <div class="hb"><button data-hold-act="cancel">Cancel</button><button class="go" data-hold-act="go" id="holdGo">Stop</button></div>
</div>
<div id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
// ---------- The plan (fitness.md §2d, updated 2026-10-18: home workout) ----------
const PLAN = {
  mon: { tab:'A', title:'Workout A', focus:'Squat · chest · wide pull', ex:[
    {name:'Barbell back squat', sets:4, min:6, max:10, rest:120,
      cue:'Brace: belly breath, ribs down, hold through the rep. Two seconds down, drive up.',
      alts:['Hack squat','Goblet squat','Leg press']},
    {name:'Weighted dead bug', sets:3, min:8, max:10, side:true, rest:45,
      cue:'Lower back stays pressed flat. When it lifts, the set is over — even at rep 5.',
      alts:['Plank','Hollow hold']},
    {name:'Flat dumbbell press', sets:4, min:6, max:10, rest:90,
      cue:'Lower to the lower chest, not the armpits. Elbows about 45° from the body.',
      alts:['Barbell bench press','Chest press machine']},
    {name:'Wide-grip lat pulldown', sets:4, min:8, max:12, rest:75,
      cue:'Wide overhand grip. Drive the elbows down, hands are hooks. Squeeze 1 s at the bottom.',
      alts:['Assisted pull-up (wide overhand)']},
    {name:'Lying leg curl', sets:3, min:10, max:12, rest:60,
      cue:'Two seconds on the way down. Hips stay on the pad.',
      alts:['Seated leg curl','Nordic curl']},
    {name:'Chest-supported dumbbell row', sets:3, min:10, max:12, rest:75,
      cue:'Elbows back and close to the ribs. Don’t push the chest into the pad. Squeeze 1 s.',
      alts:['Seal row','One-arm dumbbell row']},
    {name:'Dumbbell lateral raise', sets:3, min:12, max:15, rest:45,
      cue:'Lead with the elbows, stop at shoulder height. Fine to push close to the limit.',
      alts:['Cable lateral raise','Machine lateral raise']},
    {name:'Triceps pushdown', sets:2, min:12, max:15, rest:45,
      cue:'Elbows pinned at your sides; only the forearms move.',
      alts:['Overhead cable extension','Close-grip push-up']},
  ]},
  wed: { tab:'B', title:'Workout B', focus:'Leg press · back · shoulders', ex:[
    {name:'Leg press', sets:4, min:8, max:12, rest:90,
      cue:'Go down until just before the bum lifts off the seat — the back is the signal, not the knees.',
      alts:['Hack squat','Goblet squat']},
    {name:'Ab wheel rollout', sets:4, min:8, max:12, rest:60,
      cue:'Distance, not reps. Stop the moment the lower back sags. Ribs down.',
      alts:['Barbell rollout','Swiss ball rollout']},
    {name:'Seated cable row (neutral grip)', sets:4, min:8, max:12, rest:90,
      cue:'Neutral grip. Drive the elbows back, stay tall, squeeze the shoulder blades 1 s.',
      alts:['Row machine','Chest-supported row machine','Barbell row']},
    {name:'Seated dumbbell shoulder press', sets:3, min:6, max:10, rest:90,
      cue:'Ribs down, don’t lean back. Elbows slightly in front of the body.',
      alts:['Shoulder press machine','Barbell overhead press']},
    {name:'Bulgarian split squat', sets:3, min:10, max:10, side:true, sideWord:'leg', rest:60,
      cue:'All reps one leg, then the other, then rest. Front foot far enough forward that the heel stays down.',
      alts:['Walking lunge','Step-up']},
    {name:'Machine chest press', sets:3, min:10, max:12, rest:75,
      cue:'Set the seat so the handles are at mid-chest. Fine to push close to the limit.',
      alts:['Dumbbell press','Weighted push-up']},

// A home workout stands in for the gym workout that was due, so the rotation moves on past it.
// (Internally A/B/C are still 'mon'/'wed'/'fri', so saved workouts and file names stay the same.)
function defaultDay(){
  const open = ALL.filter(d => drafts[d]?.startedAt).sort((a, b) => drafts[b].startedAt - drafts[a].startedAt)[0];
  if(open) return open;
  let next = 0;
  history.forEach(s => { next = DAYS.includes(s.day) ? DAYS.indexOf(s.day) + 1 : s.day === 'home' ? next + 1 : next; });

}

function lastFor(name){
  for(let i = history.length - 1; i >= 0; i--){

function lifted(s, name, bw){
  const kg = parseFloat(s.kg);
  if(loadOf(name) === 'assist'){ const b = parseFloat(bw || bodyweight); return b && !isNaN(kg) ? b - kg : null; }

function score(s, name, bw){
  // body-weight exercises: body (or 80 kg if unknown) + any extra, so 10 reps with a dumbbell beats 10 without
  if(bwOf(name)) return ((parseFloat(bw || bodyweight) || 80) + (parseFloat(s.kg) || 0)) * (1 + (+s.reps || 0) / 30);
  // loop bands have no kg: the heavy band ranks above the medium one at the same reps
  if(bandOf(name) === 'loop') return (+s.reps || 0) * (s.band === 'Heavy' ? 1.25 : s.band === 'Medium' ? 1.1 : 1);
  let kg = lifted(s, name, bw);
  if(kg == null) kg = 100 - (parseFloat(s.kg) || 0);   // no body weight yet: less assist still ranks higher
  const r = +s.reps || 0;
  return kg > 0 ? kg * (1 + r / 30) : r;

  const bwk = bwOf(name);
  if(bandOf(name) === 'loop') return 'use the heavy band, then go single-leg';
  if(bandOf(name)) return 'add a band or a stronger one (or step further back)';
  if(bwk === 'only') return 'make it harder (further range, slower, or a harder variant)';
  if(bwk === 'plus' && !sets.some(s => parseFloat(s.kg) > 0)) return loadOf(name) === 'hand' ? 'hold light dumbbells' : 'hold a light weight';

const vec = (a, l) => [l * Math.cos(a * Math.PI / 180), l * Math.sin(a * Math.PI / 180)];
const add = (p, a, l) => { const v = vec(a, l); return [p[0] + v[0], p[1] + v[1]]; };
function side(q, root){
  const k = q.k || 1, T = 40 * k, L = 30 * k, U = 22 * k, F = 20 * k;
  let hip, kn, fn, el, hn, neck;
  if(root === 'foot'){ fn = [q.x, q.y]; kn = add(fn, q.ns, -L); hip = add(kn, q.nt, -L); }
  else if(root === 'hand'){ hn = [q.x, q.y]; el = add(hn, q.nf, -F); neck = add(el, q.nu, -U); hip = add(neck, q.to, -T); }
  else hip = [q.x, q.y];
  neck = neck || add(hip, q.to, T);
  kn = kn || add(hip, q.nt, L); fn = fn || add(kn, q.ns, L);
  el = el || add(neck, q.nu, U); hn = hn || add(el, q.nf, F);
  const kf = add(hip, q.ft, L), ef = add(neck, q.fu, U);
  const ff = add(kf, q.fs, L), hf = add(ef, q.ff, F);
  return { near:[[hip, kn, fn], [hip, neck], [neck, el, hn]], far:[[hip, kf, ff], [neck, ef, hf]],
    head:add(neck, q.hd ?? q.to, 11 * k), hr:8 * k, hip, neck, kn, fn, el, hn, kf, ff, ef, hf, back:[(hip[0] + neck[0]) / 2, (hip[1] + neck[1]) / 2] };
}

// Band pull-apart: front view turned a little to the side (three-quarter) so the arms reaching forward stay readable.
// `a` = arm angle from straight forward (0) to out to the side (90); `sh` lifts the shoulders (shrug). The far side is faded.
DEMO['Band pull-apart'] = {
  build:q => {
    const c = Math.cos(.75), s = Math.sin(.75), P = (x, y, z) => [100 + x * c + z * s, y + z * .12];
    const sy = 31 + q.sh, r = q.a * Math.PI / 180, arm = d => {
      const o = Math.sin(r), w = Math.cos(r);
      return [P(d * 12, sy, 0), P(d * (12 + 21 * o), sy + 1, 21 * w), P(d * (12 + 41 * o), sy, 41 * w)];
    }, L = arm(-1), R = arm(1);
    return { near:[[P(-9, 124, 0), P(-6, 95, 0), P(0, 66, 0)], [P(0, 66, 0), P(0, 25, 0)], [L[0], P(0, 25, 0), R[0]], L],
      far:[[P(0, 66, 0), P(6, 95, 0), P(9, 124, 0)], R], head:P(0, 13, 0), hr:8, sl:L[0], sr:R[0], hl:L[2], hf:R[2], chest:P(0, 34, 0) };
  },
  front:(f, q) => {   // the band runs hand to hand; as the arms open it comes back to the chest
    const u = Math.sin(q.a * Math.PI / 180) ** 2, m = [(f.hl[0] + f.hf[0]) / 2 * (1 - u) + f.chest[0] * u, (f.hl[1] + f.hf[1]) / 2 * (1 - u) + f.chest[1] * u];
    return `<polyline class="band" style="stroke:#2e8b57;stroke-width:2.5" points="${[f.hl, m, f.hf].map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ')}"/>`;
  },
  keys:[
    { p:{a:0, sh:0}, hold:1600, move:1500, say:'c3', cp:'start' },
    { p:{a:88, sh:0}, hold:1800, move:2000, say:'c2', cp:'end' },
    { p:{a:0, sh:0}, hold:1500, move:1500, say:'c1', cp:'start' },
    { p:{a:80, sh:-7}, hold:2200, move:1000, say:'m1', mark:['sl', 'sr'] },
    { p:{a:88, sh:0}, hold:2000, move:1500, say:'m1fix', cp:'end' },
  ]};

// Dumbbell lateral raise: front view (the figure faces you), seen a little from above. q.yaw turns the view
// (0 = front, 55 = from the figure's right side, to show the lean back of the mistake); a = arms out from the sides,
// b = elbow bend (hands stay below the elbows), t = trunk leaning back, s = shoulders shrugged up.
DEMO['Dumbbell lateral raise'] = {
  build:q => {
    const r = Math.PI / 180, cy = Math.cos(q.yaw * r), sy = Math.sin(q.yaw * r), cE = Math.cos(10 * r), sE = Math.sin(10 * r);
    const P = ([x, y, z]) => { const X = x * cy + z * sy, Z = -x * sy + z * cy; return [100 + X, 124 - (y * cE - Z * sE)]; };
    const D = ([x, y, z]) => -x * sy + z * cy, H = 60, ct = Math.cos(q.t * r), st = Math.sin(q.t * r);
    const up = ([x, y, z]) => [x, H + y * ct + z * st, -y * st + z * ct];   // a point on the upper body, from the hip centre
    const arm = s => { const sh = [12 * s, 36 + q.s, 0], el = [sh[0] + 22 * s * Math.sin(q.a * r), sh[1] - 22 * Math.cos(q.a * r), 3],
        hn = [el[0] + 20 * s * Math.sin((q.a - q.b) * r), el[1] - 20 * Math.cos((q.a - q.b) * r), 5];
      return [sh, el, hn].map(up); };
    const R = arm(-1), L = arm(1), neck = up([0, 38, 0]), head = up([0, 49, 0]);
    const leg = s => [[8 * s, H, 0], [9 * s, 30, 3], [10 * s, 0, 0], [11 * s, 0, 8]];
    const near = [], far = [];
    [[leg(-1)], [leg(1)], [R], [L]].forEach(([l]) => (D(l[1]) < -4 ? far : near).push(l.map(P)));
    near.push([[-8, H, 0], [8, H, 0]].map(P), [[0, H, 0], neck].map(P), [up([-12, 36 + q.s, 0]), up([12, 36 + q.s, 0])].map(P));
    const db = h => [P([h[0], h[1], h[2] - 6]), P([h[0], h[1], h[2] + 6])];
    return { near, far, head:P(head), hr:8, hip:P([0, H, 0]), neck:P(neck), back:P(up([0, 14, 0])), kn:P(leg(-1)[1]), fn:P(leg(-1)[2]),
      kf:P(leg(1)[1]), ff:P(leg(1)[2]), el:P(R[1]), hn:P(R[2]), ef:P(L[1]), hf:P(L[2]), shN:P(R[0]), shF:P(L[0]), dbN:db(R[2]), dbF:db(L[2]) };
  },
  front:f => [f.dbN, f.dbF].map(([a, b]) => `<line class="bar" x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}"/>` +
    [a, b].map(p => `<rect class="gear" x="${(p[0] - 3.5).toFixed(1)}" y="${(p[1] - 3.5).toFixed(1)}" width="7" height="7" rx="1.5"/>`).join('')).join(''),
  keys:[
    { p:{yaw:0, a:10, b:4, t:0, s:0}, hold:1400, move:600, cp:'start' },
    { p:{yaw:0, a:50, b:14, t:0, s:0}, hold:1500, move:500, say:'c1' },
    { p:{yaw:0, a:88, b:16, t:0, s:0}, hold:1900, move:2000, say:'c2', cp:'top' },
    { p:{yaw:0, a:10, b:4, t:0, s:0}, hold:1600, move:1200, say:'c3', cp:'start' },
    { p:{yaw:40, a:90, b:12, t:26, s:2}, hold:2200, move:1000, say:'m1', mark:['back'] },
    { p:{yaw:40, a:88, b:16, t:0, s:0}, hold:2000, move:1400, say:'m1fix', cp:'top' }]};

// Reverse pec deck: seen from behind and above (the figure sits facing away from you, chest on the pad).
// h = arms out from straight ahead (0) to straight out to the sides (90), level at shoulder height;
// b = elbow bend (hands turn in a little); s = shoulders shrugged up toward the ears.
DEMO['Reverse pec deck'] = {
  build:q => {
    const r = Math.PI / 180, cE = Math.cos(20 * r), sE = Math.sin(20 * r);
    const P = ([x, y, z]) => [100 + x, 124 - (y * cE - z * sE)];
    const arm = s => { const sh = [12 * s, 84 + q.s, -2], el = [sh[0] + 22 * s * Math.sin(q.h * r), sh[1] - 1, sh[2] - 22 * Math.cos(q.h * r)],
      hn = [el[0] + 20 * s * Math.sin((q.h - q.b) * r), el[1], el[2] - 20 * Math.cos((q.h - q.b) * r)]; return [sh, el, hn]; };
    const R = arm(1), L = arm(-1), neck = [0, 86, -2], hip = [0, 48, 0];
    const lever = h => [[0, 112, -38], [h[0] * .5, 112, (h[2] - 38) / 2], [h[0], h[1] + 7, h[2]]];
    return { near:[R.map(P), L.map(P), [hip, neck].map(P), [R[0], L[0]].map(P), [[-8, 48, 0], [8, 48, 0]].map(P)],
      far:[], head:P([0, 97, -3]), hr:8, hip:P(hip), neck:P(neck), back:P([0, 66, -1]),
      el:P(R[1]), hn:P(R[2]), ef:P(L[1]), hf:P(L[2]), shN:P(R[0]), shF:P(L[0]),
      levers:[lever(R[2]).map(P), lever(L[2]).map(P)], grips:[R[2], L[2]].map(h => [P([h[0], h[1] - 6, h[2]]), P([h[0], h[1] + 7, h[2]])]) };
  },
  gear:f => { const r = (x0, y0, z0, x1, y1, z1) => { const r = Math.PI / 180, cE = Math.cos(20 * r), sE = Math.sin(20 * r), P = (x, y, z) => (100 + x).toFixed(1) + ',' + (124 - (y * cE - z * sE)).toFixed(1);
        return `<polygon class="prop" points="${[P(x0, y0, z0), P(x1, y0, z0), P(x1, y1, z1), P(x0, y1, z1)].join(' ')}"/>`; };
    return r(-22, 0, 3, 22, 0, -46) + r(-3, 0, -8, 3, 45, -8) + r(-3, 0, -38, 3, 112, -38) + r(-16, 45, 8, 16, 45, -24) + r(-14, 50, -12, 14, 92, -12) +
      f.levers.map(l => `<polyline class="band" style="stroke:var(--muted);stroke-width:3" points="${l.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ')}"/>`).join(''); },
  front:f => f.grips.map(([a, b]) => `<line class="bar" x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}"/>`).join(''),
  keys:[
    { p:{h:14, b:18, s:0}, hold:1800, move:500, say:'c3', cp:'start' },
    { p:{h:48, b:18, s:0}, hold:1300, move:500, say:'c1' },
    { p:{h:90, b:18, s:0}, hold:1900, move:2000, say:'c2', cp:'end' },
    { p:{h:14, b:18, s:0}, hold:900, move:1000 },
    { p:{h:70, b:60, s:9}, hold:2200, move:1000, say:'m1', mark:['shN', 'el'] },
    { p:{h:90, b:18, s:0}, hold:2000, move:2000, say:'m1fix', cp:'end' }]};
function demoAt(d, t){
  const total = d.keys.reduce((n, k) => n + k.hold + k.move, 0);
  t %= total;
  for(let i = 0; i < d.keys.length; i++){
    const k = d.keys[i], nx = d.keys[(i + 1) % d.keys.length];
    if(t < k.hold) return { q:k.p, say:k.say, k, nx, e:0 };
    t -= k.hold;
    if(t < k.move){
      const u = t / k.move, e = u < .5 ? 2 * u * u : 1 - (2 - 2 * u) ** 2 / 2, q = {};
      for(const n in k.p) q[n] = k.p[n] + (nx.p[n] - k.p[n]) * e;
      return { q, k, nx, e };
    }
    t -= k.move;
  }
  return { q:d.keys[0].p, k:d.keys[0], nx:d.keys[0], e:0 };
}
const demoSvg = name => `<svg class="demo" viewBox="0 0 200 130" data-name="${esc(name)}" role="img" aria-label="${esc(name)}, animated">
  ${DEMO[name].floor === false ? '' : '<line class="floor" x1="0" y1="125" x2="200" y2="125"/>'}${DEMO[name].props || ''}<g class="anim"></g></svg><div class="cap"></div>`;
// the words for a step: a line of HOW (docs/exercises.md) named by its code
function sayText(name, code){
  const h = HOW[name] || {}, m = /^(c|m|cap)(\d)(fix)?$/.exec(code || '');
  if(!m) return code || '';
  if(m[1] === 'c') return '✓ ' + ((h.cues || [])[m[2] - 1] || '');
  if(m[1] === 'cap') return '✓ ' + ((h.captions || [])[m[2] - 1] || '');
  const [bad, fix] = ((h.mistakes || [])[m[2] - 1] || '').split(' → ');
  const up = x => x ? x.replace(/^([✓✗] )(\p{Ll})/u, (_, a, b) => a + b.toUpperCase()) : '';
  return up(m[3] ? fix : bad);
}
function drawDemo(svg, name, t){
  const d = DEMO[name], { q, say } = demoAt(d, t), f = d.build ? d.build(q) : side(q, d.root);
  const pl = ps => `<polyline points="${ps.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ')}"/>`;
  const hot = d.hot && d.hot(f), st = demoAt(d, t), k = st.e < .5 ? st.k : st.nx;
  const mark = (k.mark || []).map(n => f[n]).filter(Boolean)
    .map(p => `<circle class="bad" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${(7 + Math.sin(t / 160)).toFixed(1)}"/><text class="badx" x="${p[0].toFixed(1)}" y="${(p[1] - 10).toFixed(1)}">✗</text>`).join('');
  svg.querySelector('.anim').innerHTML = (d.gear ? d.gear(f, q) : '') + `<g class="far">${f.far.map(pl).join('')}</g>${f.extra || ''}` +
    `<circle class="head" cx="${f.head[0].toFixed(1)}" cy="${f.head[1].toFixed(1)}" r="${f.hr}"/>` +
    `<g class="near">${f.near.map(pl).join('')}</g>${f.after || ''}${d.front ? d.front(f, q) : ''}` +
    (hot ? `<circle class="hot" cx="${hot[0].toFixed(1)}" cy="${hot[1].toFixed(1)}" r="${(4.5 + 1.5 * Math.sin(t / 180)).toFixed(1)}"/>` : '') + mark;
  const cap = svg.nextElementSibling, words = sayText(name, k.say || (st.e < .5 ? say : '') || d.caption);
  if(cap && cap.classList.contains('cap') && cap.dataset.say !== words){ cap.dataset.say = words; cap.textContent = words; cap.className = 'cap' + (words.startsWith('✗') ? ' bad' : words ? ' good' : ''); }
}
// tap a move or a cue line: its animation (if built) plus the checked cues and mistakes (docs/exercises.md)
function howBox(name){
  const h = HOW[name], anim = DEMO[name] ? demoSvg(name) : '';
  const list = h ? `<ul class="howlist">${h.cues.map(c => `<li class="ok">✓ ${esc(c)}</li>`).join('')}${h.mistakes.map(m => `<li class="no">${esc(m)}</li>`).join('')}</ul>` : '';
  return `<div class="demowrap">${anim}${list}</div>`;
}
const cueLine = (name, fallback) => HOW[name] ? HOW[name].cues.join(' · ') : fallback;
// one animation loop while a demo is on screen
let demoOpen = null, demoRaf = 0;
function runDemos(){
  const drawAll = now => {
    const svgs = document.querySelectorAll('svg.demo');
    svgs.forEach(s => drawDemo(s, s.dataset.name, now));
    return svgs.length;
  };
  drawAll(performance.now());   // first frame straight away, no blank box
  if(demoRaf) return;
  const frame = now => { demoRaf = drawAll(now) ? requestAnimationFrame(frame) : 0; };
  demoRaf = requestAnimationFrame(frame);
}

// A timed set's seconds box (user, 2026-10-25): the whole box is the play button — tap the side you
// start with, that side is timed first, then the other. Press and hold (0.5 s) turns it into a box to type in.
// f: 'l' / 'r' / 'reps'; sugg: the greyed-in seconds (last time, else the top of the range).
let editing = null;   // 'i.j.f' of the seconds box being typed in
function secCell(i, j, s, f, sugg){
  const key = `${i}.${j}.${f}`, side = f === 'reps' ? '' : f, word = { l:' left', r:' right', '':'' }[side];
  if(editing === key) return `<input inputmode="numeric" data-edit data-i="${i}" data-j="${j}" data-f="${f}" value="${esc(s[f] || '')}" placeholder="${esc(sugg)}" aria-label="Set ${j+1}${word} seconds">`;
  const v = s[f] || '';
  return `<button class="secbtn" data-press="${key}" data-i="${i}" data-j="${j}" data-f="${f}" data-sugg="${esc(sugg)}"
    ${s.done ? '' : `data-hold="set.${i}.${j}${side ? '.' + side : ''}"`} aria-label="Set ${j+1}${word}: ${s.done ? '' : 'tap to time, '}hold to type">${
    s.done ? esc(v || '–') : `<span class="pl">▶</span> ${v ? esc(v) : `<span class="sg">${esc(sugg)}</span>`}`}</button>`;
}

// ---------- Formatting ----------
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const range = ex => ex.min === ex.max ? ex.min : `${ex.min}–${ex.max}`;
const rx = ex => `${ex.sets} × ${range(ex)}${ex.time ? ' s' : ''}${ex.side ? ' / ' + (ex.sideWord || 'side') : ''}`;
const rxOf = (ex, name) => { const tm = timedOf(ex, name);
  return tm && !ex.time ? `${ex.sets} × ${range(tm)} s` : rx(ex); };
const topOf = (ex, name) => (timedOf(ex, name) || ex).max;
// seconds of a timed set: per side "L 45s / R 38s", else "45s"
const secTxt = s => s.l != null && s.l !== '' || s.r != null && s.r !== '' ? `L ${s.l || '–'}s / R ${s.r || '–'}s` : `${s.reps}s`;
const restTxt = s => s >= 60 && s % 60 === 0 ? `${s/60} min` : s > 60 ? `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}` : `${s}s`;
const mmss = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
const round = (kg, step) => Math.round(kg / step) * step;
const dateTxt = t => new Date(t).toLocaleDateString(undefined, { weekday:'short', day:'numeric', month:'short' });
const setTxt = (s, ex, name, bw) => {
  const tm = timedOf(ex, name || (ex && ex.name)), amt = tm ? secTxt(s) : s.reps;
  if(s.band) return `${s.band.split('+').join(' + ')}${s.kg ? ` (${s.kg} kg)` : ''} × ${amt}`;
  if(s.kg === '' || s.kg == null) return `${amt}${tm ? '' : ' reps'}`;
  const load = loadOf(name || (ex && ex.name) || '');
  if(bwOf(name || (ex && ex.name) || '')) return `BW + ${s.kg} kg${load === 'hand' ? '/hand' : ''} × ${amt}`;
  if(load === 'assist'){ const l = lifted(s, name, bw); return `assist ${s.kg} kg${l != null ? ` (lift ${l})` : ''} × ${amt}`; }
  return `${s.kg} kg${load === 'hand' ? '/hand' : ''} × ${amt}`;
};

// ---------- Render ----------
const $main = document.getElementById('main');
// Workouts are the tabs; History, Report and Settings sit behind the ⋯ menu, with ← back to the workout.
const PAGES = { history:'History', report:'Report', settings:'Settings' };
let lastDay = view;          // where ← goes back to
const opened = new Set();    // folded cards the user tapped open again (until the tab changes)
function render(){
  const page = PAGES[view];
  if(!page) lastDay = view;
  document.getElementById('tabs').hidden = !!page;
  document.getElementById('back').hidden = !page;
  document.getElementById('title').textContent = page || (view === 'supp' ? 'Supplements' : PLAN[view].title);
  document.getElementById('tabs').innerHTML =
    ALL.map(d => `<button data-tab="${d}" aria-current="${view===d}">${PLAN[d].tab}${drafts[d]?.startedAt ? '<span class="dot"></span>' : ''}</button>`).join('')
    + `<button data-tab="supp" aria-current="${view==='supp'}" aria-label="Supplements">S${suppDue() ? '<span class="dot" style="background:var(--hint)"></span>' : ''}</button>`;
  document.querySelectorAll('#menu [data-tab]').forEach(b => b.setAttribute('aria-current', b.dataset.tab === view));
  view === 'history' ? renderHistory() : view === 'settings' ? renderSettings() : view === 'report' ? renderReport() : view === 'supp' ? renderSupp() : renderDay(view);
  tickClock(); runDemos();
}
function showMenu(on){
  document.getElementById('menu').hidden = !on;
  document.getElementById('more').setAttribute('aria-expanded', on);
}

function renderDay(day){
  const p = PLAN[day], d = draft(day, false), reset = resetFor(day);
  let h = `<p class="focus">${p.focus}</p>`;
  if(!d.startedAt){
    const other = running(day);
    h += other ? `<div class="box"><b>${PLAN[other].title} is running.</b> Finish or clear it before starting this one.
        <div class="actions"><button class="btn ghost" data-tab="${other}">Go to ${PLAN[other].title}</button></div></div>`
      : `<button class="btn start" data-act="start">▶ Start ${esc(p.title)}</button>`;
  }
  // a finished desk reset folds to one line; tap to open it again
  if(resetDone(d) === reset.length && !opened.has('reset'))
    h += `<button class="fold" data-unfold="reset"><span class="num">✓</span><span class="what"><b>Desk reset</b>
      <span class="small">${reset.length}/${reset.length} · tap to open</span></span></button>`;
  else h += `<div class="box reset"><h3>Desk reset (~5 min) <span class="small">${resetDone(d)}/${reset.length}</span></h3>
    ${reset.map((r, k) => `<div class="rrow ${(d.reset || [])[k] ? 'done' : ''} ${r.secs ? 'timed' : ''}">
      <button class="mv" data-demo="${esc(r.name)}" aria-expanded="${demoOpen === r.name}" title="Tap to see how">
        <b>${esc(r.name)}</b> · ${esc(r.dose)} <span class="play">${demoOpen === r.name ? '▾' : '▸'}</span><span class="small">${esc(cueLine(r.name, r.cue))}</span>${heldTxt(d, 'reset', k, r)}</button>
      ${r.secs ? `<button class="tmrs" data-hold="reset.${k}" aria-label="Time ${esc(r.name)}">▶</button>` : ''}
      <button class="tick" data-reset="${k}" aria-label="${esc(r.name)} done">✓</button>
      ${demoOpen === r.name ? howBox(r.name) : ''}</div>`).join('')}
    <div class="small">Hip flexors are the stretch that matters most. ${day === 'home' ? 'Start every set with the same band and distance as last time.' : 'Warm-up sets only for exercise 1.'}</div></div>`;

  p.ex.forEach((ex, i) => {
    const slot = d.slots[i], last = lastFor(slot.name);
    const doneCount = slot.sets.filter(s => s.done).length;
    const options = [ex.name, ...ex.alts].map(n => `<option ${n===slot.name?'selected':''}>${esc(n)}</option>`).join('');
    const load = loadOf(slot.name), bwk = bwOf(slot.name), band = bandOf(slot.name), picked = slot.band || [];
    const tm = timedOf(ex, slot.name);
    let hint = '';
    if(last && last.sets.length >= ex.sets && last.sets.every(s => +s.reps >= topOf(ex, slot.name)))
      hint = `Hit the top of the range on every set last time → ${nextStep(ex, slot.name, last.sets)}, restart at the bottom.`;
    let unit = tm ? 'Tap a seconds box to time it · hold to type. ' : '';
    unit += bwk === 'plus' ? `Body weight. Holding weight? Enter ${load === 'hand' ? 'one dumbbell' : 'the extra kg'}; leave it empty if none.`
             : bwk === 'only' ? '' : load === 'hand' ? 'Dumbbells: enter the weight of one dumbbell.' : '';
    unit = unit.trim();
    if(load === 'assist'){
      const lifts = slot.sets.filter(s => s.kg !== '').map(s => lifted(s, slot.name));
      unit = !bodyweight ? 'Enter the assist. Add your body weight in ⋯ → Settings to see what you lift.'
           : `Enter the assist. You lift ${bodyweight} − assist${lifts.length && lifts.every(l => l != null) ? `: ${lifts.join(' · ')} kg` : ''}.`;
    }
    if(band){
      const kg = bandKg(slot.name, picked);
      unit = band === 'loop' ? 'Tap the band you use.'
           : `Tap the ${band === 'tube' ? 'tubes on the handle (stack them for more)' : 'band (or two together)'}.`
             + (kg ? ` Now: ${picked.join(' + ')} = ${kg} kg.` : '');
    }
    if(i === 0 && !band && !bwk){
      const top = last ? Math.max(...last.sets.map(s => +s.kg || 0)) : 0;
      hint = (top ? `Warm-up sets: ${round(top*.5, 2.5)} kg × 5, then ${round(top*.8, 2.5)} kg × 3. ` : 'Warm-up sets: ~50% × 5, then ~80% × 3. ') + hint;
    }
    // a finished exercise folds to one line with what was done; tap to open it again
    if(doneCount >= slot.sets.length && !opened.has(i)){
      h += `<button class="fold ex" data-unfold="${i}"><span class="num">✓</span><span class="what"><b>${esc(slot.name)}</b>
        <span class="small">${slot.sets.map(s => esc(setTxt(s, ex, slot.name))).join(' · ')}</span></span></button>`;
      return;
    }
    h += `<article class="ex ${doneCount >= slot.sets.length ? 'complete' : ''}">
      <div class="ex-head"><div class="num">${i+1}</div>
        <div class="ex-title">
          <div class="pick"><select data-swap="${i}" aria-label="Exercise (tap to swap)">${options}</select></div>
          <div class="rx">${rxOf(ex, slot.name)} · rest ${restTxt(ex.rest)} ${slot.name !== ex.name ? '· <span class="swap">swapped</span>' : ''}</div>
        </div>${HOW[slot.name] || DEMO[slot.name] ? `<button class="vid" data-demo="${esc(slot.name)}" aria-expanded="${demoOpen === slot.name}" aria-label="How to do ${esc(slot.name)}" title="How to do it"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="3.5"/><path d="M10 9.2v5.6l4.8-2.8z"/></svg></button>` : ''}</div>
      <p class="cue">${esc(cueLine(slot.name, ex.cue))}</p>
      ${demoOpen === slot.name ? howBox(slot.name) : ''}
      ${hint ? `<div class="hint">${esc(hint)}</div>` : ''}
      ${last ? `<div class="last">Last (${dateTxt(last.at)}): ${last.sets.map(s => esc(setTxt(s, ex, slot.name))).join(' · ')}</div>` : ''}
      ${unit ? `<div class="unitnote">${esc(unit)}</div>` : ''}
      ${band ? `<div class="bands">${BANDS[band].list.map(([c, col, kg]) =>
        `<button class="chip" data-band="${i}.${esc(c)}" aria-pressed="${picked.includes(c)}"><span class="sw" style="background:${col}"></span>${esc(c)}${kg ? ` <span class="kg">${kg}</span>` : ''}</button>`).join('')}</div>` : ''}
      <div class="sets">
        <div class="row head"><span></span><span>${headOf(slot.name)}</span><span>${tm ? (tm.sides ? 'sec L · R' : 'sec') : 'reps'}</span><span></span></div>
        ${slot.sets.map((s, j) => {
          const ref = last ? (last.sets[j] || last.sets[last.sets.length-1]) : null;
          const lastKg = ref && ref.kg !== '' && ref.kg != null ? ref.kg : '';
          return `<div class="row ${s.done ? 'done' : ''}">
            <span class="i">${j+1}</span>
            ${band ? `<span class="bwcell">${esc(s.done ? (band === 'loop' ? s.band || '–' : s.kg || '–') : (band === 'loop' ? picked[0] || '–' : bandKg(slot.name, picked) || '–'))}</span>`
              : bwk === 'only' ? '<span class="bwcell">BW</span>'
              : `<input inputmode="decimal" data-i="${i}" data-j="${j}" data-f="kg" data-last="${esc(lastKg)}" value="${esc(s.kg)}" placeholder="${lastKg !== '' ? esc(lastKg) : bwk ? 'BW' : '–'}" aria-label="Set ${j+1} ${headOf(slot.name)}">`}
            ${tm && tm.sides ? `<span class="lr">${['l', 'r'].map(f => secCell(i, j, s, f, ref ? ref[f] || ref.reps : tm.max)).join('')}</span>`
              : tm ? secCell(i, j, s, 'reps', ref ? ref.reps : tm.max)
              : `<input inputmode="numeric" data-i="${i}" data-j="${j}" data-f="reps" value="${esc(s.reps)}" placeholder="${ref ? esc(ref.reps) : ex.max}" aria-label="Set ${j+1} reps">`}
            <button class="tick" data-tick="${i}.${j}" aria-label="Set ${j+1} done">✓</button>
          </div>`;}).join('')}
      </div>
      <div class="setbtns"><button class="link" data-addset="${i}">+ set</button>
        ${slot.sets.length > 1 && !slot.sets[slot.sets.length-1].done ? `<button class="link" data-delset="${i}">− set</button>` : ''}</div>
    </article>`;
  });

  if(day === 'home'){
    const cool = d.cool || [];
    if(cool.filter(Boolean).length === COOL.length && !opened.has('cool'))
      h += `<button class="fold" data-unfold="cool"><span class="num">✓</span><span class="what"><b>Cool-down: back care</b>
        <span class="small">${COOL.length}/${COOL.length} · tap to open</span></span></button>`;
    else h += `<div class="box reset"><h3>Cool-down: back care <span class="small">${cool.filter(Boolean).length}/${COOL.length}</span></h3>
      ${COOL.map((r, k) => `<div class="rrow ${cool[k] ? 'done' : ''} ${r.secs ? 'timed' : ''}">
        <button class="mv" data-demo="${esc(r.name)}" aria-expanded="${demoOpen === r.name}" title="Tap to see how">
          <b>${esc(r.name)}</b> · ${esc(r.dose)} <span class="play">${demoOpen === r.name ? '▾' : '▸'}</span><span class="small">${esc(cueLine(r.name, r.cue))}</span>${heldTxt(d, 'cool', k, r)}</button>
        ${r.secs ? `<button class="tmrs" data-hold="cool.${k}" aria-label="Time ${esc(r.name)}">▶</button>` : ''}
        <button class="tick" data-cool="${k}" aria-label="${esc(r.name)} done">✓</button>
        ${demoOpen === r.name ? howBox(r.name) : ''}</div>`).join('')}</div>`;
  }
  h += `<div class="box"><h3>Notes</h3>
      <textarea id="notes" placeholder="How did it feel? Anything to change?">${esc(d.notes)}</textarea></div>
    <div class="actions"><button class="btn ghost" data-act="discard">Clear day</button>
      <button class="btn" data-act="finish">Finish workout</button></div>
    <div class="box small">Stop each set ~2 reps short of failure (machines and raises can go closer).
      When every set hits the top of the range, add the smallest step and restart at the bottom.
      A missed day moves to the next day — never merge two sessions.</div>`;
  $main.innerHTML = h;
}

function renderSupp(){
  if(!supp){
    $main.innerHTML = `<p class="empty">No supplement list on this phone yet.</p>
      <p class="small">Your list is kept in your private repo. ${ghReady() ? 'It loads by itself when there is signal.' : 'Add the GitHub token in ⋯ → Settings and it loads by itself.'}</p>`;
    return;
  }
  const day = dayKey(), now = Date.now();
  let h = `<p class="focus">${dateTxt(now)}</p>`;
  supp.slots.forEach(sl => {
    const done = slotDone(day, sl), due = slotDue(sl, now);
    const at = sl.items.map(x => suppLog[day]?.[x.id]).filter(v => v && v.on).map(v => v.t);
    const st = done ? `✓ ${sl.time ? hhmm(Math.max(...at)) : 'taken'}` : due ? 'due' : sl.time ? `at ${sl.time}` : '';
    h += `<div class="box slot ${done ? 'ok' : due ? 'due' : ''}"><h3>${esc(sl.time || sl.label || 'Any time')}<span class="st ${done ? 'ok' : due ? 'due' : ''}">${esc(st)}</span></h3>
      ${sl.note ? `<div class="small">${esc(sl.note)}</div>` : ''}
      ${sl.items.map(x => `<div class="srow ${taken(day, x.id) ? 'done' : ''}"><span><b>${esc(x.name)}</b> · ${esc(x.dose)}${x.optional ? ' <span class="small" style="display:inline">· optional</span>' : ''}
          ${taken(day, x.id) ? `<span class="small">taken ${hhmm(suppLog[day][x.id].t)}</span>` : ''}</span>
        <button class="tick" data-supp="${esc(x.id)}" aria-label="${esc(x.name)} taken">✓</button></div>`).join('')}
      ${sl.time && !done && sl.items.length > 1 ? `<div class="actions" style="margin:8px 0 2px"><button class="btn ghost" data-suppall="${esc(sl.id)}">✓ All taken</button></div>` : ''}
    </div>`;
  });
  h += `<p class="small">Doses stay the same every day; change them in ⋯ → Settings → Supplements. ${syncText()}</p>`;
  $main.innerHTML = h;
}

function renderHistory(){
  let h = `<p class="small">${syncText()}</p>`;
  if(!history.length) h += `<p class="empty">No finished workouts yet.</p>`;
  [...history].reverse().forEach(s => {
    const p = PLAN[s.day];
    const sets = s.slots.reduce((n, x) => n + x.sets.filter(t => t.done).length, 0);
    const mins = s.finishedAt && s.startedAt ? Math.round((s.finishedAt - s.startedAt) / 60000) : null;
    h += `<details class="sess"><summary>${dateTxt(s.startedAt)} · ${p ? p.title : s.day} <span>· ${sets} sets${mins ? ` · ${mins} min` : ''}</span></summary><ul>
      ${s.slots.filter(x => x.sets.some(t => t.done)).map(x => {
        const ex = p && p.ex.find(e => e.name === x.name || e.alts.includes(x.name));
        return `<li><b>${esc(x.name)}</b>: ${x.sets.filter(t => t.done).map(t => esc(setTxt(t, ex, x.name, s.bw))).join(' · ')}</li>`;
      }).join('')}</ul>
      ${s.notes ? `<p class="small">${esc(s.notes)}</p>` : ''}
      <p><button class="link" data-delsess="${s.id}">Delete this workout</button></p></details>`;
  });
  $main.innerHTML = h;
}

function renderReport(){
  if(!history.length){ $main.innerHTML = `<p class="empty">No finished workouts yet. The report appears after your first one.</p>`; return; }
  const s = history.find(x => x.id === reportId) || history[history.length - 1];
  const p = PLAN[s.day];
  const mins = s.finishedAt && s.startedAt ? Math.round((s.finishedAt - s.startedAt) / 60000) : null;
  const all = s.slots.flatMap(x => x.sets), done = all.filter(t => t.done).length;

  let h = `<div class="box noprint rep"><select id="repSel" aria-label="Workout">${[...history].reverse().map(x =>
    `<option value="${esc(x.id)}" ${x.id === s.id ? 'selected' : ''}>${dateTxt(x.startedAt)} · ${PLAN[x.day] ? PLAN[x.day].title : esc(x.day)}</option>`).join('')}</select></div>`;

  // 1. The workout, exercise by exercise, against the time before
  const rows = s.slots.map(x => {
    const sets = x.sets.filter(t => t.done), ex = exFor(x.name);
    const count = `<div class="small">${sets.length}/${x.sets.length} sets${sets.length < x.sets.length ? ' · <span class="down">' + (x.sets.length - sets.length) + ' skipped</span>' : ''}</div>`;
    if(!sets.length) return `<tr><td><b>${esc(x.name)}</b>${count}</td><td>—</td><td class="n">—</td></tr>`;
    const b = best(sets, x.name, s.bw), sc = score(b, x.name, s.bw), prev = prevFor(x.name, s.startedAt);
    let vs = '<span class="small">first time</span>';
    if(prev){
      const pb = best(prev.sets, x.name, prev.bw), pc = score(pb, x.name, prev.bw);
      const arrow = sc > pc * 1.005 ? '<span class="up">↑</span>' : sc < pc * .995 ? '<span class="down">↓</span>' : '=';
      const ever = Math.max(...history.filter(o => o.startedAt < s.startedAt).flatMap(o => o.slots.filter(y => y.name === x.name)
        .flatMap(y => y.sets.filter(t => t.done).map(t => score(t, x.name, o.bw)))));
      vs = `${arrow} <span class="small">${esc(setTxt(pb, ex, x.name, prev.bw))}</span>${sc > ever ? '<div class="star">★ best ever</div>' : ''}`;
    }
    return `<tr><td><b>${esc(x.name)}</b>${count}</td><td>${esc(setTxt(b, ex, x.name, s.bw))}</td><td class="n">${vs}</td></tr>`;
  }).join('');
  h += `<div class="box rep"><h3>${dateTxt(s.startedAt)} · ${p ? p.title : esc(s.day)}</h3>
    <p class="small">${done} of ${all.length} sets${mins ? ` · ${mins} min` : ''} · desk reset ${resetDone(s) === RESET.length ? '✓' : `${resetDone(s)}/${RESET.length}`}</p>
    <table><tr><th>Exercise</th><th>Best set</th><th class="n">vs last time</th></tr>${rows}</table>
    ${s.notes ? `<p class="small">Notes: ${esc(s.notes)}</p>` : ''}</div>`;

  // 2. Next time: exercises whose latest session hit the top of the range on every set
  const next = [], listed = new Set();   // ab wheel and split squat are in B and at home: list them once
  ALL.forEach(d => PLAN[d].ex.forEach(ex => {
    const last = [ex.name, ...ex.alts].map(n => ({ n, l:lastFor(n) })).filter(o => o.l).sort((a, b) => b.l.at - a.l.at)[0];
    if(last && !listed.has(last.n) && listed.add(last.n) && last.l.sets.length >= ex.sets && last.l.sets.every(t => +t.reps >= topOf(ex, last.n)))
      next.push(`<li><b>${esc(last.n)}</b> (${PLAN[d].title}) — ${nextStep(ex, last.n, last.l.sets)}</li>`);
  }));
  h += `<div class="box rep"><h3>Next time</h3>${next.length ? `<ul>${next.join('')}</ul>`
    : '<p class="small">Nothing to raise yet — keep adding reps until every set reaches the top of its range.</p>'}</div>`;

  // 3. This week against last week: sessions and hard sets per muscle group
  const wk = weekStart(Date.now()), prevWk = wk - 7 * 864e5;
  const tally = (from, to) => {
    const ses = history.filter(o => o.startedAt >= from && o.startedAt < to), g = {};
    ses.forEach(o => o.slots.forEach(x => { const mg = exFor(x.name)?.mg || 'Other'; g[mg] = (g[mg] || 0) + x.sets.filter(t => t.done).length; }));
    return { n:ses.length, g, reset:ses.filter(o => resetDone(o) === RESET.length).length };
  };
  const a = tally(wk, wk + 7 * 864e5), b = tally(prevWk, wk);
  // habit streak: weeks in a row where every workout started with the full desk reset
  let streak = 0;
  for(let w = a.n ? wk : prevWk; ; w -= 7 * 864e5){
    const x = tally(w, w + 7 * 864e5);
    if(!x.n || x.reset < x.n) break;
    streak++;
  }
  h += `<div class="box rep"><h3>This week</h3>
    <p class="small">${a.n} of 3 workouts done (last week ${b.n}).</p>
    <p class="small">Desk reset: ${a.reset} of ${a.n} workouts (last week ${b.reset} of ${b.n})${streak ? ` · <b>${streak} week${streak === 1 ? '' : 's'} in a row</b>` : ''}.</p>
    <table><tr><th>Sets per muscle</th><th class="n">This week</th><th class="n">Last week</th></tr>
    ${GROUPS.concat(a.g.Other || b.g.Other ? ['Other'] : []).map(g => `<tr><td>${g}</td><td class="n">${a.g[g] || 0}</td><td class="n">${b.g[g] || 0}</td></tr>`).join('')}</table></div>
    <div class="actions noprint"><button class="btn ghost" data-act="print">Save as PDF</button></div>`;
  $main.innerHTML = h;
}

// ---------- Events ----------
// Press and hold a seconds box → type in it (a tap times it). The buzz says it switched.
let pressT = 0, pressed = false;
document.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-press]'); if(!b) return;
  clearTimeout(pressT);
  pressT = setTimeout(() => {
    pressed = true; editing = b.dataset.press;
    try{ navigator.vibrate && navigator.vibrate(30); }catch(e){}
    render();
    const el = document.querySelector('[data-edit]'); if(el){ el.focus(); el.select(); }
  }, 500);
});
['pointerup', 'pointercancel'].forEach(n => document.addEventListener(n, () => {
  clearTimeout(pressT);
  if(pressed) setTimeout(() => { pressed = false; }, 0);   // swallow the click that ends a long press
}));
document.addEventListener('scroll', () => clearTimeout(pressT), true);
document.addEventListener('contextmenu', e => { if(e.target.closest('[data-press]')) e.preventDefault(); });
document.addEventListener('focusout', e => { if(e.target.matches && e.target.matches('[data-edit]')) editing = null; });

document.addEventListener('click', e => {
  if(pressed){ pressed = false; return; }
  const t = e.target.closest('button'); if(!t){ showMenu(false); return; }
  if(t.id === 'more'){ showMenu(document.getElementById('menu').hidden); return; }
  showMenu(false);
  if(t.dataset.tab){ if(t.dataset.tab !== view) opened.clear(); view = t.dataset.tab; store.set('fb3.view', view); render(); scrollTo(0, 0); return; }
  if(t.id === 'back'){ view = lastDay; render(); scrollTo(0, 0); return; }
  if(t.dataset.unfold){ const k = t.dataset.unfold; opened.add(/^\d+$/.test(k) ? +k : k); render(); return; }
  if(t.dataset.rest){ adjustRest(t.dataset.rest); return; }

  if(t.dataset.tick){
    if(!begin(view, true)) return;
    const [i, j] = t.dataset.tick.split('.').map(Number), s = draft(view, true).slots[i].sets[j];
    s.done = !s.done;
    if(s.done) setDone(view, i, j);
    save(); render(); return;
  }
  if(t.dataset.hold){ startHold(view, t.dataset.hold); return; }
  if(t.dataset.supp){ const id = t.dataset.supp; setTaken(id, !taken(dayKey(), id)); render(); sync(); return; }
  if(t.dataset.suppall){
    supp.slots.find(sl => sl.id === t.dataset.suppall).items.forEach(x => { if(!taken(dayKey(), x.id)) setTaken(x.id, true); });
    render(); sync(); return;
  }
  if(t.dataset.sadd || t.dataset.sdel){
    readSuppEdit();
    if(t.dataset.sadd) supp.slots[+t.dataset.sadd].items.push({ id:'', name:'', dose:'' });
    else { const [k, n] = t.dataset.sdel.split('.').map(Number); supp.slots[k].items.splice(n, 1); }
    render(); document.getElementById('suppEdit').open = true; return;
  }
  if(t.dataset.holdAct){ holdAct(t.dataset.holdAct); return; }
  if(t.dataset.reset){
    if(!begin(view, true)) return;
    const d = draft(view, true), k = +t.dataset.reset;
    d.reset = RESET.map((_, n) => !!(d.reset || [])[n]); d.reset[k] = !d.reset[k];
    save(); render(); return;
  }
  if(t.dataset.cool){
    if(!begin(view, true)) return;
    const d = draft(view, true), k = +t.dataset.cool;
    d.cool = COOL.map((_, n) => !!(d.cool || [])[n]); d.cool[k] = !d.cool[k];
    save(); render(); return;
  }
  if(t.dataset.band){
    const [i, c] = t.dataset.band.split('.'), slot = draft(view, true).slots[+i], b = BANDS[bandOf(slot.name)];
    const now = slot.band || [];
    slot.band = now.includes(c) ? now.filter(x => x !== c) : b.stack ? [...now, c] : [c];
    slot.band.sort((x, y) => b.list.findIndex(z => z[0] === x) - b.list.findIndex(z => z[0] === y));
    save(); render(); return;
  }
  if(t.dataset.demo){ demoOpen = demoOpen === t.dataset.demo ? null : t.dataset.demo; render(); return; }
  if(t.dataset.addset){ draft(view, true).slots[+t.dataset.addset].sets.push(newSet()); save(); render(); return; }
  if(t.dataset.delset){ draft(view, true).slots[+t.dataset.delset].sets.pop(); save(); render(); return; }
  if(t.dataset.delsess){
    if(confirm('Delete this workout from the log?')){
      const gone = history.find(s => s.id === t.dataset.delsess);
      history = history.filter(s => s.id !== t.dataset.delsess);
      if(gone && gone.synced){ deleted.push({ path:pathFor(gone) }); store.set('fb3.deleted', deleted); }
      save(); render(); sync();
    }
    return;
  }
  const act = t.dataset.act;
  if(act === 'start'){ begin(view, false); save(); render(); return; }
  if(act === 'finish'){
    const d = drafts[view];
    const filled = d ? d.slots.flatMap(x => x.sets).filter(s => !s.done && s.reps !== '') : [];
    if(!d || !d.slots.some(x => x.sets.some(s => s.done))){
      // forgiving: sets with numbers typed in but never ticked still count
      if(!filled.length){ toast('Nothing logged yet — tap ✓ after each set'); return; }
      if(!confirm(`No sets ticked. Save the ${filled.length} set${filled.length === 1 ? '' : 's'} you filled in?`)) return;
      filled.forEach(s => s.done = true);
    } else {
      if(!confirm(filled.length ? `Finish and save? ${filled.length} filled-in set${filled.length === 1 ? '' : 's'} without ✓ will be saved too.` : 'Finish and save this workout?')) return;
      filled.forEach(s => s.done = true);
    }
    if(!d.startedAt) d.startedAt = Date.now() - LATE_START;   // typed in, never started
    // id: time + random suffix, so two workouts can never share one (or one file name)
    history.push({ ...d, id: Date.now() + Math.random().toString(36).slice(2, 7), finishedAt: Date.now(),
      ...(bodyweight ? { bw: bodyweight } : {}), synced: false });
    delete drafts[view]; save(); stopRest(); render(); scrollTo(0, 0); toast('Workout saved ✓'); sync();
  }
  if(act === 'discard'){
    if(drafts[view] && confirm('Clear everything entered for today? (Saved workouts are kept.)')){ delete drafts[view]; save(); render(); }
  }
  if(act === 'ghsave'){
    const v = id => document.getElementById(id).value.trim();
    const next = { repo:v('ghRepo'), branch:v('ghBranch') || 'main', token:v('ghToken') || gh.token };
    if(!/^[\w.-]+\/[\w.-]+$/.test(next.repo) || !/^[\w./-]+$/.test(next.branch) || /\s/.test(next.token)){
      toast('Check the repo (owner/name), branch and token'); return;
    }
    gh = next;
    store.set('fb3.gh', gh); toast('GitHub settings saved'); sync(); render();
  }
  if(act === 'suppsave'){
    readSuppEdit();
    if(supp.slots.some(sl => sl.items.some(x => !x.name.trim() || !x.dose.trim()))){ toast('Every supplement needs a name and a dose'); return; }
    suppDirty.plan = true; saveSupp(); toast('Supplements saved'); render(); sync();
  }
  if(act === 'ghforget' && confirm('Remove the GitHub token from this phone?')){ gh.token = ''; store.set('fb3.gh', gh); render(); }
  if(act === 'ghpull') pullFromGitHub();
  if(act === 'print') window.print();
  if(act === 'backup') download(`fitness-backup-${new Date().toISOString().slice(0,10)}.json`,
    JSON.stringify({ version:1, history, drafts }, null, 2), 'application/json');
  if(act === 'restore') document.getElementById('importFile').click();
});

  const t = e.target;

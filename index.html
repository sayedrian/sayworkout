// A set was just ticked (or timed): fill in what was left empty, then start the rest timer.
function setDone(day, i, j){
  const d = draft(day, true), slot = d.slots[i], s = slot.sets[j], ex = PLAN[day].ex[i];
  const box = f => day === view ? document.querySelector(`[data-i="${i}"][data-j="${j}"][data-f="${f}"]`) : null;
  const sugg = f => box(f) ? box(f).placeholder || box(f).dataset.sugg || '' : '';
  // one tap if the numbers match last time: take the greyed-in values (body-weight exercises have none)
  const kgIn = box('kg');
  if(s.kg === '' && kgIn && kgIn.dataset.last) s.kg = kgIn.dataset.last;
  const tm = timedOf(ex, slot.name);
  if(tm && tm.sides){
    ['l', 'r'].forEach(f => { if(!s[f]) s[f] = sugg(f); });
    sideMin(s);
  } else if(s.reps === '') s.reps = sugg('reps');
  // bands: the colours tapped for this exercise, and their kg
  if(bandOf(slot.name)){ const c = slot.band || []; s.band = c.join('+'); s.kg = bandKg(slot.name, c); }
  const lastSet = slot.sets.every(x => x.done);
  startRest(ex.rest, lastSet ? `Next: ${PLAN[day].ex[i+1]?.name || 'finish'}` : `${slot.name} · set ${j+2}`);
}
// a per-side hold counts as its weaker side for the range and progress ("every set at the top")
function sideMin(s){
  const n = [s.l, s.r].map(parseFloat).filter(x => !isNaN(x));
  s.reps = n.length ? String(Math.min(...n)) : '';
}

// ---------- Hold timer (2026-10-25): time a hold without leaving the page ----------
// ▶ → 3 s to get into position (only Cancel) → counts up; beeps + vibrates at the bottom of the range and again at the top,
// keeps counting until the button: "Change side" (then 5 s to switch, right starts by itself) or "Done". The seconds go into the set
// (then the rest timer starts) or, for the desk reset and cool-down, into `holds` and the ✓.
const READY_S = 3, SWITCH_S = 5;
let hold = null;
const $hold = document.getElementById('hold');
// what ▶ times: 'set.i.j' (an exercise set), 'reset.k' or 'cool.k'
function holdPlan(day, key){
  const [kind, a, b, c] = key.split('.'), sides = ['Left', 'Right'];
  if(kind === 'set'){   // 'set.i.j.r' = right side first
    const ex = PLAN[day].ex[+a], slot = draft(day, true).slots[+a], tm = timedOf(ex, slot.name);
    return { title:`${slot.name} · set ${+b + 1}`, min:tm.min, max:tm.max, steps:!tm.sides ? [''] : c === 'r' ? ['Right', 'Left'] : sides };
  }
  const r = (kind === 'reset' ? resetFor(day) : COOL)[+a], rounds = r.rounds || 1;
  const steps = Array.from({ length:rounds }, (_, n) => (r.sides ? sides : ['']).map(x => [rounds > 1 ? `Round ${n + 1}` : '', x].filter(Boolean).join(' · '))).flat();
  return { title:r.name, min:r.secs, max:r.secs, steps };
}
function startHold(day, key){
  if(hold || !begin(day, true)) return;
  primeAudio(); stopRest();
  hold = { day, key, ...holdPlan(day, key), step:0, secs:[], phase:'ready', at:Date.now() + READY_S * 1000, sig:0, left:null };
  save(); render(); tickHold();
}
function holdAct(a){
  if(!hold) return;
  if(a === 'cancel'){ hold = null; tickHold(); return; }
  if(hold.phase !== 'run') return;   // countdowns run out by themselves
  hold.secs.push(Math.floor((Date.now() - hold.at) / 1000));
  if(++hold.step < hold.steps.length){ hold.phase = 'switch'; hold.at = Date.now() + SWITCH_S * 1000; hold.left = null; tickHold(); return; }
  finishHold();
}
function finishHold(){
  const { day, key, secs, steps } = hold, [kind, a, b] = key.split('.'), d = draft(day, true);
  hold = null;
  if(kind === 'set'){
    const s = d.slots[+a].sets[+b];
    if(secs.length > 1){ secs.forEach((x, n) => s[steps[n] === 'Left' ? 'l' : 'r'] = String(x)); sideMin(s); } else s.reps = String(secs[0]);
    s.done = true; setDone(day, +a, +b);
  } else {
    const list = kind === 'reset' ? RESET : COOL;
    d.holds = { ...(d.holds || {}), [`${kind}.${a}`]:secs };
    d[kind] = list.map((_, n) => !!(d[kind] || [])[n]); d[kind][+a] = true;
  }
  save(); tickHold(); render();
}
// what a timed desk-reset / cool-down move held, e.g. "Held: L 45 · R 44 s"
function heldTxt(d, kind, k, r){
  const secs = (d.holds || {})[`${kind}.${k}`];
  if(!secs || !secs.length) return '';
  const lab = n => r.sides ? (n % 2 ? 'R ' : 'L ') : '';
  return `<span class="small got">Held: ${secs.map((x, n) => lab(n) + x).join(' · ')} s</span>`;
}
function signal(n){ beep(n); try{ navigator.vibrate && navigator.vibrate(n > 1 ? [300, 150, 300] : 200); }catch(e){} }
function tickHold(){
  $hold.hidden = !hold;
  if(!hold) return;
  const now = Date.now(), $ = id => document.getElementById(id);
  if(hold.phase !== 'run' && now >= hold.at){ hold.phase = 'run'; hold.at = now; hold.sig = 0; signal(1); }
  const step = hold.steps[hold.step], done = hold.secs.map((x, n) => `${hold.steps[n] || 'Held'} ${x} s`).join(' · ');
  $('holdL').textContent = hold.title;
  $('holdP').textContent = step;
  $('holdD').textContent = done;
  if(hold.phase !== 'run'){
    const left = Math.ceil((hold.at - now) / 1000);
    if(left !== hold.left && hold.left !== null) beep(1, 660);   // a short tick each second of the countdown
    hold.left = left;
    $('holdT').textContent = left;
    $('holdS').textContent = hold.phase === 'ready' ? 'Get into position' : /Left|Right/.test(step) ? `Change side: ${step.toLowerCase()} next` : `Next: ${step.toLowerCase()}`;
    $('holdGo').hidden = true;
    $hold.className = 'wait';
    return;
  }
  const el = Math.floor((now - hold.at) / 1000);
  if(el >= hold.min && hold.sig < 1){ hold.sig = 1; signal(2); }
  if(hold.max > hold.min && el >= hold.max && hold.sig < 2){ hold.sig = 2; signal(3); }
  $('holdT').textContent = el >= 60 ? mmss(el) : el;
  $('holdS').textContent = el >= hold.max ? '✓ Top of the range — stop when you like'
    : el >= hold.min ? `✓ Target reached — keep going to ${hold.max} s or stop` : `Target ${hold.min === hold.max ? hold.min : range(hold)} s`;
  // the button says what comes next: another side, another round, or the end
  const after = hold.steps[hold.step + 1];
  $('holdGo').hidden = false;
  $('holdGo').textContent = !after ? 'Done' : /Left|Right/.test(after) ? 'Change side' : 'Next round';
  $hold.className = el >= hold.min ? 'reached' : '';
}

// The Settings editor's boxes → the plan (new items get an id from their name; ids never change after)
function readSuppEdit(){
  const v = sel => { const el = document.querySelector(sel); return el ? el.value.trim() : null; };
  const ids = new Set(supp.slots.flatMap(sl => sl.items.map(x => x.id)).filter(Boolean));
  supp = { ...supp, slots:supp.slots.map((sl, k) => ({ ...sl,
    ...(sl.time ? { time:v(`[data-slottime="${k}"]`) || sl.time } : {}),
    items:sl.items.map((x, n) => {
      const name = v(`[data-sname="${k}.${n}"]`) ?? x.name, dose = v(`[data-sdose="${k}.${n}"]`) ?? x.dose;
      let id = x.id;
      if(!id && name){ id = slug(name); while(ids.has(id)) id += '-2'; ids.add(id); }
      return { ...x, id, name, dose };
    }) })) };
}

// ---------- Export ----------
async function download(name, text, type){
  // Inside claude.ai the viewer hands out files; opened as a plain file, a normal link works.
  const dl = window.claude && claude.use ? await claude.use('downloads').catch(() => null) : null;
  if(dl){
    try{ await dl.save({ filename:name, data:text }); toast('Saved ✓'); }
    catch(e){ if(e && e.code !== 'declined') toast('Couldn’t save the file here'); }
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

// ---------- Rest timer ----------
let restEnd = 0, overTimer = null, audio = null;
const $bar = document.getElementById('bar');
function startRest(sec, label){
  primeAudio(); clearTimeout(overTimer);
  restEnd = Date.now() + sec * 1000;
  document.getElementById('barL').textContent = label;
  $bar.classList.remove('over'); $bar.classList.add('show'); tickRest();
}
function adjustRest(v){
  if(v === 'skip'){ stopRest(); return; }
  if(restEnd) restEnd += (+v) * 1000;
  tickRest();
}
function stopRest(){ restEnd = 0; $bar.classList.remove('show', 'over'); }
function tickRest(){
  if(!restEnd) return;
  const left = Math.ceil((restEnd - Date.now()) / 1000);
  if(left <= 0){
    restEnd = 0; $bar.classList.add('over');
    document.getElementById('barT').textContent = 'Go';
    beep(); try{ navigator.vibrate && navigator.vibrate([300, 150, 300]); }catch(e){}
    overTimer = setTimeout(() => $bar.classList.remove('show', 'over'), 5000);
  } else document.getElementById('barT').textContent = mmss(left);
}
function primeAudio(){
  try{ audio = audio || new (window.AudioContext || window.webkitAudioContext)(); if(audio.state === 'suspended') audio.resume(); }catch(e){}
}
function beep(n = 3, freq = 880){
  if(!audio) return;
  try{
    [0, .25, .5].slice(0, n).forEach(t => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = freq; o.connect(g); g.connect(audio.destination);
      g.gain.setValueAtTime(.25, audio.currentTime + t); g.gain.exponentialRampToValueAtTime(.001, audio.currentTime + t + .18);
      o.start(audio.currentTime + t); o.stop(audio.currentTime + t + .2);
    });
  }catch(e){}
}

// ---------- Session clock + keep screen on ----------
function tickClock(){
  const d = drafts[view], el = document.getElementById('clock'), prog = document.getElementById('prog');
  // sync dot: green = everything is in GitHub, orange = waiting (no signal, or a GitHub problem)
  const dot = document.getElementById('sdot'), waiting = !!syncError || history.some(s => !s.synced) || suppDirty.plan || suppDirty.days.length > 0;
  dot.hidden = !ghReady(); dot.classList.toggle('wait', waiting); dot.title = syncText();
  const all = d && d.startedAt && !PAGES[view] ? d.slots.flatMap(x => x.sets) : [];
  prog.textContent = all.length ? `${all.filter(s => s.done).length}/${all.length} sets` : '';
  keepAwake();
  const pill = document.getElementById('wake');
  pill.classList.toggle('on', !!wakeLock);
  pill.title = wakeLock ? 'The screen stays on during the workout'
    : !touchedRecently() ? 'No touch for 3 min — the phone may lock. Touch the screen to keep it on.'
    : 'This browser can’t keep the screen on';
  pill.hidden = !d || !d.startedAt || !!PAGES[view];
  if(pill.hidden){ el.textContent = ''; return; }
  const s = Math.floor((Date.now() - d.startedAt) / 1000);
  el.textContent = s >= 3600 ? `${Math.floor(s/3600)}:${mmss(s % 3600).padStart(5, '0')}` : mmss(s);
}
setInterval(() => { tickRest(); tickHold(); tickClock(); }, 250);

// No button (user, 2026-10-18): the screen stays on while any workout is running and is let go
// when none is. The phone's own lock still works; coming back to the app turns it on again.
// For safety it is also let go after 3 min without a touch, counted from the last touch or the
// end of the rest timer, whichever is later — so the phone locks itself if left on a bench.
let wakeLock = null, wakeAsking = false, wakeRefused = false;
const IDLE_MS = 3 * 60000;
let lastTouch = Date.now(), restUntil = 0;
['pointerdown', 'click', 'keydown', 'input'].forEach(e => document.addEventListener(e, () => { lastTouch = Date.now(); }, true));
const touchedRecently = () => Date.now() - Math.max(lastTouch, restUntil) < IDLE_MS;
async function keepAwake(){
  if(restEnd) restUntil = restEnd;
  if(hold) restUntil = Date.now();   // holding a plank is not "left on a bench"

  const want = ALL.some(d => drafts[d]?.startedAt) && document.visibilityState === 'visible' && touchedRecently();
  if(want && !wakeLock && !wakeAsking && !wakeRefused){
    wakeAsking = true;
    try{
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });   // phone locked, app hidden
    }catch(e){ wakeLock = null; wakeRefused = true; }
    wakeAsking = false;
  } else if(!want && wakeLock){ const l = wakeLock; wakeLock = null; try{ await l.release(); }catch(e){} }
}
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible'){ wakeRefused = false; keepAwake(); tickRest(); }
});

// ---------- GitHub sync (finished workouts → data/workouts/ in your private repo) ----------
// The phone copy is always written first; GitHub follows when there is signal.
// The token is typed in once on the phone and kept only in this browser.
let gh = store.get('fb3.gh', { repo:'sayedrian/fitness', branch:'main', token:'' });
let syncing = false, syncError = '', deleted = store.get('fb3.deleted', []);
const ghReady = () => !!(gh.token && gh.repo);
const b64enc = s => btoa(unescape(encodeURIComponent(s)));
const b64dec = s => decodeURIComponent(escape(atob(s.replace(/\n/g, ''))));
const pathFor = s => `data/workouts/${new Date(s.startedAt).toISOString().slice(0,10)}-${s.day}-${s.id}.json`;
async function api(path, opts = {}){
  const r = await fetch(`https://api.github.com/repos/${gh.repo}/contents/${path}`, { ...opts, headers:{
    Authorization:`Bearer ${gh.token}`, Accept:'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28' } });
  if(r.status === 401 || r.status === 403) throw new Error('GitHub refused the token — check it and its access to the repo.');
  if(r.status === 404 && opts.method !== 'PUT') return null;
  if(!r.ok) throw new Error(`GitHub error ${r.status}`);
  return r.status === 204 ? {} : r.json();
}
function syncText(){
  if(!ghReady()) return 'Saved in this browser on this phone only — add GitHub below to keep a copy in your repo.';
  const waiting = history.filter(s => !s.synced).length;
  if(syncError) return `Saved on this phone. GitHub: ${syncError}`;
  return waiting ? `Saved on this phone; ${waiting} waiting to upload to GitHub.` : 'Saved on this phone and in GitHub ✓';
}
async function sync(){
  if(!ghReady() || syncing || !navigator.onLine) return;
  syncing = true; syncError = '';
  try{
    for(const d of [...deleted]){
      const f = await api(d.path + `?ref=${gh.branch}`);
      if(f) await api(d.path, { method:'DELETE', body:JSON.stringify({ message:`Delete workout ${d.path}`, sha:f.sha, branch:gh.branch }) });
      deleted = deleted.filter(x => x.path !== d.path); store.set('fb3.deleted', deleted);
    }
    for(const s of history.filter(s => !s.synced)){
      const { synced, ...body } = s, path = pathFor(s);
      const existing = await api(path + `?ref=${gh.branch}`);   // already there from an earlier, half-finished upload
      if(!existing) await api(path, { method:'PUT', body:JSON.stringify({
        message:`Log ${PLAN[s.day]?.title || s.day} workout ${path.slice(14, 24)}`, content:b64enc(JSON.stringify(body, null, 2)), branch:gh.branch }) });
      s.synced = true; save();
    }
    // and the other way: workouts saved from another phone (or a new phone) come in by themselves
    const added = await pullNew();
    if(added){ toast(`Loaded ${added} workout${added === 1 ? '' : 's'} from GitHub`); render(); }
    if(await syncSupp()) render();
  }catch(e){ syncError = e.message.startsWith('GitHub') ? e.message : 'no connection — will retry.'; }
  syncing = false;
  if(view === 'history' || view === 'settings' || view === 'supp') render(); else tickClock();
  // ticked while this sync was running: go again
  if(!syncError && (suppDirty.plan || suppDirty.days.length)) setTimeout(sync, 1500);
}
// Supplements: the list (this phone's edit goes up, otherwise GitHub's comes down) and the ticks
// of today and of any day changed here, merged both ways. Returns true if anything on screen changed.
async function syncSupp(){
  let changed = false;
  const planPath = `${SUPP_DIR}/plan.json`, pf = await api(planPath + `?ref=${gh.branch}`);
  if(suppDirty.plan && supp){
    await api(planPath, { method:'PUT', body:JSON.stringify({ message:'Supplements: update the list',
      content:b64enc(JSON.stringify(supp, null, 2) + '\n'), branch:gh.branch, ...(pf ? { sha:pf.sha } : {}) }) });
    suppDirty.plan = false; saveSupp();
  } else if(pf){
    const p = JSON.parse(b64dec(pf.content));
    if(JSON.stringify(p) !== JSON.stringify(supp)){ supp = p; saveSupp(); changed = true; }
  }
  for(const day of [...new Set([dayKey(), ...suppDirty.days])]){
    const path = `${SUPP_DIR}/days/${day}.json`, f = await api(path + `?ref=${gh.branch}`);
    const remote = f ? JSON.parse(b64dec(f.content)).taken || {} : {};
    const merged = mergeDay(remote, suppLog[day]);
    if(JSON.stringify(merged) !== JSON.stringify(suppLog[day] || {})){ suppLog[day] = merged; changed = true; }
    if(suppDirty.days.includes(day) && JSON.stringify(merged) !== JSON.stringify(remote))
      await api(path, { method:'PUT', body:JSON.stringify({ message:`Supplements ${day}`,
        content:b64enc(JSON.stringify({ date:day, taken:merged }, null, 2) + '\n'), branch:gh.branch, ...(f ? { sha:f.sha } : {}) }) });
    suppDirty.days = suppDirty.days.filter(d => d !== day); saveSupp();
  }
  return changed;
}
// Fetches workouts that are in GitHub but not on this phone. Returns how many were added.
async function pullNew(){
  const list = await api(`data/workouts?ref=${gh.branch}`) || [];
  const have = new Set(history.map(s => s.id)), gone = new Set(deleted.map(d => d.path));
  let added = 0;
  for(const f of list.filter(f => f.name.endsWith('.json') && !gone.has(f.path))){
    const id = f.name.replace(/\.json$/, '').split('-').pop();
    if(have.has(id)) continue;
    const file = await api(f.path + `?ref=${gh.branch}`);
    history.push({ ...JSON.parse(b64dec(file.content)), synced:true }); added++;
  }
  if(added){ history.sort((a, b) => a.startedAt - b.startedAt); save(); }
  return added;
}
async function pullFromGitHub(){
  if(!ghReady()){ toast('Add the GitHub token first'); return; }
  try{
    const added = await pullNew(); render();
    toast(`Loaded ${added} workout${added === 1 ? '' : 's'} from GitHub`);
  }catch(e){ toast(e.message.startsWith('GitHub') ? e.message : 'No connection'); }
}
window.addEventListener('online', sync);
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') sync(); });
sync();

let toastT;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2000); }

render();

// Offline helper: lets the installed app open with no signal (see sw.js).
if('serviceWorker' in navigator && location.protocol !== 'file:'){
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>

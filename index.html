<!doctype html>
<!-- Published from sayedrian/fitness site/index.html by .github/workflows/publish-site.yml. Edit it there, not in sayworkout. -->
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Security: the page may only talk to api.github.com, loads nothing from other sites (only its own
     icon, manifest and offline helper), and sends no referrer. Even injected code could not send the
     token to another site. Checked by tests/check-site.sh. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://api.github.com; img-src 'self' data:; manifest-src 'self'; worker-src 'self'; media-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workout</title>
<!-- Installs as an app: home-screen icon, full screen, opens offline (sw.js) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0E1116" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1116" media="(prefers-color-scheme: dark)">
<style>
:root{
  --bg:#f5f4f0; --card:#ffffff; --ink:#1b1d21; --muted:#686c73; --line:#e2e0da;
  --input:#f0efea; --accent:#2a64d6; --accent-ink:#ffffff; --done:#1d8048;
  --done-bg:#e3f2e9; --hint:#9a5a12; --hint-bg:#fbf0e1; --bar:#1b1d21; --bar-ink:#ffffff; --bad:#b3261e;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101317; --card:#191d23; --ink:#e7e8eb; --muted:#9a9fa7; --line:#2a3038;
    --input:#222830; --accent:#5d8ff0; --accent-ink:#0b0d10; --done:#4cc27e;
    --done-bg:#15301f; --hint:#e3a65e; --hint-bg:#33260f; --bar:#e7e8eb; --bar-ink:#101317; --bad:#f2867d;
  }
}
:root[data-theme="dark"]{
  --bg:#101317; --card:#191d23; --ink:#e7e8eb; --muted:#9a9fa7; --line:#2a3038;
  --input:#222830; --accent:#5d8ff0; --accent-ink:#0b0d10; --done:#4cc27e;
  --done-bg:#15301f; --hint:#e3a65e; --hint-bg:#33260f; --bar:#e7e8eb; --bar-ink:#101317; --bad:#f2867d;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}

header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top)}
.top{display:flex;align-items:center;gap:8px;padding:10px 0 6px}
.top h1{font-size:17px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock,.prog{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.icon{border:0;background:none;font-size:22px;line-height:1;padding:2px 6px;color:var(--ink)}
.sdot{width:9px;height:9px;border-radius:50%;background:var(--done)}
.sdot.wait{background:var(--hint)}
header .wrap{position:relative}
.menu{position:absolute;right:16px;top:46px;z-index:6;background:var(--card);
  border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.18);overflow:hidden;min-width:170px}
.menu[hidden],#tabs[hidden]{display:none}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:13px 16px;font-size:16px}
.menu button+button{border-top:1px solid var(--line)}
.menu button[aria-current="true"]{font-weight:700}
button.fold{display:flex;width:100%;align-items:center;gap:10px;text-align:left;background:var(--card);
  border:1px solid var(--done);border-radius:14px;padding:10px 14px;margin:10px 0}
button.fold .num{background:var(--done);color:var(--card)}
button.fold .what{flex:1;min-width:0}
button.fold .small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* every block of a workout starts folded (user, 2026-10-28): you open the one you're on; done ones are green */
button.fold{background:var(--done-bg)}
button.fold.todo{border-color:var(--line);background:var(--card)}
button.fold.todo .num{background:var(--input);color:var(--ink)}
button.fold .more{color:var(--muted);font-size:14px}
.foldup{flex:none;border:0;background:none;color:var(--muted);font-size:15px;padding:4px 2px 4px 8px;margin-left:auto}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:13px}
.pill.on{background:var(--done);color:#fff;border-color:var(--done)}
#wake[hidden]{display:none}
#wake .clock{color:inherit;font-size:13px}
nav{display:flex;gap:6px;padding:4px 0 10px}
nav button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:10px;
  padding:9px 0;font-weight:600;position:relative}
nav button[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
nav button .dot{position:absolute;top:6px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--done)}

.focus{color:var(--muted);margin:14px 0 4px;font-size:14px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.box h3{margin:0 0 4px;font-size:15px}
.small{font-size:13px;color:var(--muted)}

.ex{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:10px 0;overflow:hidden}
.ex.complete{border-color:var(--done)}
.ex-head{display:flex;gap:10px;padding:12px 14px 6px;align-items:flex-start}
.num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--input);display:grid;place-items:center;
  font-size:13px;font-weight:700}
.ex.complete .num{background:var(--done);color:var(--card)}
.ex-title{flex:1;min-width:0}
.ex-title select{width:100%;border:0;background:transparent;font-weight:650;font-size:16px;padding:0;
  appearance:none;-webkit-appearance:none;text-overflow:ellipsis}
.ex-title .swap{font-size:12px;color:var(--accent);font-weight:500}
.rx{font-size:14px;color:var(--muted);margin-top:2px}
.cue{font-size:13px;color:var(--muted);padding:0 14px 8px;margin:0}
.hint{margin:0 14px 8px;font-size:13px;background:var(--hint-bg);color:var(--hint);border-radius:8px;padding:6px 9px}
.last{font-size:12px;color:var(--muted);padding:0 14px 6px}

.sets{padding:2px 10px 10px}
.row{display:grid;grid-template-columns:28px 1fr 1fr 56px;gap:8px;align-items:center;padding:4px}
.row.head{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding-bottom:0}
.row .i{text-align:center;color:var(--muted);font-size:14px}
.row .rm{width:28px;height:28px;border:1px solid var(--line);border-radius:50%;background:var(--card);padding:0;font-size:18px;line-height:1;color:var(--muted)}
.setbtns{align-items:center}
.row input{width:100%;min-width:0;border:1px solid transparent;background:var(--input);border-radius:9px;
  padding:9px 8px;text-align:center;font-size:17px;font-variant-numeric:tabular-nums}
.rrow{display:grid;grid-template-columns:1fr 56px;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.demowrap{grid-column:1 / -1}
.mv{border:0;background:none;padding:0;text-align:left;font-size:14px;color:var(--ink)}
.mv .small{display:block}
.mv .play{color:var(--accent);font-size:13px}
.howlist{list-style:none;margin:6px 2px 4px;padding:0;font-size:13px;line-height:1.35}
.howlist li{padding:2px 0}
.howlist .ok{color:var(--done)}
.howlist .no{color:var(--bad)}
.vid{flex:none;width:40px;height:34px;border:1px solid var(--line);border-radius:10px;background:var(--input);color:var(--accent);display:grid;place-items:center;padding:0}
.vid svg{width:24px;height:24px}
.vid svg rect{fill:none;stroke:currentColor;stroke-width:1.8}
.vid svg path{fill:currentColor}
.vid[aria-expanded="true"]{background:var(--accent);color:var(--input);border-color:var(--accent)}
.ex .demowrap{padding:0 10px 10px}
.demo{display:block;width:100%;max-width:340px;margin:2px auto;background:var(--input);border-radius:12px}
.demo .floor{stroke:var(--line);stroke-width:2}
.demo .prop{fill:var(--muted);opacity:.45}
.demo .bar{stroke:var(--muted);stroke-width:4;stroke-linecap:round}
.demo .near polyline,.demo .far polyline,.demo .torso{fill:none;stroke:var(--ink);stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
.demo .far{opacity:.3}
.demo .head{fill:var(--input);stroke:var(--ink);stroke-width:4}
.demo .roller{fill:var(--line);stroke:var(--muted);stroke-width:2}
.demo .gaze{stroke:var(--ink);stroke-width:2.5;stroke-linecap:round}
.demo .hot{fill:var(--hint);opacity:.6}
.demo .say{font-size:9px;fill:var(--muted);text-anchor:middle}
.demo .say.left{text-anchor:start}
.demo .bad{fill:none;stroke:var(--bad);stroke-width:2.2}
.demo .badx{fill:var(--bad);font-size:10px;font-weight:700;text-anchor:middle}
.demo .gear{fill:var(--muted);stroke:var(--muted)}
.demo .band{fill:none;stroke-width:2;stroke-linecap:round}
.demowrap .cap{font-size:14px;font-weight:600;text-align:center;padding:4px 8px 2px;min-height:1.4em}
.demowrap .cap.good{color:var(--done)}
.demowrap .cap.bad{color:var(--bad)}
.rrow.done .tick{opacity:1;background:var(--done);border-color:var(--done);color:var(--card)}
.reset h3 .small{font-weight:400}
.row .bwcell{text-align:center;color:var(--muted);font-size:14px;padding:9px 0}
.row input:focus{outline:none;border-color:var(--accent)}
.row input::placeholder{color:var(--muted);opacity:.75}
.tick{height:42px;border-radius:10px;border:2px solid var(--accent);background:var(--card);color:var(--accent);font-size:20px;line-height:1;opacity:.55}
.row.done .tick{opacity:1}
.row.done input{background:var(--done-bg)}
.row.done .tick{background:var(--done);border-color:var(--done);color:var(--card)}
.setbtns{display:flex;gap:8px;padding:2px 14px 12px}
.link{border:0;background:none;color:var(--accent);font-size:13px;padding:4px 0}

.actions{display:flex;gap:8px;margin:16px 0}
.btn{flex:1;border:0;border-radius:12px;padding:13px;font-weight:650;background:var(--accent);color:var(--accent-ink)}
.btn.start{display:block;width:100%;margin:10px 0;padding:15px;font-size:17px;background:var(--done);color:#fff}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
textarea{width:100%;min-height:70px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px}

details.sess{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:10px 0;padding:0 14px}
details.sess summary{padding:12px 0;cursor:pointer;font-weight:600}
details.sess summary span{font-weight:400;color:var(--muted);font-size:13px}
.lacts{display:flex;gap:18px}
.ledit .lex{border-top:1px solid var(--line);padding:8px 0}
.lset{display:flex;align-items:flex-end;gap:8px;margin-top:6px}
.lset label{flex:1;font-size:11px;color:var(--muted)}
.lset input{display:block;width:100%;border:1px solid var(--line);background:var(--input);border-radius:9px;padding:7px;font-size:15px;color:var(--ink)}
.lset>.small{width:14px;padding-bottom:9px}
.sess ul{margin:0 0 10px;padding-left:18px;font-size:14px}
.sess li{margin:3px 0}
.empty{color:var(--muted);text-align:center;padding:30px 0}
.gh label{display:block;font-size:13px;color:var(--muted);margin:8px 0}
.gh input{display:block;width:100%;margin-top:4px;border:1px solid var(--line);background:var(--input);border-radius:9px;padding:9px;font-size:16px;color:var(--ink)}

#bar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--bar);color:var(--bar-ink);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .2s}
#bar.show{transform:none}
#bar .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px}
#bar .t{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;min-width:84px}
#bar .l{flex:1;font-size:13px;opacity:.8;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#bar button{border:1px solid currentColor;background:transparent;color:inherit;border-radius:9px;padding:7px 10px;font-size:14px}
#bar.over{background:var(--done);color:#fff}
/* hold timer: full screen, big numbers readable from a plank on the floor */
#hold{position:fixed;inset:0;z-index:15;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;padding:24px 16px calc(24px + env(safe-area-inset-bottom));text-align:center}
#hold[hidden]{display:none}
#hold .hl{font-size:18px;font-weight:650}
#hold .hp{font-size:26px;font-weight:700;color:var(--accent)}
#hold .ht{font-size:110px;line-height:1;font-weight:750;font-variant-numeric:tabular-nums}
#hold .hs{font-size:16px;color:var(--muted);min-height:1.4em}
#hold .hd{font-size:15px;color:var(--muted);min-height:1.4em}
#hold .hb{display:flex;gap:10px;width:100%;max-width:420px;margin-top:14px}
#hold .hb button{flex:1;border-radius:14px;padding:18px;font-size:19px;font-weight:700;border:1px solid var(--line);background:var(--card)}
#hold .hb .go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);flex:2}
#hold.wait .ht{color:var(--hint)}
#hold.reached .ht,#hold.reached .hs{color:var(--done)}
/* timed sets: the whole seconds box is the play button (▶ + suggested seconds); press and hold to type */
.secbtn{flex:1;width:100%;min-width:0;border:1px solid transparent;background:var(--input);border-radius:9px;padding:9px 2px;
  font-size:17px;font-variant-numeric:tabular-nums;text-align:center;white-space:nowrap;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.secbtn .pl{color:var(--accent);font-size:14px}
.secbtn .sg{color:var(--muted)}
.row.done .secbtn{background:var(--done-bg)}
.lr .secbtn{font-size:16px}
.rrow.timed{grid-template-columns:1fr 46px 56px}
.tmrs{height:42px;border-radius:10px;border:1px solid var(--accent);background:var(--card);color:var(--accent);font-size:17px;padding:0}
.mv .got{color:var(--done)}
.lr{display:flex;gap:4px;min-width:0}
.lr > *{flex:1 1 0;min-width:0}
.lr input{padding:9px 2px;font-size:16px}
/* supplements tab: one timeline for today */
.sline{display:grid;grid-template-columns:1fr 86px 52px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.sline:first-child{border-top:0}
.sline .small{display:block}
.sline .due{color:var(--hint);font-weight:600}
.sline.done .tick{opacity:1;background:var(--done);border-color:var(--done);color:var(--card)}
.sline .tick{height:40px}
.sline input[type=time]{width:100%;min-width:0;border:1px solid var(--line);background:var(--input);border-radius:9px;padding:8px 4px;font-size:15px;color:var(--ink)}
.sline.done input[type=time]{background:var(--done-bg)}
.dnav{display:flex;align-items:center;gap:6px;margin:12px 0 4px}
.dnav input{flex:1;min-width:0;border:1px solid var(--line);background:var(--input);border-radius:9px;padding:8px;font-size:15px;color:var(--ink)}
.dnav button{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:7px 12px;font-size:16px}
.dnav button:disabled{opacity:.35}
.dnav .link{border:0;background:none;padding:4px}
.shead{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:10px 0 2px}
.supped{display:grid;grid-template-columns:1fr 90px 36px;gap:6px;align-items:center;margin:4px 0}
.supped input,.slotTime{width:100%;min-width:0;border:1px solid var(--line);background:var(--input);border-radius:9px;padding:8px;font-size:15px;color:var(--ink)}
.sdays{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin:2px 0 4px}
.sdays .chip{padding:5px 8px;min-width:30px;justify-content:center}
.supped .x{border:0;background:none;color:var(--bad);font-size:18px}
/* protein tab */
.ptot{font-size:34px;font-weight:750;font-variant-numeric:tabular-nums}
.ptot .of{font-size:18px;color:var(--muted);font-weight:600}
.pbar{height:12px;border-radius:6px;background:var(--input);overflow:hidden;margin:8px 0 4px}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.pbar.full i{background:var(--done)}
.padd{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.pnums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pnums label{font-size:12px;color:var(--muted)}.pnums input{margin-top:3px}
.ftot{margin-top:2px}.ftot b{color:var(--ink)}.ftot b.ok{color:var(--done)}.ftot b.over{color:var(--bad)}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tgrid .full{grid-column:1 / -1}
.tgrid label{font-size:13px}
.padd select,.padd input{width:100%;min-width:0;border:1px solid var(--line);background:var(--input);border-radius:9px;padding:9px;font-size:16px;color:var(--ink)}
.padd .full{grid-column:1 / -1}
.pline{display:grid;grid-template-columns:52px 1fr auto 30px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.pline:first-child{border-top:0}
.pline span .small{display:block}
.pline .g{font-weight:700;font-variant-numeric:tabular-nums}
button.pline{width:100%;border:0;border-top:1px solid var(--line);background:none;text-align:left;color:var(--ink);font-size:15px}
button.pline:first-child{border-top:0}
.pline.on{background:var(--input);border-radius:9px}
.pkeep{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}.pkeep input{width:auto;margin:0}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:8px 14px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
#toast.show{opacity:1}
#toast.undo{pointer-events:auto;display:flex;align-items:center;gap:12px}
#toast button{border:0;background:none;color:var(--accent);font-weight:700;font-size:14px;padding:2px 4px}
#toast button[data-again]{padding:8px 10px;font-size:15px}
#toast button[data-again="no"]{color:var(--bg);font-weight:500;opacity:.8}
/* tabs are icons (user, 2026-10-25): gym = dumbbell over its faded letter, home = house, daily = capsule */
nav button{display:grid;place-items:center;min-height:48px;padding:5px 0;overflow:hidden}
/* tabs (user, 2026-10-25, set 2): the letter says which workout, a small symbol under it the
   equipment — dumbbell = gym, band = home; the daily tab is a green broccoli with today's protein */
nav button{gap:1px}
nav button .big{font-size:21px;font-weight:800;line-height:1;letter-spacing:-.01em}
nav button svg{position:relative;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
nav button svg.mini{width:17px;height:17px;stroke-width:2.2;opacity:.75}
nav button svg.ic{width:26px;height:26px;stroke-width:1.9}
nav button svg .fl{fill:#3a9d4f;stroke:none}
nav button svg .st{stroke:#3a9d4f;stroke-width:2.6}
nav button[aria-current="true"] svg .fl{fill:#5cc275}
nav button[aria-current="true"] svg .st{stroke:#5cc275}
nav button .lb{font-size:11px;font-weight:650;line-height:1;font-variant-numeric:tabular-nums}
.card h3{display:flex;align-items:baseline;gap:8px;margin:0 0 6px}
.card h3 .st{margin-left:auto;font-size:14px;font-weight:650;color:var(--muted);font-variant-numeric:tabular-nums}
.card h3 .st.ok{color:var(--done)}
/* Daily cards fold to their heading; a tap on it opens the card (user, 2026-10-28) */
.card h3:has(.chead){margin:0}
.card .chead{display:flex;align-items:baseline;gap:8px;width:calc(100% + 28px);margin:-12px -14px 0;padding:12px 14px 8px;
  border:0;background:none;font:inherit;color:inherit;text-align:left}
.card.folded{padding-bottom:0}
.card.folded .chead{padding-bottom:12px}
.chead .more{color:var(--muted);font-size:14px;font-weight:400}
.chead .due{font-size:13px;color:var(--hint);font-weight:600;white-space:nowrap}
.chead .st{white-space:nowrap}
/* Food & supplements: what is due now in a tinted box on top; sub headings for the blocks */
.nowbox{background:var(--hint-bg);border-radius:12px;padding:2px 10px 6px;margin:4px 0 10px}
.nowbox .shead:first-child{color:var(--hint);font-weight:700}
.shead.sub{margin-top:10px;border-top:1px solid var(--line);padding-top:12px}
/* supplements by time slot: the time shows once ticked */
.sline.todo{grid-template-columns:1fr 52px}
.shead.slot{display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:13px;padding:10px 0 0}
.shead.slot b{color:var(--ink);font-variant-numeric:tabular-nums}
.shead .due{color:var(--hint);font-weight:600}
.shead .all{margin-left:auto;border:1px solid var(--accent);background:var(--card);color:var(--accent);border-radius:9px;padding:7px 12px;font-size:14px;font-weight:650}
.shead.slot + .sline{border-top:0}
.foldline{display:flex;width:100%;align-items:center;gap:8px;border:0;border-top:1px solid var(--line);background:none;padding:10px 0 4px;
  text-align:left;color:var(--done);font-size:14px;font-weight:600}
.foldline.plain{color:var(--accent)}
.foldline .more{margin-left:auto;color:var(--muted);font-weight:400}
.allok{color:var(--done);font-weight:650;padding:4px 0}
.sline .miss{color:var(--bad);font-weight:600}
.pquick .other{border-color:var(--line);color:var(--ink)}
.pquick{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 2px}
.pquick button{flex:1;min-width:120px;border:1px solid var(--accent);background:var(--card);color:var(--accent);border-radius:10px;padding:10px;font-weight:650;font-size:15px}
/* gut card: big icons, few words */
.gnow{display:flex;gap:8px;margin:8px 0}
.gnow button{display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px;font-size:15px;font-weight:650}
.gnow .poo{flex:1;font-size:17px;border-color:var(--accent);color:var(--accent)}
.gnow .poo span{font-size:26px;line-height:1}
.gnow .sym{flex-direction:column;gap:0;min-width:62px;padding:8px 4px;font-size:12px;font-weight:500;color:var(--muted)}
.gnow .sym span{font-size:22px;line-height:1.1}
.glvl{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:4px}
.glvl button{display:flex;flex-direction:column;align-items:center;border:2px solid transparent;background:var(--card);border-radius:10px;padding:8px 2px;font-size:13px;color:var(--ink)}
.glvl span{font-size:18px;line-height:1.3;letter-spacing:-2px}
.glvl button[aria-pressed="true"]{border-color:var(--accent);font-weight:700}
.lrow{display:flex;align-items:stretch;border-top:1px solid var(--line)}
.lrow>.gline,.lrow>.pline{flex:1;min-width:0;border-top:0}
.link.x{flex:0 0 auto;align-self:center;width:40px;height:40px;margin:2px 0 2px 8px;padding:0;border:1px solid var(--line);border-radius:50%;
  color:var(--bad);font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center}
.gline .si{font-size:18px}
.gedit{background:var(--input);border-radius:12px;padding:10px;margin:6px 0}
.gedit .top{display:flex;align-items:center;gap:8px;font-size:15px}
.gedit .top input{width:auto;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:6px;font-size:15px;color:var(--ink)}
.gedit .top .btn{flex:0 0 auto;width:auto;margin-left:auto;padding:7px 18px}
.bris{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0 2px}
.bris button{display:flex;flex-direction:column;align-items:center;border:2px solid transparent;background:var(--card);border-radius:10px;padding:5px 0 3px;font-size:12px;color:var(--muted)}
.bris svg{width:100%;max-width:40px;height:24px;fill:#8a5a32;stroke:#8a5a32}
.bris .w svg{fill:#b98c5f;stroke:#b98c5f}
.bris button[aria-pressed="true"]{border-color:var(--accent);color:var(--ink);font-weight:700}
.bscale{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);padding:0 4px}
.bscale b{color:var(--done);font-weight:600}
.gtags{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:8px}
.gtags button{display:flex;flex-direction:column;align-items:center;border:2px solid transparent;background:var(--card);border-radius:10px;padding:5px 2px;font-size:11px;color:var(--muted);line-height:1.2}
.gtags span{font-size:22px;line-height:1.2}
.gtags button[aria-pressed="true"]{border-color:var(--hint);background:var(--hint-bg);color:var(--hint);font-weight:650}
.gline{display:flex;align-items:center;gap:10px;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:8px 2px;font-size:15px;color:var(--ink);text-align:left}
.gline svg{width:34px;height:20px;fill:#8a5a32;stroke:#8a5a32}
.gline .tg{margin-left:auto;font-size:17px;letter-spacing:2px}
.gline.on{background:var(--input);border-radius:9px}
.nline{display:flex;align-items:baseline;gap:10px;border-top:1px solid var(--line);padding:8px 2px;font-size:15px}
.nline .nt{flex:1;white-space:pre-wrap;overflow-wrap:anywhere}
.nadd{display:flex;gap:8px;align-items:flex-end;margin-top:8px}.nadd .gnote{margin-top:0;flex:1}.nadd .btn{flex:0 0 auto;width:auto;padding-left:16px;padding-right:16px}
.gnote{display:block;width:100%;margin-top:8px;border:1px solid var(--line);background:var(--input);border-radius:9px;padding:8px;font:inherit;font-size:15px;color:var(--ink);resize:vertical}

.pick{display:flex;align-items:center;gap:6px}
.pick select{flex:1;min-width:0}
.pick::after{content:'▾';color:var(--accent);font-size:15px}
.unitnote{font-size:12px;color:var(--muted);padding:0 14px 4px}
.bands{display:flex;flex-wrap:wrap;gap:6px;padding:4px 14px 6px}
.addex{width:100%;margin:4px 0 10px}
.addform .chips3{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.addname{font-size:19px;font-weight:800;color:var(--ink)}
.addform .addn{display:flex;align-items:center;gap:10px;margin:6px 0 8px}.addform .addn .btn{flex:0 0 48px;min-height:44px;padding:0;font-size:20px}
.addform .addn b{font-size:20px;min-width:24px;text-align:center;font-variant-numeric:tabular-nums}
.chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 11px;font-size:13px}
.chip .sw{width:12px;height:12px;border-radius:50%;border:1px solid var(--muted)}
.chip .kg{opacity:.7;font-size:12px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.rep table{width:100%;border-collapse:collapse;font-size:14px}
.rep th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.rep th,.rep td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.rep td.n,.rep th.n{text-align:right;font-variant-numeric:tabular-nums}
.rep ul{margin:4px 0 0;padding-left:18px;font-size:14px}
.rep select{width:100%;border:1px solid var(--line);background:var(--input);border-radius:9px;padding:9px}
.up{color:var(--done);font-weight:700}
.down{color:var(--bad);font-weight:700}
.star{font-size:12px;color:var(--hint);white-space:nowrap}

/* ================= App skin (user, 2026-10-28: "this is an app" — redesign on the Claude canvas) =================
   One dark look, numbers big and words few, a bottom tab bar (Today · Train · Nutrition), one colour per area:
   blue = training, green = food / done, amber = due, light blue = water, violet = fat. Overrides the older rules above. */
:root,:root[data-theme="dark"],:root:not([data-theme="light"]){
  --bg:#0E1116; --card:#171B22; --ink:#F2F4F7; --muted:#959DAA; --line:#232934; --input:#222834;
  --accent:#3A7BFF; --accent-ink:#ffffff; --done:#3DD68C; --done-bg:#12241A; --done-ink:#0E1116;
  --hint:#F5A524; --hint-bg:#2A2112; --bar:#F2F4F7; --bar-ink:#0E1116; --bad:#FF8A7A;
  --water:#4FB3FF; --water-bg:#16263A; --coffee:#C08457; --coffee-bg:#2A1F17; --fat:#B18CFF; --soft:#A3AAB6; --chip:#222834;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0E1116; --card:#171B22 } }
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(100px + env(safe-area-inset-bottom))}
header{border-bottom:0}
.top{padding:16px 0 8px}
.top h1{font-size:28px;font-weight:800;letter-spacing:-.02em}
.icon{width:44px;height:44px;border-radius:22px;background:var(--card);display:grid;place-items:center;padding:0;font-size:20px}
.icon[hidden]{display:none}
.menu{top:60px;border-radius:16px;background:#1C2129;border-color:var(--line)}
/* workout tabs: a segmented control */
nav#tabs{gap:4px;padding:4px;margin:2px 0 10px;background:var(--card);border-radius:14px}
nav#tabs button{border:0;background:none;border-radius:10px;padding:0;min-height:40px;color:var(--muted);font-weight:700}
nav#tabs button[aria-current="true"]{background:var(--accent);color:#fff}
nav#tabs button .big{font-size:16px}
nav#tabs button svg.mini{display:none}
nav#tabs button .dot{top:6px;right:8px;background:var(--done)}
/* bottom tab bar */
#bnav{position:fixed;left:0;right:0;bottom:0;z-index:9;background:rgba(17,20,26,.97);border-top:1px solid var(--line);
  padding:0 0 env(safe-area-inset-bottom);backdrop-filter:blur(10px)}
#bnav .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;padding:0 10px}
#bnav button{position:relative;border:0;background:none;color:#7B8391;min-height:64px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;font-size:10.5px;font-weight:650;padding:0;min-width:0;overflow:hidden;white-space:nowrap;letter-spacing:.01em}
#bnav button[aria-current="true"]{color:var(--ink)}
#bnav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#bnav .dot{position:absolute;top:10px;left:calc(50% + 10px);width:8px;height:8px;border-radius:4px;background:var(--hint)}
#bnav .dot.run{background:var(--done)}
/* the rest timer floats above the tab bar */
#bar{left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));border-radius:20px;padding:10px 10px 10px 18px;
  transform:translateY(calc(100% + 140px));box-shadow:0 10px 30px rgba(0,0,0,.45)}
#bar .t{font-size:26px;font-weight:800}
#bar .l{font-size:12px;font-weight:650;letter-spacing:.03em;opacity:.7}
#bar button{border:0;background:#E1E4EA;color:#0E1116;border-radius:12px;min-height:44px;padding:0 14px;font-size:15px;font-weight:700}
#bar button[data-rest="skip"]{background:#0E1116;color:#fff}
#bar.over{background:var(--done);color:var(--done-ink)}
/* cards and buttons */
.box{background:var(--card);border:0;border-radius:20px;padding:14px 16px}
.box h3{font-size:17px;font-weight:750}
.btn{border-radius:16px;min-height:52px;font-weight:800;font-size:16px}
.btn.ghost{background:var(--card);border:0;color:var(--ink)}
.btn.start{background:var(--accent);color:#fff;border-radius:18px;min-height:56px}
.small{color:var(--muted)}
.focus{font-size:13px;font-weight:650;letter-spacing:.04em;text-transform:uppercase}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:24px 4px 10px}
.sec b{font-size:20px;font-weight:750}.sec span{font-size:14px;color:var(--muted)}
.sec .link{font-size:14px;font-weight:650}
input,select,textarea{color-scheme:dark}

/* Today: hero card, due bar, rings, KPI tiles, strength lines */
.hero{margin:6px 0 0;border-radius:24px;padding:20px;background:linear-gradient(135deg,#2457D6,#3A7BFF);color:#fff;display:flex;flex-direction:column;gap:14px}
.hero.ok{background:linear-gradient(135deg,#1C7A4C,#2FB673)}
.hero .ht{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hero .ht>div{display:flex;flex-direction:column;gap:3px;min-width:0}
.hero .eb,.duebar .eb{font-size:12px;font-weight:750;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.hero b{font-size:26px;font-weight:800;letter-spacing:-.01em}
.hero .sub{font-size:14px;opacity:.88}
.hero .hi{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none}
.hero .hi svg{width:28px;height:28px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips span{font-size:13px;font-weight:650;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.16)}
.hero .hb{min-height:52px;border:0;border-radius:16px;background:#fff;color:#1D4ED8;font-size:17px;font-weight:800}
.hero.ok .hb{color:#156B41}
.duebar{margin:12px 0 0;border-radius:20px;padding:12px 12px 12px 14px;background:var(--hint-bg);border:1px solid #5A4316;display:flex;align-items:center;gap:12px}
.duebar .di{width:40px;height:40px;border-radius:12px;background:var(--hint);color:#2A2112;display:grid;place-items:center;flex:none}
.duebar .di svg{width:22px;height:22px}
.duebar .dt{flex:1;display:flex;flex-direction:column;min-width:0}
.duebar .eb{color:var(--hint);opacity:1}
.duebar b{font-size:16px;font-weight:700}
.take{min-height:44px;padding:0 18px;border:0;border-radius:14px;background:var(--hint);color:#1B1408;font-size:15px;font-weight:800}
.rts,.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rt{background:var(--card);border-radius:20px;padding:14px;display:flex;align-items:center;gap:12px;min-width:0;color:var(--ink)}
.rt>span{display:flex;flex-direction:column;min-width:0}
.rt b{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.rt b small,.kv small{font-size:14px;color:var(--muted);font-weight:650}
.rg{flex:none}
.kc{font-size:12.5px;color:var(--soft);line-height:1.3}
.kpi{background:var(--card);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-height:136px;min-width:0}
.kpi .kl{font-size:13px;color:var(--soft);font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .kv{font-size:28px;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .kv small{font-size:15px}
.kpi .kv.good,.good{color:var(--done)}
.kpi .kc{margin-top:auto}
.wait{color:var(--hint)}
.sp{width:100%;height:34px;display:block}
.kbars{display:flex;align-items:flex-end;gap:6px;height:34px}
.kbars i{flex:1;background:#2B3A59;border-radius:4px}.kbars i.on{background:var(--accent)}
.kdays{display:flex;gap:4px}
.kdays i{font-style:normal;font-size:11px;font-weight:750;padding:4px 0;width:34px;text-align:center;border-radius:8px;background:#2B3A59;color:var(--soft)}
.kdays i.on{background:var(--accent);color:#fff}
.kslots{display:flex;flex-direction:column;gap:4px}
.kslots>span{display:flex;align-items:center;gap:6px}
.kslots em{font-style:normal;font-size:11px;color:var(--muted);width:34px;font-variant-numeric:tabular-nums}
.kslots .bad em{color:var(--bad);font-weight:750}
.kslots i{flex:1;height:6px;border-radius:3px;background:#3A2E18;overflow:hidden}
.kslots i b{display:block;height:6px;border-radius:3px;background:var(--hint)}
.ksq{display:flex;gap:5px}
.ksq i{width:24px;height:24px;border-radius:8px;background:#243A2F;display:grid;place-items:center;color:var(--done-ink)}
.ksq i.on{background:var(--done)}.ksq svg{width:14px;height:14px}
.kbristol{display:flex;gap:3px}
.kbristol i{flex:1;height:8px;border-radius:2px;background:#3A2E25}.kbristol i.on{background:#C08457}
.kwater{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--water-bg)}
.kwater i{display:block}.kwater .morning{background:#9AD4FF}.kwater .afternoon{background:#4FB3FF}.kwater .evening{background:#2B7BD6}
.lifts{padding:4px 16px}
.lft{display:grid;grid-template-columns:minmax(0,1fr) 92px 56px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.lft:first-child{border-top:0}
.lft .ln{display:flex;flex-direction:column;min-width:0}
.lft .ln b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lft .lc{text-align:right;font-weight:800;font-variant-numeric:tabular-nums;color:var(--soft)}.lft .lc.up{color:var(--done)}
.sec .link{border:0;background:none;color:#7FB0FF;padding:0}

/* tap to go to the source: tiles, rings and rows are buttons that keep their card look */
button.kpi,button.rt,button.win,button.nx,button.lft,button.dt,button.rl{border:0;font:inherit;color:inherit;text-align:left;width:100%;cursor:pointer}
button.kpi{background:var(--card)}button.rt{background:var(--card)}button.win{background:var(--card)}button.win.pr{background:linear-gradient(135deg,#1C3A2A,#17261F)}
button.nx,button.lft,button.dt,button.rl{background:none;padding-left:0;padding-right:0}
button.nx{padding-top:10px;padding-bottom:10px}button.lft{padding-top:10px;padding-bottom:10px}
button.rl{padding:0}
.duebar button.dt{padding:0}
.flash{animation:flash .9s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}

/* History: a month calendar, workouts as cards that open */
.cal{padding:16px}
.calh{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.calh b{font-size:17px;font-weight:750}
.chips2{display:flex;gap:6px;margin-left:auto}.chips2 span{font-size:12px;font-weight:700;padding:5px 9px;border-radius:999px;background:#1E2A45;color:#B7CCFF}
.calnav{width:36px;height:36px;border:0;border-radius:10px;background:var(--chip);color:var(--soft);font-size:18px}.calnav:disabled{opacity:.3}
.calg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cw{font-size:11px;font-weight:750;color:#6E7684}
.cd{height:34px;display:grid;place-items:center;font-size:13px;color:#7B8391;border-radius:10px}
.cd.on{background:var(--accent);color:#fff;font-weight:800}
.cd.today{box-shadow:inset 0 0 0 2px var(--ink);color:var(--ink);font-weight:800}
.cd.later{color:#3A414D}
.hcard{background:var(--card);border-radius:20px;margin:8px 0;overflow:hidden}
.hcard[open],.hcard.on{box-shadow:inset 0 0 0 1.5px var(--accent)}
.hsum{display:flex;align-items:center;gap:12px;padding:12px 14px;list-style:none;cursor:pointer}
.hsum::-webkit-details-marker{display:none}
.db{width:48px;height:48px;border-radius:14px;background:var(--chip);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.db span{font-size:10px;font-weight:800;color:var(--muted)}.db b{font-size:18px;line-height:1}
.hcard[open] .db{background:#1E2A45}.hcard[open] .db span{color:#7FB0FF}
.hti{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}.hti b{font-size:16px}
.chev{width:18px;height:18px;color:#6E7684;flex:none;transition:transform .15s}
details[open]>summary .chev{transform:rotate(90deg)}
.hbody{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.hx{display:flex;flex-direction:column;gap:5px}.hx b{font-size:14px}
.hsets{display:flex;gap:5px;flex-wrap:wrap}
.hsets span{font-size:12px;font-weight:700;padding:5px 8px;border-radius:8px;background:var(--chip)}
.hsets .top{background:var(--done-bg);color:var(--done)}
.hacts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.hacts .btn{min-height:44px;font-size:14px;border-radius:12px}
.btn.bad{background:#2A1C1C;color:var(--bad)}
.hcard .ledit{padding:0 14px 14px}
/* Settings: grouped lists */
.sgt{display:flex;justify-content:space-between;align-items:baseline;margin:22px 4px 8px;font-size:12px;font-weight:750;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.sgt .link{font-size:13px;letter-spacing:0;text-transform:none;font-weight:700;color:#7FB0FF}
.sgroup{padding:0 16px}
.srow{display:block;border-top:1px solid var(--line)}.srow:first-child{border-top:0}
.srow>summary,.srow.flat{display:flex;align-items:center;gap:12px;min-height:60px;list-style:none;cursor:pointer}
.srow>summary::-webkit-details-marker{display:none}
.srow .sl{flex:1;display:flex;flex-direction:column;font-size:16px;font-weight:650;min-width:0}
.srow .sv{font-size:15px;color:#C9CED6;font-weight:650;text-align:right;min-width:0;max-width:52%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.ar{display:flex;align-items:center;gap:12px;border-radius:18px;padding:8px 8px 8px 12px;min-height:64px;background:var(--card)}
.ar .ai{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.ar .ai svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ar .at{flex:1;min-width:0;display:flex;flex-direction:column;border:0;background:none;color:var(--ink);text-align:left;padding:0}
.ar .at b{font-size:16px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ar .at span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ar .go{min-height:48px;min-width:84px;padding:0 16px;border:0;border-radius:14px;font-size:15px;font-weight:800}
.ar.due{background:var(--hint-bg);box-shadow:inset 0 0 0 1px #5A4316}
.ar.due .ai{background:var(--hint);color:#2A2112}.ar.due .at span{color:var(--hint);font-weight:700}
.ar.due .go{background:var(--hint);color:#1B1408}
.ar.nx .ai{background:#1E2A45;color:#7FB0FF}.ar.nx .go{background:var(--accent);color:#fff}
.ar.nx.ok .ai{background:var(--done-bg);color:var(--done)}.ar.nx.ok .go{background:var(--chip);color:var(--ink)}
/* coffee: water's card in coffee colours */
.coffee .glass.mug{border-color:var(--coffee);border-radius:8px 8px 16px 16px}.coffee .glass.mug i{background:#8A5A36}
.coffee.over .glass.mug{border-color:var(--hint)}.coffee.over .glass.mug i{background:#B77A16}
.coffee .cups button{background:var(--coffee-bg);color:#E7B98F}.coffee .cups .other{background:var(--chip);color:var(--soft)}
.sec .st.over{color:var(--hint);font-weight:700}
.limline{display:flex;align-items:center;gap:8px;margin:12px 0 0;font-size:13px;color:var(--hint);font-weight:700;background:var(--hint-bg);border-radius:12px;padding:8px 10px}
/* gut: last time and a day */
.gstats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.gs{background:#1F1813;border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.gs .gl{font-size:12px;font-weight:700;color:#C9A78A}
.gs .gv{font-size:28px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.gs .gv small{font-size:14px;color:var(--muted);font-weight:650}
.gs .gc{font-size:12px;color:var(--muted)}
.g14{display:flex;align-items:flex-end;gap:3px;height:22px;margin-top:6px}
.g14 i{flex:1;border-radius:2px;background:var(--coffee);min-height:3px}.g14 i.z{background:#3A2E25;height:3px!important}
.wnotes .nadd .btn[disabled]{background:var(--chip);color:#5C6472}
.gut{padding:14px}
.gnow{display:grid;grid-template-columns:1.4fr repeat(3,minmax(0,1fr));gap:8px;margin:0 0 8px}
.gnow button{min-height:72px;border:0;border-radius:16px;background:var(--chip);color:#C9CED6;flex-direction:column;gap:4px;font-size:13px;font-weight:700;padding:6px 2px}
.gnow .poo{background:#3A2A1E;color:#F0C9A6;font-size:15px;font-weight:800}
.gnow .poo svg{width:24px;height:24px}
.gnow .sym span{font-size:22px}
.gline,.nline{border-top:1px solid var(--line)}
.gedit{background:#1A1F27;border-radius:16px}
.gnow svg{width:22px;height:22px}
.gnow .pe{font-size:28px;line-height:1}
.kt{width:100%;height:auto;display:block;color:var(--ink)}
.lg{white-space:nowrap}.lg i{display:inline-block;width:14px;margin-right:4px;vertical-align:middle;border-top:2px dashed}
.lg .avg{border-color:#F2F4F7}.lg .pln{border-color:var(--done)}
.addnote{width:100%;min-height:44px;margin-top:6px;border:1px dashed #3A414D;border-radius:12px;background:none;color:var(--soft);font-weight:650;font-size:14px}
.addnote span{color:var(--muted);font-weight:400;margin-left:6px}
.sline .tick.take{border:0;background:var(--hint);color:#1B1408;font-size:15px;opacity:1}
@media print{
  header,#bar,#toast,.noprint{display:none!important}
  body{padding:0;background:#fff;color:#000}
  .box{break-inside:avoid;border-color:#ccc}
}
</style>

<body>
<header>
  <div class="wrap">
    <div class="top">
      <h1 id="title">Full Body 3</h1>
      <span class="prog" id="prog"></span>
      <span class="sdot" id="sdot" hidden></span>
      <!-- training clock while a workout runs; green = the screen is kept on -->
      <span class="pill" id="wake" hidden>☀ <span class="clock" id="clock"></span></span>
    </div>
    <nav id="tabs"></nav>
  </div>
</header>
<main class="wrap" id="main"></main>
<nav id="bnav" aria-label="Sections"><div class="in" id="bnavIn"></div></nav>
<div id="bar"><div class="in">

</div></div>
<div id="hold" hidden role="dialog" aria-label="Hold timer">

  <div class="hb"><button data-hold-act="cancel">Cancel</button><button class="go" data-hold-act="go" id="holdGo">Stop</button></div>
</div>
<div id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<input type="file" id="mealPhoto" accept="image/*" capture="environment" hidden>

function score(s, name, bw){

  if(bwOf(name)) return ((parseFloat(bw || bodyweight) || 80) + (parseFloat(s.kg) || 0)) * (1 + (+s.reps || 0) / 30);
  // loop bands have no kg: the heavy band ranks above the medium one at the same reps
  if(bandOf(name) === 'loop') return (+s.reps || 0) * (s.band === 'Heavy' ? 1.25 : s.band === 'Medium' ? 1.1 : 1);
  let kg = lifted(s, name, bw);
  if(kg == null) kg = 100 - (parseFloat(s.kg) || 0);   // no body weight yet: less assist still ranks higher
  const r = +s.reps || 0;
  return kg > 0 ? kg * (1 + r / 30) : r;
}
const best = (sets, name, bw) => sets.reduce((b, s) => !b || score(s, name, bw) > score(b, name, bw) ? s : b, null);
// Weight on hold for these (user, 2026-10-31; the reason is in the private repo, fitness.md §11). Reps still go up.
const KG_HOLD = Object.fromEntries(['Barbell back squat','Hack squat','Goblet squat','Leg press','Bulgarian split squat','Walking lunge','Step-up',
  'Lying leg curl','Seated leg curl','Nordic curl','Romanian deadlift','Dumbbell RDL','Barbell hip thrust','Hip thrust machine','Single-leg hip thrust']
  .map(n => [n, 'same weight for now (on hold)']));
// what to change once every set hit the top of the range
function nextStep(ex, name, sets){
  if(KG_HOLD[name]) return KG_HOLD[name];
  const bwk = bwOf(name);
  if(bandOf(name) === 'loop') return 'use the heavy band, then go single-leg';
  if(bandOf(name)) return 'add a band or a stronger one (or step further back)';
  if(bwk === 'only') return 'make it harder (further range, slower, or a harder variant)';
  if(bwk === 'plus' && !sets.some(s => parseFloat(s.kg) > 0)) return loadOf(name) === 'hand' ? 'hold light dumbbells' : 'hold a light weight';
  if(ex.time) return 'add a little weight';
  return loadOf(name) === 'assist' ? 'lower the assist one step' : 'add the smallest weight step';
}
// n calendar days later (not n × 24 h: a week with a clock change is 1 h longer or shorter)
// workouts in the last 7 days, today included (user, 2026-10-28: the goal of 3 counts a rolling week,
// not Monday to Sunday — Sun 25 + Tue 27 are 2 of 3 on Wed 28)
const dayStart = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
const last7 = (t = Date.now()) => history.filter(s => s.startedAt >= dayStart(addDays(t, -6)) && s.startedAt < dayStart(addDays(t, 1))).length;
function addDays(t, n){ const d = new Date(t); d.setDate(d.getDate() + n); return d.getTime(); }
function weekStart(t){ const d = new Date(t); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return d.getTime(); }

// ---------- Exercise demos: short looping stick-figure animations, drawn here (no files) ----------
// Side views use angles (0 = right, 90 = down) so limbs keep their length while moving.
// Near limbs solid, far limbs faded. Each demo: keyframes {p: pose, hold, move, say, mark, cp}. How to write one: docs/demo-2d.md.
// `say` names a line of HOW (c1… cues, m1/m2 the ✗ part of a mistake, m1fix the ✓ part); it shows under the picture.
const vec = (a, l) => [l * Math.cos(a * Math.PI / 180), l * Math.sin(a * Math.PI / 180)];
const add = (p, a, l) => { const v = vec(a, l); return [p[0] + v[0], p[1] + v[1]]; };
function side(q, root){
  const k = q.k || 1, T = 40 * k, L = 30 * k, U = 22 * k, F = 20 * k;
  let hip, kn, fn, el, hn, neck;
  if(root === 'foot'){ fn = [q.x, q.y]; kn = add(fn, q.ns, -L); hip = add(kn, q.nt, -L); }
  else if(root === 'hand'){ hn = [q.x, q.y]; el = add(hn, q.nf, -F); neck = add(el, q.nu, -U); hip = add(neck, q.to, -T); }
  else hip = [q.x, q.y];
  neck = neck || add(hip, q.to, T);
  kn = kn || add(hip, q.nt, L); fn = fn || add(kn, q.ns, L);
  el = el || add(neck, q.nu, U); hn = hn || add(el, q.nf, F);
  const kf = add(hip, q.ft, L), ef = add(neck, q.fu, U);
  const ff = add(kf, q.fs, L), hf = add(ef, q.ff, F);
  return { near:[[hip, kn, fn], [hip, neck], [neck, el, hn]], far:[[hip, kf, ff], [neck, ef, hf]],
    head:add(neck, q.hd ?? q.to, 11 * k), hr:8 * k, hip, neck, kn, fn, el, hn, kf, ff, ef, hf, back:[(hip[0] + neck[0]) / 2, (hip[1] + neck[1]) / 2] };
}

// Band pull-apart: front view turned a little to the side (three-quarter) so the arms reaching forward stay readable.
// `a` = arm angle from straight forward (0) to out to the side (90); `sh` lifts the shoulders (shrug). The far side is faded.
DEMO['Band pull-apart'] = {
  build:q => {
    const c = Math.cos(.75), s = Math.sin(.75), P = (x, y, z) => [100 + x * c + z * s, y + z * .12];
    const sy = 31 + q.sh, r = q.a * Math.PI / 180, arm = d => {
      const o = Math.sin(r), w = Math.cos(r);
      return [P(d * 12, sy, 0), P(d * (12 + 21 * o), sy + 1, 21 * w), P(d * (12 + 41 * o), sy, 41 * w)];
    }, L = arm(-1), R = arm(1);
    return { near:[[P(-9, 124, 0), P(-6, 95, 0), P(0, 66, 0)], [P(0, 66, 0), P(0, 25, 0)], [L[0], P(0, 25, 0), R[0]], L],
      far:[[P(0, 66, 0), P(6, 95, 0), P(9, 124, 0)], R], head:P(0, 13, 0), hr:8, sl:L[0], sr:R[0], hl:L[2], hf:R[2], chest:P(0, 34, 0) };
  },
  front:(f, q) => {   // the band runs hand to hand; as the arms open it comes back to the chest
    const u = Math.sin(q.a * Math.PI / 180) ** 2, m = [(f.hl[0] + f.hf[0]) / 2 * (1 - u) + f.chest[0] * u, (f.hl[1] + f.hf[1]) / 2 * (1 - u) + f.chest[1] * u];
    return `<polyline class="band" style="stroke:#2e8b57;stroke-width:2.5" points="${[f.hl, m, f.hf].map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ')}"/>`;

// (0 = front, 55 = from the figure's right side, to show the lean back of the mistake); a = arms out from the sides,

  build:q => {
    const r = Math.PI / 180, cy = Math.cos(q.yaw * r), sy = Math.sin(q.yaw * r), cE = Math.cos(10 * r), sE = Math.sin(10 * r);
    const P = ([x, y, z]) => { const X = x * cy + z * sy, Z = -x * sy + z * cy; return [100 + X, 124 - (y * cE - Z * sE)]; };

function demoAt(d, t){
  const total = d.keys.reduce((n, k) => n + k.hold + k.move, 0);

    t -= k.hold;

      return { q, k, nx, e };
    }

  }

function sayText(name, code){
  const h = HOW[name] || {}, m = /^(c|m|cap)(\d)(fix)?$/.exec(code || '');

  if(m[1] === 'cap') return '✓ ' + ((h.captions || [])[m[2] - 1] || '');

  const up = x => x ? x.replace(/^([✓✗] )(\p{Ll})/u, (_, a, b) => a + b.toUpperCase()) : '';
  return up(m[3] ? fix : bad);
}

const setTxt = (s, ex, name, bw) => {
  const tm = timedOf(ex, name || (ex && ex.name)), amt = tm ? secTxt(s) : s.reps;
  if(s.band) return `${s.band.split('+').join(' + ')}${s.kg ? ` (${s.kg} kg)` : ''} × ${amt}`;
  if(s.kg === '' || s.kg == null) return `${amt}${tm ? '' : ' reps'}`;

function suppCard(day, now, isToday, noon){
  if(!supp) return { st:'', ok:false, due:false, now:'', later:`<p class="small">No supplement list on this phone yet. It is kept in your private repo
    and ${ghReady() ? 'loads by itself when there is signal.' : 'loads once the GitHub token is in ⋯ → Settings.'}</p>` };
  const items = todayItems(noon), req = items.filter(x => !x.optional);
  const got = req.filter(x => taken(day, x.id)).length;
  const part = (now, later, due = false) => ({ st:`${got} of ${req.length}`, ok:got === req.length, due, now, later });
  // a line: name and dose; taken → when (a box to correct it), else just ✓ — the time shows only once ticked
  const line = x => { const on = taken(day, x.id); return `<div class="sline ${on ? 'done' : 'todo'}">
      <span><b>${esc(x.name)}</b> · ${esc(x.dose)}${x.optional ? ' <span class="small" style="display:inline">· optional</span>' : ''}
        <span class="small">${on ? `✓ taken ${hhmm(takenAt(day, x.id))}` : !isToday ? '<span class="miss">✗ not taken</span>' + (x.time ? ` · reminder ${x.time}` : '') : ''}${x.note ? (on || !isToday ? ' · ' : '') + esc(x.note) : ''}</span></span>
      ${on ? `<input type="time" data-suppat="${esc(x.id)}" value="${hhmm(takenAt(day, x.id))}" aria-label="${esc(x.name)}: time taken">` : ''}
      <button class="tick ${!on && isToday && itemDue(x, now) ? 'take' : ''}" data-supp="${esc(x.id)}" aria-label="${esc(x.name)} taken">${!on && isToday && itemDue(x, now) ? 'Take' : '✓'}</button></div>`; };
  // a past day is a record, not a to-do list (user, 2026-10-25): everything listed in the day's order,
  // taken ✓ with its time, not taken ✗ — nothing folded away
  if(!isToday){
    const key = x => taken(day, x.id) ? takenAt(day, x.id) : atDay(day, x.time || '23:59');
    if(!items.length) return part('', `<p class="small">Nothing scheduled that day.</p>`);
    return part('', [...items].sort((a, b) => key(a) - key(b)).map(line).join(''));
  }
  // to do, by time slot (user, 2026-10-28): "13:25 · due · ✓ both" — due first, then by time, then any time
  const todo = items.filter(x => !taken(day, x.id));
  const done = items.filter(x => taken(day, x.id)).sort((a, b) => takenAt(day, a.id) - takenAt(day, b.id));
  const rank = tm => !tm ? 2 : atToday(tm) <= now ? 0 : 1;
  const slots = [...new Set(todo.map(x => x.time || ''))].sort((a, b) => rank(a) - rank(b) || a.localeCompare(b));
  let h = '';
  if(!items.length) h += `<p class="small">Nothing scheduled today.</p>`;
  else if(!todo.length || todo.every(x => x.optional) && got === req.length) h += `<div class="allok">✓ All taken today</div>`;
  const slotHtml = tm => { const its = todo.filter(x => (x.time || '') === tm), due = tm && atToday(tm) <= now;
    return `<div class="shead slot"><b>${tm || 'Any time'}</b> ${due ? '<span class="due">due</span>' : tm ? '<span>reminder</span>' : ''}
      ${tm && its.length > 1 ? `<button class="all" data-suppslot="${tm}" aria-label="All at ${tm} taken">✓ ${its.length === 2 ? 'both' : `all ${its.length}`}</button>` : ''}</div>`
      + its.map(line).join(''); };
  const dueNow = slots.filter(tm => rank(tm) === 0);
  h += slots.filter(tm => rank(tm) > 0).map(slotHtml).join('');
  if(done.length) h += opened.has('stake')
    ? `<button class="foldline" data-fold="stake">✓ ${done.length} taken <span class="more">hide ▴</span></button>${done.map(line).join('')}`
    : `<button class="foldline" data-unfold="stake">✓ ${done.length} taken · ${[...new Set(done.map(x => hhmm(takenAt(day, x.id))))].join(', ')} <span class="more">show ▾</span></button>`;
  return part(dueNow.map(slotHtml).join(''), h, dueNow.length > 0);

// 💩 last time and a day on average (user, 2026-10-30): above the buttons, in Gut only
function gutStats(){
  const last = Object.keys(gutLog).sort().reverse().map(k => gutDay(k).sort((a, b) => b.at - a.at)[0]).find(Boolean);
  const pd = pastDays(gutLog), per = pd.map(k => gutDay(k).length);
  if(!last && !pd.length) return '';
  const ago = last ? Date.now() - last.at : 0, agoTxt = ago < 3600e3 ? `${Math.max(1, Math.round(ago / 60e3))} min ago` : ago < 48 * 3600e3 ? `${Math.round(ago / 3600e3)} h ago` : `${Math.round(ago / 864e5)} days ago`;
  const top = Math.max(1, ...per);
  return `<div class="gstats">
    <div class="gs"><span class="gl">💩 Last</span><span class="gv">${last ? hhmm(last.at) : '–'}</span>
      <span class="gc">${last ? `${dayKey(last.at) === dayKey() ? '' : dateTxt(last.at) + ' · '}${agoTxt}${last.type ? ` · type ${last.type}` : ''}` : 'none yet'}</span></div>
    <div class="gs"><span class="gl">A day</span><span class="gv">${pd.length ? f1(avg(per)) : '–'}<small> avg</small></span>
      <span class="gc">${pd.length ? `last ${pd.length} day${pd.length === 1 ? '' : 's'}` : 'from tomorrow'}</span>
      ${pd.length ? `<span class="g14" aria-hidden="true">${per.map(n => `<i class="${n ? '' : 'z'}" style="height:${Math.round(n / top * 100)}%"></i>`).join('')}</span>` : ''}</div></div>`;
}

  if(es){ const [, ic, lb] = GSYM.find(x => x[0] === es.k) || ['', '❔', es.k];
    h += `<div class="gedit">
      <div class="top">${ic} ${esc(lb)} <input type="time" data-symat="${esc(es.id)}" value="${hhmm(es.at)}" aria-label="Time">

  // the note box folds into a button (user, 2026-10-28); a note typed but not added keeps it open
  if(!noteOpen && !noteDraft[day]) return h + `<button class="addnote" data-act="nopen">Add a note <span>food, stress, travel…</span></button></div>`;
  return h + `<div class="nadd"><textarea class="gnote" data-gnote="1" rows="2" placeholder="📝 Note ${isToday ? '' : 'for that day '}— food, stress, travel… whenever it comes to mind" aria-label="New note">${esc(noteDraft[day] || '')}</textarea>

// The month as a calendar (workout days in blue), then every workout as a card: tap to see its sets as
// chips (the best one green), Edit sets and Delete.
let histMonth = 0;                                      // months back from this one
function renderHistory(){
  const now = new Date(), m = new Date(now.getFullYear(), now.getMonth() - histMonth, 1), y = m.getFullYear(), mo = m.getMonth();
  const inMonth = history.filter(s => { const d = new Date(s.startedAt); return d.getFullYear() === y && d.getMonth() === mo; });
  const hours = inMonth.reduce((n, s) => n + (s.finishedAt && s.startedAt ? (s.finishedAt - s.startedAt) / 36e5 : 0), 0);
  const on = new Set(inMonth.map(s => new Date(s.startedAt).getDate())), lead = (m.getDay() + 6) % 7, nDays = new Date(y, mo + 1, 0).getDate();
  const isNow = histMonth === 0, today = now.getDate();
  let h = `<div class="rtop">${progSeg()}</div><p class="small">${syncText()}</p>
    <div class="box cal" id="hist"><div class="calh"><button class="calnav" data-hmon="1" aria-label="Month before">‹</button>
      <b>${m.toLocaleDateString('en-GB', { month:'long', year:y === now.getFullYear() ? undefined : 'numeric' })}</b>
      <span class="chips2"><span>${inMonth.length} workout${inMonth.length === 1 ? '' : 's'}</span>${hours ? `<span>${hours < 10 ? f1(hours) : Math.round(hours)} h</span>` : ''}</span>
      <button class="calnav" data-hmon="-1" aria-label="Next month" ${isNow ? 'disabled' : ''}>›</button></div>
      <div class="calg">${WEEK.map(w => `<span class="cw">${w}</span>`).join('')}${'<span></span>'.repeat(lead)}${Array.from({ length:nDays }, (_, i) => i + 1).map(d =>
        `<span class="cd ${on.has(d) ? 'on' : ''} ${isNow && d === today ? 'today' : ''} ${isNow && d > today ? 'later' : ''}">${d}</span>`).join('')}</div></div>`;
  h += `<div class="sec"><b>Workouts</b><span>${history.length} in all</span></div>`;
  if(!history.length) h += `<p class="empty">No finished workouts yet.</p>`;
  [...history].reverse().forEach(s => {
    const p = PLAN[s.day], d = new Date(s.startedAt);
    const sets = s.slots.reduce((n, x) => n + x.sets.filter(t => t.done).length, 0);
    const mins = s.finishedAt && s.startedAt ? Math.round((s.finishedAt - s.startedAt) / 60000) : null;
    const dblock = `<span class="db"><span>${d.toLocaleDateString('en-GB', { weekday:'short' }).toUpperCase()}</span><b>${d.getDate()}</b></span>`;
    const title = `<span class="hti"><b>${p ? p.title : esc(s.day)}</b><span class="kc">${[mins ? `${mins} min` : '', `${sets} sets`, d.getMonth() !== mo || d.getFullYear() !== y ? dateTxt(s.startedAt) : ''].filter(Boolean).join(' · ')}</span></span>`;
    if(logEdit && logEdit.id === s.id){ h += `<div class="box hcard on"><div class="hsum">${dblock}${title}<span class="bdg">changing</span></div>${editBox(s)}</div>`; return; }
    // personal records: a best set above every earlier session of that exercise
    const prs = s.slots.filter(x => { const t = x.sets.filter(q => q.done); if(!t.length) return false;
      const before = history.filter(o => o.startedAt < s.startedAt).flatMap(o => o.slots.filter(z => z.name === x.name).flatMap(z => z.sets.filter(q => q.done).map(q => score(q, x.name, o.bw))));
      return before.length && score(best(t, x.name, s.bw), x.name, s.bw) > Math.max(...before) * 1.005; }).length;
    h += `<details class="hcard" ${detK('h:' + s.id)}><summary class="hsum">${dblock}${title}${prs ? `<span class="bdg best">${prs} PR</span>` : ''}${CHEV}</summary>
      <div class="hbody">${s.slots.filter(x => x.sets.some(t => t.done)).map(x => {
        const ex = p && p.ex.find(e => e.name === x.name || e.alts.includes(x.name)), done = x.sets.filter(t => t.done), b = best(done, x.name, s.bw);
        return `<div class="hx"><b>${esc(x.name)}</b><span class="hsets">${done.map(t => `<span class="${t === b ? 'top' : ''}">${esc(setTxt(t, ex, x.name, s.bw))}</span>`).join('')}</span></div>`;

  });

    ${pts.map(([x, y], i) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${i === pts.length - 1 ? 4 : 2.8}" fill="${col}"/>`).join('')}</svg>`;

// ---------- About you: KPIs (user, 2026-10-28: "KPIs that make me learn about myself") ----------
// Each tile says what the data shows, or what it still needs — never a number from too little data.
// Habits look at the last 14 days before today, from the first day each was tracked.
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
const WEEKDAY = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const hourPart = t => { const h = new Date(t).getHours(); return h < 12 ? 'morning' : h < 18 ? 'afternoon' : 'evening'; };
const f1 = n => n.toLocaleString('en', { maximumFractionDigits:1 });
// the tracked days of a log: from its first day, the last n days before today
function pastDays(log, n = 14){
  const from = firstDay(log), out = [];
  for(let i = n; i >= 1; i--){ const k = dayKey(addDays(Date.now(), -i)); if(k >= from && from < dayKey()) out.push(k); }
  return out;
}
function kpiTraining(){
  const done = history.filter(x => x.startedAt && x.finishedAt), h = [];
  // 1. workout time (user, 2026-10-28): the last 3 workouts as bars, a dashed line for the average of the
  // last 30 days, another for what the plan should take; real sessions only (15 min to 3 h)
  const real = done.map(x => ({ at:x.startedAt, d:x.day, m:(x.finishedAt - x.startedAt) / 60000 })).filter(x => x.m >= 15 && x.m <= 180);
  if(real.length >= 2){
    const l3 = real.slice(-3), month = real.filter(x => x.at >= addDays(Date.now(), -30)).map(x => x.m), am = avg(month.length ? month : real.map(x => x.m));
    const pm = Math.round(avg(DAYS.map(planMins))), top = Math.max(am, pm, ...l3.map(x => x.m)) * 1.12, W = 140, H = 56, y = m => H - m / top * H;
    const bw = 28, gap = (W - 3 * bw) / 4;
    const vis = `<svg class="kt" viewBox="0 0 ${W} ${H + 14}" aria-hidden="true">
      ${l3.map((x, i) => { const bx = gap + i * (bw + gap); return `<rect x="${bx}" y="${y(x.m).toFixed(1)}" width="${bw}" height="${(H - y(x.m)).toFixed(1)}" rx="5" fill="#3A7BFF" fill-opacity="${i === l3.length - 1 ? 1 : .55}"/>
        <text x="${bx + bw / 2}" y="${H + 12}" text-anchor="middle" font-size="10" font-weight="700" fill="currentColor">${Math.round(x.m)}</text>`; }).join('')}
      <line x1="0" x2="${W}" y1="${y(am).toFixed(1)}" y2="${y(am).toFixed(1)}" stroke="#F2F4F7" stroke-width="1.5" stroke-dasharray="4 3"/>
      <line x1="0" x2="${W}" y1="${y(pm).toFixed(1)}" y2="${y(pm).toFixed(1)}" stroke="#3DD68C" stroke-width="1.5" stroke-dasharray="4 3"/></svg>`;
    h.push(tile({ go:'history#hist', label:'Workout time', val:Math.round(l3[l3.length - 1].m), unit:' min', vis,
      cap:`<span class="lg"><i class="avg"></i>avg ${Math.round(am)}</span> <span class="lg"><i class="pln"></i>plan ${pm}</span>` }));
  } else h.push(waitTile('Workout time', 'after 2 workouts', 'history#hist'));
  // 2. workouts a week (user, 2026-10-28: "2/3, I don't understand"): the last 4 rolling weeks of 7 days as
  // bars with their count, oldest first, and a dashed line at the goal of 3
  if(done.length){
    const first = dayStart(done[0].startedAt), ends = [21, 14, 7, 0].map(n => addDays(Date.now(), -n)).filter(t => dayStart(addDays(t, 1)) > first);   // weeks since the first workout
    const per = ends.map(t => last7(t)), W = 140, H = 48, top = Math.max(4, ...per), bw = 26, gap = (W - per.length * bw) / (per.length + 1), y = n => H - n / top * H;
    const vis = `<svg class="kt" viewBox="0 0 ${W} ${H + 14}" aria-hidden="true">
      ${per.map((n, i) => { const bx = gap + i * (bw + gap); return `<rect x="${bx}" y="${y(Math.max(n, .12)).toFixed(1)}" width="${bw}" height="${(H - y(Math.max(n, .12))).toFixed(1)}" rx="4" fill="${n >= 3 ? '#3A7BFF' : '#2B3A59'}"/>
        <text x="${bx + bw / 2}" y="${(y(n) - 3).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="800" fill="currentColor">${n}</text>
        <text x="${bx + bw / 2}" y="${H + 12}" text-anchor="middle" font-size="8.5" fill="#959DAA">${new Date(addDays(ends[i], -6)).getDate()}–${new Date(ends[i]).getDate()}</text>`; }).join('')}
      <line x1="0" x2="${W}" y1="${y(3)}" y2="${y(3)}" stroke="#3DD68C" stroke-width="1.5" stroke-dasharray="4 3"/></svg>`;
    h.push(tile({ go:'history#hist', label:'Workouts a week', val:per[per.length - 1], unit:' of 3', vis, cap:'<span class="lg"><i class="pln"></i>goal 3 a week</span>' }));
  } else h.push(waitTile('Workouts a week', 'after your first workout', 'history#hist'));
  // 3. when you train: usual days and hour; strength by part of day against each lift's own average
  if(done.length >= 3){
    const cnt = {}; done.forEach(x => { const k = WEEKDAY[new Date(x.startedAt).getDay()]; cnt[k] = (cnt[k] || 0) + 1; });
    const days = Object.entries(cnt).sort((a, b) => b[1] - a[1]).slice(0, 3);
    const hr = Math.round(avg(done.map(x => new Date(x.startedAt).getHours() + new Date(x.startedAt).getMinutes() / 60)));
    const rel = {};
    strengthLines().forEach(([, v]) => { const m = avg(v.map(o => o.sc)); v.forEach(o => (rel[hourPart(o.at)] = rel[hourPart(o.at)] || []).push(o.sc / m)); });
    const parts = Object.entries(rel).filter(([, v]) => v.length >= 4).sort((a, b) => avg(b[1]) - avg(a[1]));
    const diff = parts.length >= 2 ? Math.round((avg(parts[0][1]) - avg(parts[parts.length - 1][1])) * 100) : 0;
    h.push(tile({ go:'history#hist', label:'You train at', val:`${pad2(hr)}:00`,
      vis:`<span class="kdays">${days.map(([d], i) => `<i class="${i < 2 ? 'on' : ''}">${d.toUpperCase()}</i>`).join('')}</span>`,
      cap:diff >= 2 ? `<span class="good">${diff}% stronger in the ${parts[0][0]}</span>` : 'your usual days' }));
  } else h.push(waitTile('You train at', 'after 3 workouts', 'history#hist'));

  } else h.push(waitTile('Progress', 'after 2 weeks of lifts', 'history#hist'));
  return h.join('');
}
function kpiHabits(){

    const rows = Object.entries(slot).sort((a, b) => a[0].localeCompare(b[0])), all = rows.reduce((n, [, v]) => [n[0] + v.got, n[1] + v.due], [0, 0]);
    const worst = rows.filter(([, v]) => v.got < v.due).sort((a, b) => a[1].got / a[1].due - b[1].got / b[1].due)[0];
    const nm = k => k === 'any' ? 'any' : k;
    h.push(tile({ go:'fuel#secS', label:'Supplements', val:Math.round(all[0] / all[1] * 100), unit:'%',
      vis:`<span class="kslots">${rows.slice(0, 4).map(([k, v]) => `<span class="${worst && worst[0] === k ? 'bad' : ''}"><em>${nm(k)}</em><i><b style="width:${Math.round(v.got / v.due * 100)}%"></b></i></span>`).join('')}</span>`,
      cap:worst ? `${nm(worst[0])} is your weak spot` : 'every slot taken' }));
  } else h.push(waitTile('Supplements', 'after 3 days of ticks', 'fuel#secS'));

  const target = prot && +prot.target, pd = pastDays(Object.fromEntries(Object.entries(protLog).map(([k, v]) => [k, (v || []).filter(e => !e.del)])));

// A set was just ticked (or timed): fill in what was left empty, then start the rest timer.
function setDone(day, i, j){
  const d = draft(day, true), slot = d.slots[i], s = slot.sets[j], list = exList(day, d), ex = list[i];
  s.at = d.lastAt = Date.now();                          // when it was ticked: Finish tapped late is corrected from it
  const box = f => day === view ? document.querySelector(`[data-i="${i}"][data-j="${j}"][data-f="${f}"]`) : null;
  const sugg = f => box(f) ? box(f).placeholder || box(f).dataset.sugg || '' : '';
  // one tap if the numbers match last time: take the greyed-in values (body-weight exercises have none)
  const kgIn = box('kg');
  if(s.kg === '' && kgIn && kgIn.dataset.last) s.kg = kgIn.dataset.last;
  const tm = timedOf(ex, slot.name);
  if(tm && tm.sides){
    ['l', 'r'].forEach(f => { if(!s[f]) s[f] = sugg(f); });
    sideMin(s);
  } else if(s.reps === '') s.reps = sugg('reps');
  // bands: the colours tapped for this exercise, and their kg
  if(bandOf(slot.name)){ const c = slot.band || []; s.band = c.join('+'); s.kg = bandKg(slot.name, c); }
  const lastSet = slot.sets.every(x => x.done);
  if(lastSet && day === view) opened.delete(i);
  startRest(ex.rest, lastSet ? `Next: ${list[i+1]?.name || 'finish'}` : `${slot.name} · set ${j+2}`);
}
// a per-side hold counts as its weaker side for the range and progress ("every set at the top")
function sideMin(s){
  const n = [s.l, s.r].map(parseFloat).filter(x => !isNaN(x));
  s.reps = n.length ? String(Math.min(...n)) : '';
}

// ---------- Hold timer (2026-10-25): time a hold without leaving the page ----------
// ▶ → 3 s to get into position (only Cancel) → counts up; beeps + vibrates at the bottom of the range and again at the top,
// keeps counting until the button: "Change side" (then 5 s to switch, right starts by itself) or "Done". The seconds go into the set
// (then the rest timer starts) or, for the desk reset and cool-down, into `holds` and the ✓.
const READY_S = 3, SWITCH_S = 5;
let hold = null;
const $hold = document.getElementById('hold');
// what ▶ times: 'set.i.j' (an exercise set), 'reset.k' or 'cool.k'
function holdPlan(day, key){
  const [kind, a, b, c] = key.split('.'), sides = ['Left', 'Right'];
  if(kind === 'set'){   // 'set.i.j.r' = right side first
    const d = draft(day, true), ex = exList(day, d)[+a], slot = d.slots[+a], tm = timedOf(ex, slot.name);
    return { title:`${slot.name} · set ${+b + 1}`, min:tm.min, max:tm.max, steps:!tm.sides ? [''] : c === 'r' ? ['Right', 'Left'] : sides };
  }
  const r = (kind === 'reset' ? resetFor(day) : COOL)[+a], rounds = r.rounds || 1;
  const steps = Array.from({ length:rounds }, (_, n) => (r.sides ? sides : ['']).map(x => [rounds > 1 ? `Round ${n + 1}` : '', x].filter(Boolean).join(' · '))).flat();
  return { title:r.name, min:r.secs, max:r.secs, steps };
}
function startHold(day, key){
  if(hold || !begin(day, true)) return;
  primeAudio(); stopRest();
  hold = { day, key, ...holdPlan(day, key), step:0, secs:[], phase:'ready', at:Date.now() + READY_S * 1000, sig:0, left:null };
  save(); render(); tickHold();
}
function holdAct(a){
  if(!hold) return;
  if(a === 'cancel'){ hold = null; tickHold(); return; }
  if(hold.phase !== 'run') return;   // countdowns run out by themselves
  hold.secs.push(Math.floor((Date.now() - hold.at) / 1000));
  if(++hold.step < hold.steps.length){ hold.phase = 'switch'; hold.at = Date.now() + SWITCH_S * 1000; hold.left = null; tickHold(); return; }
  finishHold();
}
function finishHold(){
  const { day, key, secs, steps } = hold, [kind, a, b] = key.split('.'), d = draft(day, true);
  hold = null;
  if(kind === 'set'){
    const s = d.slots[+a].sets[+b];
    if(secs.length > 1){ secs.forEach((x, n) => s[steps[n] === 'Left' ? 'l' : 'r'] = String(x)); sideMin(s); } else s.reps = String(secs[0]);
    s.done = true; setDone(day, +a, +b);
  } else {
    const list = kind === 'reset' ? RESET : COOL;
    d.holds = { ...(d.holds || {}), [`${kind}.${a}`]:secs };
    d[kind] = list.map((_, n) => !!(d[kind] || [])[n]); d[kind][+a] = true;
  }
  save(); tickHold(); render();
}
// what a timed desk-reset / cool-down move held, e.g. "Held: L 45 · R 44 s"
function heldTxt(d, kind, k, r){
  const secs = (d.holds || {})[`${kind}.${k}`];
  if(!secs || !secs.length) return '';
  const lab = n => r.sides ? (n % 2 ? 'R ' : 'L ') : '';
  return `<span class="small got">Held: ${secs.map((x, n) => lab(n) + x).join(' · ')} s</span>`;
}
// a short buzz confirms a tick or a removal without looking (user, 2026-10-28)
const BUZZ = '[data-tick],[data-supp],[data-suppslot],[data-reset],[data-cool],[data-rmset],.link.x,[data-undo],[data-qminus]';
function buzzFor(t){ if(t.matches(BUZZ)) try{ navigator.vibrate && navigator.vibrate(25); }catch(e){} }
function signal(n){ beep(n); try{ navigator.vibrate && navigator.vibrate(n > 1 ? [300, 150, 300] : 200); }catch(e){} }
function tickHold(){
  $hold.hidden = !hold;
  if(!hold) return;
  const now = Date.now(), $ = id => document.getElementById(id);
  if(hold.phase !== 'run' && now >= hold.at){ hold.phase = 'run'; hold.at = now; hold.sig = 0; signal(1); }
  const step = hold.steps[hold.step], done = hold.secs.map((x, n) => `${hold.steps[n] || 'Held'} ${x} s`).join(' · ');
  $('holdL').textContent = hold.title;
  $('holdP').textContent = step;
  $('holdD').textContent = done;
  if(hold.phase !== 'run'){
    const left = Math.ceil((hold.at - now) / 1000);
    if(left !== hold.left && hold.left !== null) beep(1, 660);   // a short tick each second of the countdown
    hold.left = left;
    $('holdT').textContent = left;
    $('holdS').textContent = hold.phase === 'ready' ? 'Get into position' : /Left|Right/.test(step) ? `Change side: ${step.toLowerCase()} next` : `Next: ${step.toLowerCase()}`;
    $('holdGo').hidden = true;
    $hold.className = 'wait';
    return;
  }
  const el = Math.floor((now - hold.at) / 1000);
  if(el >= hold.min && hold.sig < 1){ hold.sig = 1; signal(2); }
  if(hold.max > hold.min && el >= hold.max && hold.sig < 2){ hold.sig = 2; signal(3); }
  $('holdT').textContent = el >= 60 ? mmss(el) : el;
  $('holdS').textContent = el >= hold.max ? '✓ Top of the range — stop when you like'
    : el >= hold.min ? `✓ Target reached — keep going to ${hold.max} s or stop` : `Target ${hold.min === hold.max ? hold.min : range(hold)} s`;
  // the button says what comes next: another side, another round, or the end
  const after = hold.steps[hold.step + 1];
  $('holdGo').hidden = false;
  $('holdGo').textContent = !after ? 'Done' : /Left|Right/.test(after) ? 'Change side' : 'Next round';
  $hold.className = el >= hold.min ? 'reached' : '';
}

// The Settings editor's boxes → the plan (new items get an id from their name; ids never change after)
function readSuppEdit(){
  const v = sel => { const el = document.querySelector(sel); return el ? el.value.trim() : null; };
  const ids = new Set(supp.items.map(x => x.id).filter(Boolean));
  supp = { ...supp, version:2, items:supp.items.map((x, n) => {

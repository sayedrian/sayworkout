// ---------- Export ----------
async function download(name, text, type){
  // Inside claude.ai the viewer hands out files; opened as a plain file, a normal link works.
  const dl = window.claude && claude.use ? await claude.use('downloads').catch(() => null) : null;
  if(dl){
    try{ await dl.save({ filename:name, data:text }); toast('Saved ✓'); }
    catch(e){ if(e && e.code !== 'declined') toast('Couldn’t save the file here'); }
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

// ---------- Rest timer ----------
let restEnd = 0, overTimer = null, audio = null;
const $bar = document.getElementById('bar');
function startRest(sec, label){
  primeAudio(); clearTimeout(overTimer);
  restEnd = Date.now() + sec * 1000;
  document.getElementById('barL').textContent = label;
  $bar.classList.remove('over'); $bar.classList.add('show'); tickRest();
}
function adjustRest(v){
  if(v === 'skip'){ stopRest(); return; }
  if(restEnd) restEnd += (+v) * 1000;
  tickRest();
}
function stopRest(){ restEnd = 0; $bar.classList.remove('show', 'over'); }
function tickRest(){
  if(!restEnd) return;
  const left = Math.ceil((restEnd - Date.now()) / 1000);
  if(left <= 0){
    restEnd = 0; $bar.classList.add('over');
    document.getElementById('barT').textContent = 'Go';
    beep(); try{ navigator.vibrate && navigator.vibrate([300, 150, 300]); }catch(e){}
    overTimer = setTimeout(() => $bar.classList.remove('show', 'over'), 5000);
  } else document.getElementById('barT').textContent = mmss(left);
}
function primeAudio(){
  try{ audio = audio || new (window.AudioContext || window.webkitAudioContext)(); if(audio.state === 'suspended') audio.resume(); }catch(e){}
}
function beep(n = 3, freq = 880){
  if(!audio) return;
  try{
    [0, .25, .5].slice(0, n).forEach(t => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = freq; o.connect(g); g.connect(audio.destination);
      g.gain.setValueAtTime(.25, audio.currentTime + t); g.gain.exponentialRampToValueAtTime(.001, audio.currentTime + t + .18);
      o.start(audio.currentTime + t); o.stop(audio.currentTime + t + .2);
    });
  }catch(e){}
}

// ---------- Session clock + keep screen on ----------
function tickClock(){
  const d = drafts[view], el = document.getElementById('clock'), prog = document.getElementById('prog');
  // sync dot: green = everything is in GitHub, orange = waiting (no signal, or a GitHub problem)
  const dot = document.getElementById('sdot'), waiting = !!syncError || history.some(s => !s.synced) || suppDirty.plan || suppDirty.days.length > 0 || protDirty.plan || protDirty.days.length > 0 || gutDirty.days.length > 0 || waterDirty.days.length > 0 || coffeeDirty.days.length > 0 || photoWait.size > 0;
  dot.hidden = !ghReady(); dot.classList.toggle('wait', waiting); dot.title = syncText();
  const all = d && d.startedAt && !PAGES[view] ? d.slots.flatMap(x => x.sets) : [];
  prog.textContent = all.length ? `${all.filter(s => s.done).length}/${all.length} sets` : '';
  keepAwake();
  const pill = document.getElementById('wake');
  pill.classList.toggle('on', !!wakeLock);
  pill.title = wakeLock ? 'The screen stays on during the workout'
    : !touchedRecently() ? 'No touch for 3 min — the phone may lock. Touch the screen to keep it on.'
    : 'This browser can’t keep the screen on';
  pill.hidden = !d || !d.startedAt || !!PAGES[view];
  if(pill.hidden){ el.textContent = ''; return; }
  const s = Math.floor((Date.now() - d.startedAt) / 1000);
  el.textContent = s >= 3600 ? `${Math.floor(s/3600)}:${mmss(s % 3600).padStart(5, '0')}` : mmss(s);
}
setInterval(() => { tickRest(); tickHold(); tickClock(); }, 250);

// No button (user, 2026-10-18): the screen stays on while any workout is running and is let go
// when none is. The phone's own lock still works; coming back to the app turns it on again.
// For safety it is also let go after 3 min without a touch, counted from the last touch or the
// end of the rest timer, whichever is later — so the phone locks itself if left on a bench.
let wakeLock = null, wakeAsking = false, wakeRefused = false;
const IDLE_MS = 3 * 60000;
let lastTouch = Date.now(), restUntil = 0;
['pointerdown', 'click', 'keydown', 'input'].forEach(e => document.addEventListener(e, () => { lastTouch = Date.now(); }, true));
const touchedRecently = () => Date.now() - Math.max(lastTouch, restUntil) < IDLE_MS;
async function keepAwake(){
  if(restEnd) restUntil = restEnd;
  if(hold) restUntil = Date.now();   // holding a plank is not "left on a bench"

  const want = ALL.some(d => drafts[d]?.startedAt) && document.visibilityState === 'visible' && touchedRecently();
  if(want && !wakeLock && !wakeAsking && !wakeRefused){
    wakeAsking = true;
    try{
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });   // phone locked, app hidden
    }catch(e){ wakeLock = null; wakeRefused = true; }
    wakeAsking = false;
  } else if(!want && wakeLock){ const l = wakeLock; wakeLock = null; try{ await l.release(); }catch(e){} }
}
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible'){ wakeRefused = false; keepAwake(); tickRest(); }
});

// ---------- GitHub sync (finished workouts → data/workouts/ in your private repo) ----------
// The phone copy is always written first; GitHub follows when there is signal.
// The token is typed in once on the phone and kept only in this browser.
let gh = store.get('fb3.gh', { repo:'sayedrian/fitness', branch:'main', token:'' });
let syncing = false, syncError = '', deleted = store.get('fb3.deleted', []);
const ghReady = () => !!(gh.token && gh.repo);
const b64enc = s => btoa(unescape(encodeURIComponent(s)));
const b64dec = s => decodeURIComponent(escape(atob(s.replace(/\n/g, ''))));
const pathFor = s => `data/workouts/${new Date(s.startedAt).toISOString().slice(0,10)}-${s.day}-${s.id}.json`;
async function api(path, opts = {}){
  const r = await fetch(`https://api.github.com/repos/${gh.repo}/contents/${path}`, { ...opts, headers:{
    Authorization:`Bearer ${gh.token}`, Accept:'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28' } });
  if(r.status === 401 || r.status === 403) throw new Error('GitHub refused the token — check it and its access to the repo.');
  if(r.status === 404 && opts.method !== 'PUT') return null;
  if(!r.ok) throw new Error(`GitHub error ${r.status}`);
  return r.status === 204 ? {} : r.json();
}
function syncText(){
  if(!ghReady()) return 'Saved in this browser on this phone only — add GitHub below to keep a copy in your repo.';
  const waiting = history.filter(s => !s.synced).length;
  if(syncError) return `Saved on this phone. GitHub: ${syncError}`;
  return waiting ? `Saved on this phone; ${waiting} waiting to upload to GitHub.` : 'Saved on this phone and in GitHub ✓';
}
// A background sync never redraws the screen while the user is typing in it (a redraw would
// throw the box away mid-word); it waits until the typing is over and the screen untouched for 1 s.
let pendingRender = false;
const busyTyping = () => { const a = document.activeElement; return !!a && $main.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName); };
function renderSoon(){ if(busyTyping()){ pendingRender = true; return; } render(); }
setInterval(() => { if(pendingRender && !busyTyping() && Date.now() - lastTouch > 1000){ pendingRender = false; render(); } }, 250);
async function sync(){
  if(!ghReady() || syncing || !navigator.onLine) return;
  syncing = true; syncError = '';
  try{
    for(const d of [...deleted]){
      const f = await api(d.path + `?ref=${gh.branch}`);
      if(f) await api(d.path, { method:'DELETE', body:JSON.stringify({ message:`Delete workout ${d.path}`, sha:f.sha, branch:gh.branch }) });
      deleted = deleted.filter(x => x.path !== d.path); store.set('fb3.deleted', deleted);
    }
    for(const s of history.filter(s => !s.synced)){
      const { synced, edited, ...body } = s, path = pathFor(s);
      const existing = await api(path + `?ref=${gh.branch}`);   // already there from an earlier, half-finished upload
      if(!existing || edited) await api(path, { method:'PUT', body:JSON.stringify({
        message:`${existing ? 'Correct' : 'Log'} ${PLAN[s.day]?.title || s.day} workout ${path.slice(14, 24)}`, content:b64enc(JSON.stringify(body, null, 2)),
        branch:gh.branch, ...(existing ? { sha:existing.sha } : {}) }) });
      s.synced = true; delete s.edited; save();
    }
    // and the other way: workouts saved from another phone (or a new phone) come in by themselves
    const added = await pullNew();
    if(added){ toast(`Loaded ${added} workout${added === 1 ? '' : 's'} from GitHub`); renderSoon(); }
    if(await syncSupp()) renderSoon();
    await syncPhotos();
    if(await syncProt()) renderSoon();
    if(await syncGut()) renderSoon();
    if(await syncWater()) renderSoon();
    if(await syncCoffee()) renderSoon();
    if(await pullPastDays(`${SUPP_DIR}`, suppLog, (d, j) => { suppLog[d] = j.taken || {}; }) + await pullPastDays(`${PROT_DIR}`, protLog, (d, j) => { protLog[d] = j.entries || []; })
      + await pullPastDays(GUT_DIR, gutLog, (d, j) => { gutLog[d] = gutShape(j); })
      + await pullPastDays(WATER_DIR, waterLog, (d, j) => { waterLog[d] = j.entries || []; })
      + await pullPastDays(COFFEE_DIR, coffeeLog, (d, j) => { coffeeLog[d] = j.entries || []; })){
      saveSupp(); saveProt(); saveGut(); saveWater(); saveCoffee(); if(view === 'report') renderSoon();
    }
  }catch(e){ syncError = e.message.startsWith('GitHub') ? e.message : 'no connection — will retry.'; }
  syncing = false;
  if(view === 'history' || view === 'settings' || view === 'fuel' || view === 'report') renderSoon(); else tickClock();
  // ticked while this sync was running: go again
  if(!syncError && (suppDirty.plan || suppDirty.days.length || protDirty.plan || protDirty.days.length || gutDirty.days.length || waterDirty.days.length || coffeeDirty.days.length || photoWait.size)) setTimeout(sync, 1500);
}
// Supplements: the list (this phone's edit goes up, otherwise GitHub's comes down) and the ticks
// of today and of any day changed here, merged both ways. Returns true if anything on screen changed.
async function syncSupp(){
  let changed = false;
  const planPath = `${SUPP_DIR}/plan.json`, pf = await api(planPath + `?ref=${gh.branch}`);
  if(suppDirty.plan && supp){
    await api(planPath, { method:'PUT', body:JSON.stringify({ message:'Supplements: update the list',
      content:b64enc(JSON.stringify(supp, null, 2) + '\n'), branch:gh.branch, ...(pf ? { sha:pf.sha } : {}) }) });
    suppDirty.plan = false; saveSupp();
  } else if(pf){
    const p = JSON.parse(b64dec(pf.content));
    if(JSON.stringify(p) !== JSON.stringify(supp)){ supp = normPlan(p); saveSupp(); changed = true; }
  }
  for(const day of [...new Set([dayKey(), ...suppDirty.days, ...(suppView ? [suppView] : [])])]){
    const path = `${SUPP_DIR}/days/${day}.json`, f = await api(path + `?ref=${gh.branch}`);
    const remote = f ? JSON.parse(b64dec(f.content)).taken || {} : {};
    const merged = mergeDay(remote, suppLog[day]);
    if(JSON.stringify(merged) !== JSON.stringify(suppLog[day] || {})){ suppLog[day] = merged; changed = true; }
    if(suppDirty.days.includes(day) && JSON.stringify(merged) !== JSON.stringify(remote))
      await api(path, { method:'PUT', body:JSON.stringify({ message:`Supplements ${day}`,
        content:b64enc(JSON.stringify({ date:day, taken:merged }, null, 2) + '\n'), branch:gh.branch, ...(f ? { sha:f.sha } : {}) }) });
    suppDirty.days = suppDirty.days.filter(d => d !== day); saveSupp();
  }
  return changed;
}
// Days in GitHub that this phone has never seen (the last 60), for the report.
async function pullPastDays(dir, have, put){
  const list = await api(`${dir}/days?ref=${gh.branch}`) || [], from = dayKey(addDays(Date.now(), -60));
  let n = 0;
  for(const f of list.filter(f => /^\d{4}-\d\d-\d\d\.json$/.test(f.name))){
    const day = f.name.slice(0, 10);
    if(day < from || day in have) continue;
    const file = await api(f.path + `?ref=${gh.branch}`);
    if(file){ put(day, JSON.parse(b64dec(file.content))); n++; }
  }
  return n;
}
// Meal photos waiting on this phone: up first (already there from a half-finished upload = done), then forgotten here.
async function syncPhotos(){

// Protein: the target (as for the supplement list) and the entries of today and of any day changed here.
async function syncProt(){
  let changed = false;
  const planPath = `${PROT_DIR}/plan.json`, pf = await api(planPath + `?ref=${gh.branch}`);
  if(protDirty.plan && prot){
    await api(planPath, { method:'PUT', body:JSON.stringify({ message:'Protein: update the target',
      content:b64enc(JSON.stringify(prot, null, 2) + '\n'), branch:gh.branch, ...(pf ? { sha:pf.sha } : {}) }) });
    protDirty.plan = false; saveProt();
  } else if(pf){
    const p = JSON.parse(b64dec(pf.content));
    if(JSON.stringify(p) !== JSON.stringify(prot)){ prot = p; saveProt(); changed = true; }
  }
  for(const day of [...new Set([dayKey(), ...protDirty.days, ...(suppView ? [suppView] : [])])]){
    const path = `${PROT_DIR}/days/${day}.json`, f = await api(path + `?ref=${gh.branch}`);
    const remote = f ? JSON.parse(b64dec(f.content)).entries || [] : [];
    const merged = mergeEntries(remote, protLog[day]);
    if(JSON.stringify(merged) !== JSON.stringify(protLog[day] || [])){ protLog[day] = merged; changed = true; }
    if(protDirty.days.includes(day) && JSON.stringify(merged) !== JSON.stringify(mergeEntries(remote)))
      await api(path, { method:'PUT', body:JSON.stringify({ message:`Protein ${day}`,
        content:b64enc(JSON.stringify({ date:day, entries:merged }, null, 2) + '\n'), branch:gh.branch, ...(f ? { sha:f.sha } : {}) }) });
    protDirty.days = protDirty.days.filter(d => d !== day); saveProt();
  }
  return changed;
}

// Fetches workouts that are in GitHub but not on this phone. Returns how many were added.
async function pullNew(){
  const list = await api(`data/workouts?ref=${gh.branch}`) || [];
  const have = new Set(history.map(s => s.id)), gone = new Set(deleted.map(d => d.path));
  let added = 0;
  for(const f of list.filter(f => f.name.endsWith('.json') && !gone.has(f.path))){
    const id = f.name.replace(/\.json$/, '').split('-').pop();
    if(have.has(id)) continue;
    const file = await api(f.path + `?ref=${gh.branch}`);
    history.push({ ...JSON.parse(b64dec(file.content)), synced:true }); added++;
  }
  if(added){ history.sort((a, b) => a.startedAt - b.startedAt); save(); }
  return added;
}

// is saved as data/push/subs/<id>.json in the private repo (never in this page). The key below is

const VAPID_PUBLIC = 'BL3J-rsruiBzTRBniD5tqyPor9bEaFIeBS_px5ZdsNnDxCyyFVANUGg389dNMA17BoD4aCXxiDGw_4G9Lf3c_aQ';

  : pushId && Notification.permission === 'granted' ? 'on' : 'off';
const b64url = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - s.length % 4) % 4)), c => c.charCodeAt(0));
async function pushSave(sub){
  const id = pushId || Date.now().toString(36) + Math.random().toString(36).slice(2, 6), path = `data/push/subs/${id}.json`;
  const f = await api(path + `?ref=${gh.branch}`), j = sub.toJSON();

    content:b64enc(JSON.stringify({ endpoint:j.endpoint, keys:j.keys, added:dayKey() }, null, 2) + '\n') }) });

async function pushOn(){
  if(!ghReady()){ toast('Add the GitHub token first'); return; }
  if(await Notification.requestPermission() !== 'granted'){ toast('Notifications are blocked for this app'); render(); return; }
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.getSubscription() || await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:b64url(VAPID_PUBLIC) });
  await pushSave(sub); toast('Reminders on ✓'); render();
}
async function pushOff(){
  const reg = await navigator.serviceWorker.ready, sub = await reg.pushManager.getSubscription();
  if(sub) await sub.unsubscribe().catch(() => {});
  if(pushId && ghReady()){
    const path = `data/push/subs/${pushId}.json`, f = await api(path + `?ref=${gh.branch}`);
    if(f) await api(path, { method:'DELETE', body:JSON.stringify({ message:'Reminders: remove this phone', sha:f.sha, branch:gh.branch }) });
  }
  pushId = null; pushEp = ''; store.set('fb3.pushid', null); store.set('fb3.pushep', ''); toast('Reminders off'); render();

<html lang="en">
<head>
<meta charset="utf-8">
<!-- Security: the page may only talk to api.github.com, loads nothing from other sites (only its own
     icon, manifest and offline helper), and sends no referrer. Even injected code could not send the
     token to another site. Checked by tests/check-site.sh. -->

<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workout</title>
<!-- Installs as an app: home-screen icon, full screen, opens offline (sw.js) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f5f4f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101317" media="(prefers-color-scheme: dark)">
<style>
:root{
  --bg:#f5f4f0; --card:#ffffff; --ink:#1b1d21; --muted:#686c73; --line:#e2e0da;
  --input:#f0efea; --accent:#2a64d6; --accent-ink:#ffffff; --done:#1d8048;
  --done-bg:#e3f2e9; --hint:#9a5a12; --hint-bg:#fbf0e1; --bar:#1b1d21; --bar-ink:#ffffff; --bad:#b3261e;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101317; --card:#191d23; --ink:#e7e8eb; --muted:#9a9fa7; --line:#2a3038;
    --input:#222830; --accent:#5d8ff0; --accent-ink:#0b0d10; --done:#4cc27e;
    --done-bg:#15301f; --hint:#e3a65e; --hint-bg:#33260f; --bar:#e7e8eb; --bar-ink:#101317; --bad:#f2867d;
  }
}
:root[data-theme="dark"]{
  --bg:#101317; --card:#191d23; --ink:#e7e8eb; --muted:#9a9fa7; --line:#2a3038;
  --input:#222830; --accent:#5d8ff0; --accent-ink:#0b0d10; --done:#4cc27e;
  --done-bg:#15301f; --hint:#e3a65e; --hint-bg:#33260f; --bar:#e7e8eb; --bar-ink:#101317; --bad:#f2867d;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}

header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top)}
.top{display:flex;align-items:center;gap:8px;padding:10px 0 6px}
.top h1{font-size:17px;margin:0;flex:1}
.clock{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:13px}
.pill.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
nav{display:flex;gap:6px;padding:4px 0 10px}
nav button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:10px;
  padding:9px 0;font-weight:600;position:relative}
nav button[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
nav button .dot{position:absolute;top:6px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--done)}

.focus{color:var(--muted);margin:14px 0 4px;font-size:14px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.box h3{margin:0 0 4px;font-size:15px}
.small{font-size:13px;color:var(--muted)}

.ex{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:10px 0;overflow:hidden}
.ex.complete{border-color:var(--done)}
.ex-head{display:flex;gap:10px;padding:12px 14px 6px;align-items:flex-start}
.num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--input);display:grid;place-items:center;
  font-size:13px;font-weight:700}
.ex.complete .num{background:var(--done);color:var(--card)}
.ex-title{flex:1;min-width:0}
.ex-title select{width:100%;border:0;background:transparent;font-weight:650;font-size:16px;padding:0;
  appearance:none;-webkit-appearance:none;text-overflow:ellipsis}
.ex-title .swap{font-size:12px;color:var(--accent);font-weight:500}
.rx{font-size:14px;color:var(--muted);margin-top:2px}
.cue{font-size:13px;color:var(--muted);padding:0 14px 8px;margin:0}
.hint{margin:0 14px 8px;font-size:13px;background:var(--hint-bg);color:var(--hint);border-radius:8px;padding:6px 9px}
.last{font-size:12px;color:var(--muted);padding:0 14px 6px}

.sets{padding:2px 10px 10px}
.row{display:grid;grid-template-columns:28px 1fr 1fr 56px;gap:8px;align-items:center;padding:4px}
.row.head{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding-bottom:0}
.row .i{text-align:center;color:var(--muted);font-size:14px}
.row input{width:100%;min-width:0;border:1px solid transparent;background:var(--input);border-radius:9px;
  padding:9px 8px;text-align:center;font-size:17px;font-variant-numeric:tabular-nums}
.rrow{display:grid;grid-template-columns:1fr 56px;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.rrow.done .tick{opacity:1;background:var(--done);border-color:var(--done);color:var(--card)}
.reset h3 .small{font-weight:400}
.row .bwcell{text-align:center;color:var(--muted);font-size:14px;padding:9px 0}
.row input:focus{outline:none;border-color:var(--accent)}
.row input::placeholder{color:var(--muted);opacity:.75}
.tick{height:42px;border-radius:10px;border:2px solid var(--accent);background:var(--card);color:var(--accent);font-size:20px;line-height:1;opacity:.55}
.row.done .tick{opacity:1}
.row.done input{background:var(--done-bg)}
.row.done .tick{background:var(--done);border-color:var(--done);color:var(--card)}
.setbtns{display:flex;gap:8px;padding:2px 14px 12px}
.link{border:0;background:none;color:var(--accent);font-size:13px;padding:4px 0}

.actions{display:flex;gap:8px;margin:16px 0}
.btn{flex:1;border:0;border-radius:12px;padding:13px;font-weight:650;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
textarea{width:100%;min-height:70px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px}

details.sess{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:10px 0;padding:0 14px}
details.sess summary{padding:12px 0;cursor:pointer;font-weight:600}
details.sess summary span{font-weight:400;color:var(--muted);font-size:13px}
.sess ul{margin:0 0 10px;padding-left:18px;font-size:14px}
.sess li{margin:3px 0}
.empty{color:var(--muted);text-align:center;padding:30px 0}
.gh label{display:block;font-size:13px;color:var(--muted);margin:8px 0}
.gh input{display:block;width:100%;margin-top:4px;border:1px solid var(--line);background:var(--input);border-radius:9px;padding:9px;font-size:16px;color:var(--ink)}

#bar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--bar);color:var(--bar-ink);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .2s}
#bar.show{transform:none}
#bar .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px}
#bar .t{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;min-width:84px}
#bar .l{flex:1;font-size:13px;opacity:.8;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#bar button{border:1px solid currentColor;background:transparent;color:inherit;border-radius:9px;padding:7px 10px;font-size:14px}
#bar.over{background:var(--done);color:#fff}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:8px 14px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
#toast.show{opacity:1}

.pick{display:flex;align-items:center;gap:6px}
.pick select{flex:1;min-width:0}
.pick::after{content:'▾';color:var(--accent);font-size:15px}
.unitnote{font-size:12px;color:var(--muted);padding:0 14px 4px}
.bands{display:flex;flex-wrap:wrap;gap:6px;padding:4px 14px 6px}
.chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 11px;font-size:13px}
.chip .sw{width:12px;height:12px;border-radius:50%;border:1px solid var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.rep table{width:100%;border-collapse:collapse;font-size:14px}
.rep th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.rep th,.rep td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.rep td.n,.rep th.n{text-align:right;font-variant-numeric:tabular-nums}
.rep ul{margin:4px 0 0;padding-left:18px;font-size:14px}
.rep select{width:100%;border:1px solid var(--line);background:var(--input);border-radius:9px;padding:9px}
.up{color:var(--done);font-weight:700}
.down{color:var(--bad);font-weight:700}
.star{font-size:12px;color:var(--hint);white-space:nowrap}
@media print{
  header,#bar,#toast,.noprint{display:none!important}
  body{padding:0;background:#fff;color:#000}
  .box{break-inside:avoid;border-color:#ccc}
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <h1>Full Body 3</h1>
      <span class="clock" id="clock"></span>
      <button class="pill" id="wake" title="Keep the screen on during the workout">Screen on</button>
    </div>
    <nav id="tabs"></nav>
  </div>
</header>
<main class="wrap" id="main"></main>
<div id="bar"><div class="in">
  <span class="t" id="barT">0:00</span><span class="l" id="barL"></span>
  <button data-rest="-15">−15</button><button data-rest="15">+15</button><button data-rest="skip">Skip</button>
</div></div>
<div id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
// ---------- The plan (fitness.md §2d, updated 2026-10-18: home workout) ----------
const PLAN = {
  mon: { tab:'A', title:'Workout A', focus:'Squat · chest · wide pull', ex:[
    {name:'Barbell back squat', sets:4, min:6, max:10, rest:120,
      cue:'Brace: belly breath, ribs down, hold through the rep. Two seconds down, drive up.',
      alts:['Hack squat','Goblet squat','Leg press']},
    {name:'Weighted dead bug', sets:3, min:8, max:10, side:true, rest:45,
      cue:'Lower back stays pressed flat. When it lifts, the set is over — even at rep 5.',
      alts:['Plank','Hollow hold']},
    {name:'Flat dumbbell press', sets:4, min:6, max:10, rest:90,
      cue:'Lower to the lower chest, not the armpits. Elbows about 45° from the body.',
      alts:['Barbell bench press','Chest press machine']},
    {name:'Wide-grip lat pulldown', sets:4, min:8, max:12, rest:75,
      cue:'Wide overhand grip. Drive the elbows down, hands are hooks. Squeeze 1 s at the bottom.',
      alts:['Assisted pull-up (wide overhand)']},
    {name:'Lying leg curl', sets:3, min:10, max:12, rest:60,
      cue:'Two seconds on the way down. Hips stay on the pad.',
      alts:['Seated leg curl','Nordic curl']},
    {name:'Chest-supported dumbbell row', sets:3, min:10, max:12, rest:75,
      cue:'Elbows back and close to the ribs. Don’t push the chest into the pad. Squeeze 1 s.',
      alts:['Seal row','One-arm dumbbell row']},
    {name:'Dumbbell lateral raise', sets:3, min:12, max:15, rest:45,
      cue:'Lead with the elbows, stop at shoulder height. Fine to push close to the limit.',
      alts:['Cable lateral raise','Machine lateral raise']},
    {name:'Triceps pushdown', sets:2, min:12, max:15, rest:45,
      cue:'Elbows pinned at your sides; only the forearms move.',
      alts:['Overhead cable extension','Close-grip push-up']},
  ]},
  wed: { tab:'B', title:'Workout B', focus:'Leg press · back · shoulders', ex:[
    {name:'Leg press', sets:4, min:8, max:12, rest:90,
      cue:'Go down until just before the bum lifts off the seat — the back is the signal, not the knees.',
      alts:['Hack squat','Goblet squat']},
    {name:'Ab wheel rollout', sets:4, min:8, max:12, rest:60,
      cue:'Distance, not reps. Stop the moment the lower back sags. Ribs down.',
      alts:['Barbell rollout','Swiss ball rollout']},
    {name:'Seated cable row (neutral grip)', sets:4, min:8, max:12, rest:90,
      cue:'Neutral grip. Drive the elbows back, stay tall, squeeze the shoulder blades 1 s.',
      alts:['Row machine','Chest-supported row machine','Barbell row']},
    {name:'Seated dumbbell shoulder press', sets:3, min:6, max:10, rest:90,
      cue:'Ribs down, don’t lean back. Elbows slightly in front of the body.',
      alts:['Shoulder press machine','Barbell overhead press']},
    {name:'Bulgarian split squat', sets:3, min:10, max:10, side:true, sideWord:'leg', rest:60,
      cue:'All reps one leg, then the other, then rest. Front foot far enough forward that the heel stays down.',
      alts:['Walking lunge','Step-up']},
    {name:'Machine chest press', sets:3, min:10, max:12, rest:75,
      cue:'Set the seat so the handles are at mid-chest. Fine to push close to the limit.',
      alts:['Dumbbell press','Weighted push-up']},
    {name:'Reverse pec deck', sets:3, min:15, max:15, rest:45,
      cue:'Arms slightly bent, lead with the elbows, squeeze the shoulder blades 1 s. Light and strict.',
      alts:['Rear-delt dumbbell fly','Band pull-apart','Cable face pull']},
    {name:'Hammer curl', sets:2, min:10, max:12, rest:45,
      cue:'Palms facing each other, elbows still. Two seconds down.',
      alts:['Cable rope curl','Dumbbell curl']},
  ]},
  fri: { tab:'C', title:'Workout C', focus:'Hip thrust · hinge · incline', ex:[
    {name:'Barbell hip thrust', sets:4, min:6, max:10, rest:90,
      cue:'Chin tucked, ribs down, shins vertical at the top. Squeeze the glutes 1 s — don’t arch the lower back.',
      alts:['Hip thrust machine','Single-leg hip thrust']},
    {name:'Side plank', time:true, sets:3, min:30, max:45, side:true, rest:45,
      cue:'Straight line ear–hip–ankle; don’t let the hips sag. At 45 s easy, add a plate on the hip (enter kg).',
      alts:['Heavy one-arm dumbbell hold','Suitcase carry']},
    {name:'Romanian deadlift', sets:3, min:8, max:10, rest:90,
      cue:'Hips back, bar close to the legs, soft knees. Stop where the back would start to round.',
      alts:['Dumbbell RDL','Cable pull-through']},
    {name:'Incline dumbbell press', sets:3, min:8, max:12, rest:75,
      cue:'Low incline. Elbows about 45°, lower to the upper chest.',
      alts:['Incline barbell press','Incline machine press']},
    {name:'Neutral-grip pulldown', sets:3, min:8, max:12, rest:75,
      cue:'Palms facing each other. Elbows down and close to the ribs.',
      alts:['Neutral-grip assisted pull-up','Single-arm cable pulldown']},
    {name:'45° back extension', sets:3, min:12, max:12, rest:60,
      cue:'Hinge at the hips, squeeze the glutes at the top; don’t overextend. kg = extra weight held.',
      alts:['Cable pull-through','Good morning']},
    {name:'Weighted crunch', sets:3, min:15, max:20, rest:45,
      cue:'Plate on the chest, curl the ribs toward the pelvis. Feet free, not anchored (keeps hip flexors out).',
      alts:['Crunch machine','Cable rope crunch']},
    {name:'Calf press', sets:3, min:12, max:15, rest:45,
      cue:'Front half of the feet on the platform. Drop low, push high, hold 1 s.',
      alts:['Standing calf raise','Seated calf raise']},
  ]},
  // Home workout (fitness.md §2d "Home", 2026-10-18): replaces a missed gym day, home kit only.
  home: { tab:'H', title:'Home workout', focus:'Bands · floor · back care', ex:[
    {name:'Glute bridge', sets:4, min:10, max:15, rest:60,
      cue:'Loop band above the knees, push them out. Feet on the yoga blocks for more range. Ribs down, squeeze 1 s — don’t arch the lower back.',
      alts:['Single-leg glute bridge']},
    {name:'Ab wheel rollout', sets:3, min:8, max:12, rest:60,
      cue:'Kneel on the mat. Distance, not reps. Stop the moment the lower back sags. Ribs down.',
      alts:['Dead bug']},
    {name:'Band row (neutral grip)', sets:4, min:10, max:15, rest:75,
      cue:'Door anchor at chest height. Same number of steps back every time. Elbows back and close to the ribs, squeeze 1 s.',
      alts:['Single-arm band row']},
    {name:'Push-up on handles', sets:3, min:8, max:15, rest:75,
      cue:'Straight wrists, body in one line, chest below the hands. Elbows about 45° from the body.',
      alts:['Feet-elevated push-up']},
    {name:'Bulgarian split squat', sets:3, min:10, max:15, side:true, sideWord:'leg', rest:60,
      cue:'Back foot on the sofa. All reps one leg, then the other. Front heel stays down.',
      alts:['Reverse lunge']},
    {name:'Band pulldown (kneeling)', sets:3, min:12, max:15, rest:60,
      cue:'Door anchor at the top. Kneel facing the door, pull the elbows down to the ribs, squeeze 1 s.',
      alts:['Band straight-arm pulldown']},
    {name:'Lying back raise', sets:3, min:12, max:12, rest:60,
      cue:'Face down on the mat. Squeeze the glutes, lift the chest a little, hold 2 s. Look at the floor; don’t crank up.',
      alts:['Lying arm-leg raise']},
    {name:'Band pull-apart', sets:3, min:15, max:20, rest:45,
      cue:'Arms straight at shoulder height, pull the band to the chest, squeeze the shoulder blades.',
      alts:['Band face pull']},
  ]},
};
const DAYS = ['mon','wed','fri'];       // the gym rotation A → B → C
const ALL = [...DAYS, 'home'];          // every tab; the home workout stands in for a missed gym day

// Desk reset before every session (fitness.md §2b "Warm-up", 2026-10-16). Ticks are saved with the workout as `reset`.
const RESET = [
  { name:'Couch stretch', dose:'45 s / side', cue:'Back foot up on a bench, squeeze that glute, ribs down.' },
  { name:'90/90 hip switches', dose:'8 / side', cue:'Sit tall, knees bent 90°, rotate both knees side to side.' },
  { name:'Open book', dose:'8 / side', cue:'Lie on your side, knees bent, open the top arm and follow it with your eyes.' },
  { name:'Deep squat hold', dose:'45 s', cue:'Hold a rack, heels down, chest up. +15 s when easy.' },
  { name:'Dead hang', dose:'30 s', cue:'Shoulders slightly active, breathe. +15 s when easy.' },
];
// At home: same five slots, without the bench, rack and bar.
const RESET_HOME = [
  { name:'Couch stretch', dose:'45 s / side', cue:'Back foot up on the sofa, squeeze that glute, ribs down.' },
  RESET[1], RESET[2],
  { name:'Deep squat hold', dose:'45 s', cue:'Hold the door frame, heels down, chest up. +15 s when easy.' },
  { name:'Foam roll upper back', dose:'60 s', cue:'Roller across the shoulder blades, hands behind the head. Not on the lower back.' },
];
const resetFor = day => day === 'home' ? RESET_HOME : RESET;
const resetDone = s => (s.reset || []).filter(Boolean).length;

// Cool-down after the home workout (fitness.md §2d "Home"). Ticks are saved with the workout as `cool`.
const COOL = [
  { name:'Knees-to-chest stretch', dose:'2 × 30 s', cue:'On your back, pull both knees in, lower back relaxed on the mat.' },
  { name:'Lying hamstring stretch', dose:'2 × 30 s / leg', cue:'On your back, a tube round the foot, leg straight up until a gentle stretch. No bouncing.' },
];

// Muscle group per exercise slot (swaps count for the same group). Used by the weekly report.
const MG = {
  mon:['Quads','Core','Chest','Back','Hamstrings & glutes','Back','Shoulders','Arms'],
  wed:['Quads','Core','Back','Shoulders','Quads','Chest','Shoulders','Arms'],
  fri:['Hamstrings & glutes','Core','Hamstrings & glutes','Chest','Back','Hamstrings & glutes','Core','Calves'],
  home:['Hamstrings & glutes','Core','Back','Chest','Quads','Back','Core','Shoulders'],
};
ALL.forEach(d => PLAN[d].ex.forEach((e, i) => e.mg = MG[d][i]));

// Bands (Home kit, 2026-10-18): tap the colours used, the page adds up their kg.
// Tubes stack on one handle; power bands use the top of their label; loop bands have no kg.
const BANDS = {
  tube:  { word:'Tubes', stack:true, list:[['Yellow','#e8c62e',4.6],['Green','#3a9d4f',9.1],['Red','#d0342c',13.6],
           ['Blue','#2f6fd0',18.2],['Black','#222',22.8]] },
  power: { word:'Power band', stack:true, list:[['Blue','#2f6fd0',11.3],['Green','#3a9d4f',15.9],['Purple','#7a4bc2',22.7],
           ['Yellow','#e8c62e',36.3],['Red','#d0342c',56.7],['Black','#222',60]] },
  loop:  { word:'Loop band', stack:false, list:[['Medium','#e58fb0'],['Heavy','#222']] },
};
const BAND_OF = { 'Glute bridge':'loop', 'Single-leg glute bridge':'loop', 'Band row (neutral grip)':'tube',
  'Single-arm band row':'tube', 'Band pulldown (kneeling)':'tube', 'Band straight-arm pulldown':'tube',
  'Band face pull':'tube', 'Band pull-apart':'power' };
const bandOf = name => BAND_OF[name] || null;
const bandKg = (name, colours) => {
  const b = BANDS[bandOf(name)];
  const kg = colours.reduce((n, c) => n + ((b.list.find(x => x[0] === c) || [])[2] || 0), 0);
  return kg ? String(Math.round(kg * 10) / 10) : '';
};
const GROUPS = ['Quads','Hamstrings & glutes','Chest','Back','Shoulders','Arms','Core','Calves'];

// How weight is entered (the user's rule, 2026-10-15):
// one weight shared by both sides (barbell, machine, cable) → the total;
// dumbbells → what one hand holds; assisted machines → the assist, and what you lift = body weight − assist.
const PER_HAND = new Set(['Weighted dead bug','Flat dumbbell press','Dumbbell press','Chest-supported dumbbell row',
  'One-arm dumbbell row','Dumbbell lateral raise','Seated dumbbell shoulder press','Bulgarian split squat','Walking lunge',
  'Step-up','Rear-delt dumbbell fly','Hammer curl','Dumbbell curl','Incline dumbbell press','Dumbbell RDL','Heavy one-arm dumbbell hold']);
const loadOf = name => /assisted/i.test(name) ? 'assist' : PER_HAND.has(name) ? 'hand' : 'total';
const LOAD_HEAD = { total:'kg total', hand:'kg / hand', assist:'assist kg' };
// Body-weight exercises (2026-10-16): 'only' → no weight box at all; 'plus' → body weight, extra kg optional.
const BW_ONLY = new Set(['Ab wheel rollout','Barbell rollout','Swiss ball rollout','Hollow hold','Dead bug',
  'Nordic curl','Close-grip push-up','Push-up on handles','Feet-elevated push-up','Lying back raise','Lying arm-leg raise']);
const BW_PLUS = new Set(['Bulgarian split squat','Walking lunge','Step-up','Reverse lunge','Plank','Side plank',
  'Single-leg hip thrust','45° back extension','Weighted push-up']);
const bwOf = name => BW_ONLY.has(name) ? 'only' : BW_PLUS.has(name) ? 'plus' : null;
const headOf = name => bandOf(name) ? (bandOf(name) === 'loop' ? 'band' : 'band kg') : bwOf(name) === 'only' ? 'body weight'
  : bwOf(name) === 'plus' ? '+' + LOAD_HEAD[loadOf(name)] : LOAD_HEAD[loadOf(name)];

// ---------- Storage (all of it stays on this device) ----------
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
};
let history = store.get('fb3.history', []);
let drafts  = store.get('fb3.drafts', {});
let view    = defaultDay();
const save = () => { store.set('fb3.history', history); store.set('fb3.drafts', drafts); };
let bodyweight = store.get('fb3.bw', '');   // typed in on the phone, never in this file
let reportId = null;                        // which workout the Report tab shows (null = latest)

// Opens on the workout in progress, otherwise the next one in the rotation A → B → C → A.
// A home workout stands in for the gym workout that was due, so the rotation moves on past it.
// (Internally A/B/C are still 'mon'/'wed'/'fri', so saved workouts and file names stay the same.)
function defaultDay(){
  const open = ALL.filter(d => drafts[d]?.startedAt).sort((a, b) => drafts[b].startedAt - drafts[a].startedAt)[0];
  if(open) return open;
  let next = 0;
  history.forEach(s => { next = DAYS.includes(s.day) ? DAYS.indexOf(s.day) + 1 : s.day === 'home' ? next + 1 : next; });
  return DAYS[next % DAYS.length];
}
function blank(day){
  return { day, startedAt:null, notes:'', reset:RESET.map(() => false), ...(day === 'home' ? { cool:COOL.map(() => false) } : {}),
    slots: PLAN[day].ex.map(ex => {
      const name = lastUsed(ex), last = lastFor(name);
      const band = bandOf(name) && last ? (last.sets[last.sets.length - 1].band || '').split('+').filter(Boolean) : [];
      return { name, ...(bandOf(name) ? { band } : {}), sets:Array.from({length:ex.sets}, newSet) };
    }) };
}
// a slot starts on the variant done most recently (e.g. assisted pull-up instead of pulldown)
function lastUsed(ex){
  const used = [ex.name, ...ex.alts].map(n => ({ n, l:lastFor(n) })).filter(o => o.l).sort((a, b) => b.l.at - a.l.at)[0];
  return used ? used.n : ex.name;
}
function newSet(){ return { kg:'', reps:'', done:false }; }
function draft(day, create){
  if(!drafts[day] && create){ drafts[day] = blank(day); }
  if(drafts[day] && create && !drafts[day].startedAt){ drafts[day].startedAt = Date.now(); }
  return drafts[day] || blank(day);
}
function lastFor(name){
  for(let i = history.length - 1; i >= 0; i--){
    const s = history[i].slots.find(x => x.name === name && x.sets.some(t => t.done));
    if(s) return { at:history[i].startedAt, sets:s.sets.filter(t => t.done) };
  }
  return null;
}
function prevFor(name, before){
  for(let i = history.length - 1; i >= 0; i--){
    if(history[i].startedAt >= before) continue;
    const s = history[i].slots.find(x => x.name === name && x.sets.some(t => t.done));
    if(s) return { at:history[i].startedAt, bw:history[i].bw, sets:s.sets.filter(t => t.done) };
  }
  return null;
}
function exFor(name){
  for(const d of ALL){ const e = PLAN[d].ex.find(e => e.name === name || e.alts.includes(name)); if(e) return e; }
  return null;
}
// kg actually moved; for assisted machines body weight − assist (null if body weight unknown)
function lifted(s, name, bw){
  const kg = parseFloat(s.kg);
  if(loadOf(name) === 'assist'){ const b = parseFloat(bw || bodyweight); return b && !isNaN(kg) ? b - kg : null; }
  return isNaN(kg) ? 0 : kg;
}
// one number to compare sets: estimated 1-rep max, or reps/seconds when there is no weight
function score(s, name, bw){
  // body-weight exercises: body (or 80 kg if unknown) + any extra, so 10 reps with a dumbbell beats 10 without
  if(bwOf(name)) return ((parseFloat(bw || bodyweight) || 80) + (parseFloat(s.kg) || 0)) * (1 + (+s.reps || 0) / 30);
  // loop bands have no kg: the heavy band ranks above the medium one at the same reps
  if(bandOf(name) === 'loop') return (+s.reps || 0) * (s.band === 'Heavy' ? 1.25 : s.band === 'Medium' ? 1.1 : 1);
  let kg = lifted(s, name, bw);
  if(kg == null) kg = 100 - (parseFloat(s.kg) || 0);   // no body weight yet: less assist still ranks higher
  const r = +s.reps || 0;
  return kg > 0 ? kg * (1 + r / 30) : r;
}
const best = (sets, name, bw) => sets.reduce((b, s) => !b || score(s, name, bw) > score(b, name, bw) ? s : b, null);
// what to change once every set hit the top of the range
function nextStep(ex, name, sets){
  const bwk = bwOf(name);
  if(bandOf(name) === 'loop') return 'use the heavy band, then go single-leg';
  if(bandOf(name)) return 'add a band or a stronger one (or step further back)';
  if(bwk === 'only') return 'make it harder (further range, slower, or a harder variant)';
  if(bwk === 'plus' && !sets.some(s => parseFloat(s.kg) > 0)) return loadOf(name) === 'hand' ? 'hold light dumbbells' : 'hold a light weight';
  if(ex.time) return 'add a little weight';
  return loadOf(name) === 'assist' ? 'lower the assist one step' : 'add the smallest weight step';
}
function weekStart(t){ const d = new Date(t); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return d.getTime(); }

// ---------- Formatting ----------
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const range = ex => ex.min === ex.max ? ex.min : `${ex.min}–${ex.max}`;
const rx = ex => `${ex.sets} × ${range(ex)}${ex.time ? ' s' : ''}${ex.side ? ' / ' + (ex.sideWord || 'side') : ''}`;
const restTxt = s => s >= 60 && s % 60 === 0 ? `${s/60} min` : s > 60 ? `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}` : `${s}s`;
const mmss = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
const round = (kg, step) => Math.round(kg / step) * step;
const dateTxt = t => new Date(t).toLocaleDateString(undefined, { weekday:'short', day:'numeric', month:'short' });
const setTxt = (s, ex, name, bw) => {
  const amt = ex && ex.time ? `${s.reps}s` : s.reps;
  if(s.band) return `${s.band.split('+').join(' + ')}${s.kg ? ` (${s.kg} kg)` : ''} × ${amt}`;
  if(s.kg === '' || s.kg == null) return `${amt}${ex && ex.time ? '' : ' reps'}`;
  const load = loadOf(name || (ex && ex.name) || '');
  if(bwOf(name || (ex && ex.name) || '')) return `BW + ${s.kg} kg${load === 'hand' ? '/hand' : ''} × ${amt}`;
  if(load === 'assist'){ const l = lifted(s, name, bw); return `assist ${s.kg} kg${l != null ? ` (lift ${l})` : ''} × ${amt}`; }
  return `${s.kg} kg${load === 'hand' ? '/hand' : ''} × ${amt}`;
};

// ---------- Render ----------
const $main = document.getElementById('main');
function render(){
  document.getElementById('tabs').innerHTML =
    ALL.map(d => `<button data-tab="${d}" aria-current="${view===d}">${PLAN[d].tab}${drafts[d]?.startedAt ? '<span class="dot"></span>' : ''}</button>`).join('') +
    `<button data-tab="log" aria-current="${view==='log'}">Log</button>` +
    `<button data-tab="report" aria-current="${view==='report'}">Report</button>`;
  view === 'log' ? renderLog() : view === 'report' ? renderReport() : renderDay(view);
  tickClock();
}

function renderDay(day){
  const p = PLAN[day], d = draft(day, false), reset = resetFor(day);
  let h = `<p class="focus">${p.title} — ${p.focus}</p>
  <div class="box reset"><h3>Desk reset (~5 min) <span class="small">${resetDone(d)}/${reset.length}</span></h3>
    ${reset.map((r, k) => `<div class="rrow ${(d.reset || [])[k] ? 'done' : ''}">
      <div><b>${esc(r.name)}</b> · ${esc(r.dose)}<div class="small">${esc(r.cue)}</div></div>
      <button class="tick" data-reset="${k}" aria-label="${esc(r.name)} done">✓</button></div>`).join('')}
    <div class="small">Hip flexors are the stretch that matters most. ${day === 'home' ? 'Start every set with the same band and distance as last time.' : 'Warm-up sets only for exercise 1.'}</div></div>`;

  p.ex.forEach((ex, i) => {
    const slot = d.slots[i], last = lastFor(slot.name);
    const doneCount = slot.sets.filter(s => s.done).length;
    const options = [ex.name, ...ex.alts].map(n => `<option ${n===slot.name?'selected':''}>${esc(n)}</option>`).join('');
    const load = loadOf(slot.name), bwk = bwOf(slot.name), band = bandOf(slot.name), picked = slot.band || [];
    let hint = '';
    if(last && last.sets.length >= ex.sets && last.sets.every(s => +s.reps >= ex.max))
      hint = `Hit the top of the range on every set last time → ${nextStep(ex, slot.name, last.sets)}, restart at the bottom.`;
    let unit = bwk === 'plus' ? `Body weight. Holding weight? Enter ${load === 'hand' ? 'one dumbbell' : 'the extra kg'}; leave it empty if none.`
             : bwk === 'only' ? '' : load === 'hand' ? 'Dumbbells: enter the weight of one dumbbell.' : '';
    if(load === 'assist'){
      const lifts = slot.sets.filter(s => s.kg !== '').map(s => lifted(s, slot.name));
      unit = !bodyweight ? 'Enter the assist. Add your body weight in Log to see what you lift.'
           : `Enter the assist. You lift ${bodyweight} − assist${lifts.length && lifts.every(l => l != null) ? `: ${lifts.join(' · ')} kg` : ''}.`;
    }
    if(band){
      const kg = bandKg(slot.name, picked);
      unit = band === 'loop' ? 'Tap the band you use.'
           : `Tap the ${band === 'tube' ? 'tubes on the handle (stack them for more)' : 'band (or two together)'}.`
             + (kg ? ` Now: ${picked.join(' + ')} = ${kg} kg.` : '');
    }
    if(i === 0 && !band && !bwk){
      const top = last ? Math.max(...last.sets.map(s => +s.kg || 0)) : 0;
      hint = (top ? `Warm-up sets: ${round(top*.5, 2.5)} kg × 5, then ${round(top*.8, 2.5)} kg × 3. ` : 'Warm-up sets: ~50% × 5, then ~80% × 3. ') + hint;
    }
    h += `<article class="ex ${doneCount >= slot.sets.length ? 'complete' : ''}">
      <div class="ex-head"><div class="num">${i+1}</div>
        <div class="ex-title">
          <div class="pick"><select data-swap="${i}" aria-label="Exercise (tap to swap)">${options}</select></div>
          <div class="rx">${rx(ex)} · rest ${restTxt(ex.rest)} ${slot.name !== ex.name ? '· <span class="swap">swapped</span>' : ''}</div>
        </div></div>
      <p class="cue">${esc(ex.cue)}</p>
      ${hint ? `<div class="hint">${esc(hint)}</div>` : ''}
      ${last ? `<div class="last">Last (${dateTxt(last.at)}): ${last.sets.map(s => esc(setTxt(s, ex, slot.name))).join(' · ')}</div>` : ''}
      ${unit ? `<div class="unitnote">${esc(unit)}</div>` : ''}
      ${band ? `<div class="bands">${BANDS[band].list.map(([c, col]) =>
        `<button class="chip" data-band="${i}.${esc(c)}" aria-pressed="${picked.includes(c)}"><span class="sw" style="background:${col}"></span>${esc(c)}</button>`).join('')}</div>` : ''}
      <div class="sets">
        <div class="row head"><span></span><span>${headOf(slot.name)}</span><span>${ex.time ? 'sec' : 'reps'}</span><span></span></div>
        ${slot.sets.map((s, j) => {
          const ref = last ? (last.sets[j] || last.sets[last.sets.length-1]) : null;
          const lastKg = ref && ref.kg !== '' && ref.kg != null ? ref.kg : '';
          return `<div class="row ${s.done ? 'done' : ''}">
            <span class="i">${j+1}</span>
            ${band ? `<span class="bwcell">${esc(s.done ? (band === 'loop' ? s.band || '–' : s.kg || '–') : (band === 'loop' ? picked[0] || '–' : bandKg(slot.name, picked) || '–'))}</span>`
              : bwk === 'only' ? '<span class="bwcell">BW</span>'
              : `<input inputmode="decimal" data-i="${i}" data-j="${j}" data-f="kg" data-last="${esc(lastKg)}" value="${esc(s.kg)}" placeholder="${lastKg !== '' ? esc(lastKg) : bwk ? 'BW' : '–'}" aria-label="Set ${j+1} ${headOf(slot.name)}">`}
            <input inputmode="numeric" data-i="${i}" data-j="${j}" data-f="reps" value="${esc(s.reps)}" placeholder="${ref ? esc(ref.reps) : ex.max}" aria-label="Set ${j+1} ${ex.time ? 'seconds' : 'reps'}">
            <button class="tick" data-tick="${i}.${j}" aria-label="Set ${j+1} done">✓</button>
          </div>`;}).join('')}
      </div>
      <div class="setbtns"><button class="link" data-addset="${i}">+ set</button>
        ${slot.sets.length > 1 && !slot.sets[slot.sets.length-1].done ? `<button class="link" data-delset="${i}">− set</button>` : ''}</div>
    </article>`;
  });

  if(day === 'home'){
    const cool = d.cool || [];
    h += `<div class="box reset"><h3>Cool-down: back care <span class="small">${cool.filter(Boolean).length}/${COOL.length}</span></h3>
      ${COOL.map((r, k) => `<div class="rrow ${cool[k] ? 'done' : ''}">
        <div><b>${esc(r.name)}</b> · ${esc(r.dose)}<div class="small">${esc(r.cue)}</div></div>
        <button class="tick" data-cool="${k}" aria-label="${esc(r.name)} done">✓</button></div>`).join('')}</div>`;
  }
  h += `<div class="box"><h3>Notes</h3>
      <textarea id="notes" placeholder="How did it feel? Anything to change?">${esc(d.notes)}</textarea></div>
    <div class="actions"><button class="btn ghost" data-act="discard">Clear day</button>
      <button class="btn" data-act="finish">Finish workout</button></div>
    <div class="box small">Stop each set ~2 reps short of failure (machines and raises can go closer).
      When every set hits the top of the range, add the smallest step and restart at the bottom.
      A missed day moves to the next day — never merge two sessions.</div>`;
  $main.innerHTML = h;
}

function renderLog(){
  let h = `<div class="actions">
    <button class="btn ghost" data-act="backup">Backup</button>
    <button class="btn ghost" data-act="restore">Restore</button></div>
    <p class="small">${syncText()} Export a backup now and then — it can be imported into the app later.</p>
    <div class="box gh"><h3>Body weight</h3>
      <label>kg — used for assisted pull-ups (you lift body weight − assist), body-weight exercises and the report
        <input id="bw" inputmode="decimal" value="${esc(bodyweight)}" placeholder="kg"></label></div>`;
  h += `<details class="sess" ${ghReady() ? '' : 'open'}><summary>GitHub ${ghReady() ? '<span>· connected</span>' : '<span>· not set up</span>'}</summary>
    <p class="small">Finished workouts are saved as files in <b>data/workouts/</b> of your repo. Use a fine-grained token
      limited to that one repo, with <b>Contents: read and write</b> and an expiry date. It stays in this browser only.</p>
    <div class="gh">
      <label>Repo <input id="ghRepo" value="${esc(gh.repo)}" autocapitalize="off" spellcheck="false"></label>
      <label>Branch <input id="ghBranch" value="${esc(gh.branch)}" autocapitalize="off" spellcheck="false"></label>
      <label>Token <input id="ghToken" type="password" placeholder="${gh.token ? 'saved — leave empty to keep' : 'github_pat_…'}" autocomplete="off"></label>
    </div>
    <div class="actions"><button class="btn" data-act="ghsave">Save</button>
      <button class="btn ghost" data-act="ghpull">Load from GitHub</button>
      ${gh.token ? '<button class="btn ghost" data-act="ghforget">Forget token</button>' : ''}</div></details>`;
  if(!history.length) h += `<p class="empty">No finished workouts yet.</p>`;
  [...history].reverse().forEach(s => {
    const p = PLAN[s.day];
    const sets = s.slots.reduce((n, x) => n + x.sets.filter(t => t.done).length, 0);
    const mins = s.finishedAt && s.startedAt ? Math.round((s.finishedAt - s.startedAt) / 60000) : null;
    h += `<details class="sess"><summary>${dateTxt(s.startedAt)} · ${p ? p.title : s.day} <span>· ${sets} sets${mins ? ` · ${mins} min` : ''}</span></summary><ul>
      ${s.slots.filter(x => x.sets.some(t => t.done)).map(x => {
        const ex = p && p.ex.find(e => e.name === x.name || e.alts.includes(x.name));
        return `<li><b>${esc(x.name)}</b>: ${x.sets.filter(t => t.done).map(t => esc(setTxt(t, ex, x.name, s.bw))).join(' · ')}</li>`;
      }).join('')}</ul>
      ${s.notes ? `<p class="small">${esc(s.notes)}</p>` : ''}
      <p><button class="link" data-delsess="${s.id}">Delete this workout</button></p></details>`;
  });
  $main.innerHTML = h;
}

function renderReport(){
  if(!history.length){ $main.innerHTML = `<p class="empty">No finished workouts yet. The report appears after your first one.</p>`; return; }
  const s = history.find(x => x.id === reportId) || history[history.length - 1];
  const p = PLAN[s.day];
  const mins = s.finishedAt && s.startedAt ? Math.round((s.finishedAt - s.startedAt) / 60000) : null;
  const all = s.slots.flatMap(x => x.sets), done = all.filter(t => t.done).length;

  let h = `<div class="box noprint rep"><select id="repSel" aria-label="Workout">${[...history].reverse().map(x =>
    `<option value="${esc(x.id)}" ${x.id === s.id ? 'selected' : ''}>${dateTxt(x.startedAt)} · ${PLAN[x.day] ? PLAN[x.day].title : esc(x.day)}</option>`).join('')}</select></div>`;

  // 1. The workout, exercise by exercise, against the time before
  const rows = s.slots.map(x => {
    const sets = x.sets.filter(t => t.done), ex = exFor(x.name);
    const count = `<div class="small">${sets.length}/${x.sets.length} sets${sets.length < x.sets.length ? ' · <span class="down">' + (x.sets.length - sets.length) + ' skipped</span>' : ''}</div>`;
    if(!sets.length) return `<tr><td><b>${esc(x.name)}</b>${count}</td><td>—</td><td class="n">—</td></tr>`;
    const b = best(sets, x.name, s.bw), sc = score(b, x.name, s.bw), prev = prevFor(x.name, s.startedAt);
    let vs = '<span class="small">first time</span>';
    if(prev){
      const pb = best(prev.sets, x.name, prev.bw), pc = score(pb, x.name, prev.bw);
      const arrow = sc > pc * 1.005 ? '<span class="up">↑</span>' : sc < pc * .995 ? '<span class="down">↓</span>' : '=';
      const ever = Math.max(...history.filter(o => o.startedAt < s.startedAt).flatMap(o => o.slots.filter(y => y.name === x.name)
        .flatMap(y => y.sets.filter(t => t.done).map(t => score(t, x.name, o.bw)))));
      vs = `${arrow} <span class="small">${esc(setTxt(pb, ex, x.name, prev.bw))}</span>${sc > ever ? '<div class="star">★ best ever</div>' : ''}`;
    }
    return `<tr><td><b>${esc(x.name)}</b>${count}</td><td>${esc(setTxt(b, ex, x.name, s.bw))}</td><td class="n">${vs}</td></tr>`;
  }).join('');
  h += `<div class="box rep"><h3>${dateTxt(s.startedAt)} · ${p ? p.title : esc(s.day)}</h3>
    <p class="small">${done} of ${all.length} sets${mins ? ` · ${mins} min` : ''} · desk reset ${resetDone(s) === RESET.length ? '✓' : `${resetDone(s)}/${RESET.length}`}</p>
    <table><tr><th>Exercise</th><th>Best set</th><th class="n">vs last time</th></tr>${rows}</table>
    ${s.notes ? `<p class="small">Notes: ${esc(s.notes)}</p>` : ''}</div>`;

  // 2. Next time: exercises whose latest session hit the top of the range on every set
  const next = [], listed = new Set();   // ab wheel and split squat are in B and at home: list them once
  ALL.forEach(d => PLAN[d].ex.forEach(ex => {
    const last = [ex.name, ...ex.alts].map(n => ({ n, l:lastFor(n) })).filter(o => o.l).sort((a, b) => b.l.at - a.l.at)[0];
    if(last && !listed.has(last.n) && listed.add(last.n) && last.l.sets.length >= ex.sets && last.l.sets.every(t => +t.reps >= ex.max))
      next.push(`<li><b>${esc(last.n)}</b> (${PLAN[d].title}) — ${nextStep(ex, last.n, last.l.sets)}</li>`);
  }));
  h += `<div class="box rep"><h3>Next time</h3>${next.length ? `<ul>${next.join('')}</ul>`
    : '<p class="small">Nothing to raise yet — keep adding reps until every set reaches the top of its range.</p>'}</div>`;

  // 3. This week against last week: sessions and hard sets per muscle group
  const wk = weekStart(Date.now()), prevWk = wk - 7 * 864e5;
  const tally = (from, to) => {
    const ses = history.filter(o => o.startedAt >= from && o.startedAt < to), g = {};
    ses.forEach(o => o.slots.forEach(x => { const mg = exFor(x.name)?.mg || 'Other'; g[mg] = (g[mg] || 0) + x.sets.filter(t => t.done).length; }));
    return { n:ses.length, g, reset:ses.filter(o => resetDone(o) === RESET.length).length };
  };
  const a = tally(wk, wk + 7 * 864e5), b = tally(prevWk, wk);
  // habit streak: weeks in a row where every workout started with the full desk reset
  let streak = 0;
  for(let w = a.n ? wk : prevWk; ; w -= 7 * 864e5){
    const x = tally(w, w + 7 * 864e5);
    if(!x.n || x.reset < x.n) break;
    streak++;
  }
  h += `<div class="box rep"><h3>This week</h3>
    <p class="small">${a.n} of 3 workouts done (last week ${b.n}).</p>
    <p class="small">Desk reset: ${a.reset} of ${a.n} workouts (last week ${b.reset} of ${b.n})${streak ? ` · <b>${streak} week${streak === 1 ? '' : 's'} in a row</b>` : ''}.</p>
    <table><tr><th>Sets per muscle</th><th class="n">This week</th><th class="n">Last week</th></tr>
    ${GROUPS.concat(a.g.Other || b.g.Other ? ['Other'] : []).map(g => `<tr><td>${g}</td><td class="n">${a.g[g] || 0}</td><td class="n">${b.g[g] || 0}</td></tr>`).join('')}</table></div>
    <div class="actions noprint"><button class="btn ghost" data-act="print">Save as PDF</button></div>`;
  $main.innerHTML = h;
}

// ---------- Events ----------
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if(!t) return;
  if(t.dataset.tab){ view = t.dataset.tab; store.set('fb3.view', view); render(); scrollTo(0, 0); return; }
  if(t.dataset.rest){ adjustRest(t.dataset.rest); return; }
  if(t.id === 'wake'){ toggleWake(); return; }

  if(t.dataset.tick){
    const [i, j] = t.dataset.tick.split('.').map(Number), d = draft(view, true), s = d.slots[i].sets[j];
    const row = t.closest('.row'), kgIn = row.querySelector('[data-f="kg"]'), repIn = row.querySelector('[data-f="reps"]');
    s.done = !s.done;
    if(s.done){
      // one tap if the numbers match last time: take the greyed-in values (body-weight exercises have none)
      if(s.kg === '' && kgIn && kgIn.dataset.last) s.kg = kgIn.dataset.last;
      if(s.reps === '') s.reps = repIn.placeholder;
      // bands: the colours tapped for this exercise, and their kg
      if(bandOf(d.slots[i].name)){ const c = d.slots[i].band || []; s.band = c.join('+'); s.kg = bandKg(d.slots[i].name, c); }
      const ex = PLAN[view].ex[i];
      const lastSet = d.slots[i].sets.every(x => x.done);
      startRest(ex.rest, lastSet ? `Next: ${PLAN[view].ex[i+1]?.name || 'finish'}` : `${d.slots[i].name} · set ${j+2}`);
    }
    save(); render(); return;
  }
  if(t.dataset.reset){
    const d = draft(view, true), k = +t.dataset.reset;
    d.reset = RESET.map((_, n) => !!(d.reset || [])[n]); d.reset[k] = !d.reset[k];
    save(); render(); return;
  }
  if(t.dataset.cool){
    const d = draft(view, true), k = +t.dataset.cool;
    d.cool = COOL.map((_, n) => !!(d.cool || [])[n]); d.cool[k] = !d.cool[k];
    save(); render(); return;
  }
  if(t.dataset.band){
    const [i, c] = t.dataset.band.split('.'), slot = draft(view, true).slots[+i], b = BANDS[bandOf(slot.name)];
    const now = slot.band || [];
    slot.band = now.includes(c) ? now.filter(x => x !== c) : b.stack ? [...now, c] : [c];
    slot.band.sort((x, y) => b.list.findIndex(z => z[0] === x) - b.list.findIndex(z => z[0] === y));
    save(); render(); return;
  }
  if(t.dataset.addset){ draft(view, true).slots[+t.dataset.addset].sets.push(newSet()); save(); render(); return; }
  if(t.dataset.delset){ draft(view, true).slots[+t.dataset.delset].sets.pop(); save(); render(); return; }
  if(t.dataset.delsess){
    if(confirm('Delete this workout from the log?')){
      const gone = history.find(s => s.id === t.dataset.delsess);
      history = history.filter(s => s.id !== t.dataset.delsess);
      if(gone && gone.synced){ deleted.push({ path:pathFor(gone) }); store.set('fb3.deleted', deleted); }
      save(); render(); sync();
    }
    return;
  }
  const act = t.dataset.act;
  if(act === 'finish'){
    const d = drafts[view];
    const filled = d ? d.slots.flatMap(x => x.sets).filter(s => !s.done && s.reps !== '') : [];
    if(!d || !d.slots.some(x => x.sets.some(s => s.done))){
      // forgiving: sets with numbers typed in but never ticked still count
      if(!filled.length){ toast('Nothing logged yet — tap ✓ after each set'); return; }
      if(!confirm(`No sets ticked. Save the ${filled.length} set${filled.length === 1 ? '' : 's'} you filled in?`)) return;
      filled.forEach(s => s.done = true);
    } else {
      if(!confirm(filled.length ? `Finish and save? ${filled.length} filled-in set${filled.length === 1 ? '' : 's'} without ✓ will be saved too.` : 'Finish and save this workout?')) return;
      filled.forEach(s => s.done = true);
    }
    // id: time + random suffix, so two workouts can never share one (or one file name)
    history.push({ ...d, id: Date.now() + Math.random().toString(36).slice(2, 7), finishedAt: Date.now(),
      ...(bodyweight ? { bw: bodyweight } : {}), synced: false });
    delete drafts[view]; save(); stopRest(); render(); scrollTo(0, 0); toast('Workout saved ✓'); sync();
  }
  if(act === 'discard'){
    if(drafts[view] && confirm('Clear everything entered for today? (Saved workouts are kept.)')){ delete drafts[view]; save(); render(); }
  }
  if(act === 'ghsave'){
    const v = id => document.getElementById(id).value.trim();
    const next = { repo:v('ghRepo'), branch:v('ghBranch') || 'main', token:v('ghToken') || gh.token };
    if(!/^[\w.-]+\/[\w.-]+$/.test(next.repo) || !/^[\w./-]+$/.test(next.branch) || /\s/.test(next.token)){
      toast('Check the repo (owner/name), branch and token'); return;
    }
    gh = next;
    store.set('fb3.gh', gh); toast('GitHub settings saved'); sync(); render();
  }
  if(act === 'ghforget' && confirm('Remove the GitHub token from this phone?')){ gh.token = ''; store.set('fb3.gh', gh); render(); }
  if(act === 'ghpull') pullFromGitHub();
  if(act === 'print') window.print();
  if(act === 'backup') download(`fitness-backup-${new Date().toISOString().slice(0,10)}.json`,
    JSON.stringify({ version:1, history, drafts }, null, 2), 'application/json');
  if(act === 'restore') document.getElementById('importFile').click();
});

document.addEventListener('input', e => {
  const t = e.target;
  if(t.dataset.f){ const d = draft(view, true); d.slots[+t.dataset.i].sets[+t.dataset.j][t.dataset.f] = t.value.replace(',', '.'); save(); tickClock(); }
  if(t.id === 'notes'){ draft(view, true).notes = t.value; save(); }
  if(t.id === 'bw'){ bodyweight = t.value.replace(',', '.').trim(); store.set('fb3.bw', bodyweight); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.id === 'repSel'){ reportId = t.value; render(); }
  if(t.dataset.swap){ draft(view, true).slots[+t.dataset.swap].name = t.value; save(); render(); }
  if(t.id === 'importFile' && t.files[0]){
    t.files[0].text().then(txt => {
      const data = JSON.parse(txt), ids = new Set(history.map(s => s.id));
      const added = (data.history || []).filter(s => !ids.has(s.id)).map(s => ({ ...s, synced: false }));
      history = [...history, ...added].sort((a, b) => a.startedAt - b.startedAt);
      save(); render(); sync(); toast(`Restored ${added.length} workout${added.length === 1 ? '' : 's'}`);
    }).catch(() => toast('That file could not be read'));
    t.value = '';
  }
});

// ---------- Export ----------
async function download(name, text, type){
  // Inside claude.ai the viewer hands out files; opened as a plain file, a normal link works.
  const dl = window.claude && claude.use ? await claude.use('downloads').catch(() => null) : null;
  if(dl){
    try{ await dl.save({ filename:name, data:text }); toast('Saved ✓'); }
    catch(e){ if(e && e.code !== 'declined') toast('Couldn’t save the file here'); }
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

// ---------- Rest timer ----------
let restEnd = 0, overTimer = null, audio = null;
const $bar = document.getElementById('bar');
function startRest(sec, label){
  primeAudio(); clearTimeout(overTimer);
  restEnd = Date.now() + sec * 1000;
  document.getElementById('barL').textContent = label;
  $bar.classList.remove('over'); $bar.classList.add('show'); tickRest();
}
function adjustRest(v){
  if(v === 'skip'){ stopRest(); return; }
  if(restEnd) restEnd += (+v) * 1000;
  tickRest();
}
function stopRest(){ restEnd = 0; $bar.classList.remove('show', 'over'); }
function tickRest(){
  if(!restEnd) return;
  const left = Math.ceil((restEnd - Date.now()) / 1000);
  if(left <= 0){
    restEnd = 0; $bar.classList.add('over');
    document.getElementById('barT').textContent = 'Go';
    beep(); try{ navigator.vibrate && navigator.vibrate([300, 150, 300]); }catch(e){}
    overTimer = setTimeout(() => $bar.classList.remove('show', 'over'), 5000);
  } else document.getElementById('barT').textContent = mmss(left);
}
function primeAudio(){
  try{ audio = audio || new (window.AudioContext || window.webkitAudioContext)(); if(audio.state === 'suspended') audio.resume(); }catch(e){}
}
function beep(){
  if(!audio) return;
  try{
    [0, .25, .5].forEach(t => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(audio.destination);
      g.gain.setValueAtTime(.25, audio.currentTime + t); g.gain.exponentialRampToValueAtTime(.001, audio.currentTime + t + .18);
      o.start(audio.currentTime + t); o.stop(audio.currentTime + t + .2);
    });
  }catch(e){}
}

// ---------- Session clock + keep screen on ----------
function tickClock(){
  const d = drafts[view], el = document.getElementById('clock');
  if(!d || !d.startedAt){ el.textContent = ''; return; }
  const s = Math.floor((Date.now() - d.startedAt) / 1000);
  el.textContent = s >= 3600 ? `${Math.floor(s/3600)}:${mmss(s % 3600).padStart(5, '0')}` : mmss(s);
}
setInterval(() => { tickRest(); tickClock(); }, 250);

let wakeLock = null, wantWake = false;
async function toggleWake(){
  wantWake = !wantWake;
  if(wantWake) await getWake(); else { try{ await wakeLock?.release(); }catch(e){} wakeLock = null; }
  document.getElementById('wake').classList.toggle('on', wantWake && !!wakeLock);
  if(wantWake && !wakeLock){ wantWake = false; toast('This browser can’t keep the screen on'); }
}
async function getWake(){ try{ wakeLock = await navigator.wakeLock.request('screen'); }catch(e){ wakeLock = null; } }
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible'){ if(wantWake) getWake(); tickRest(); }
});

// ---------- GitHub sync (finished workouts → data/workouts/ in your private repo) ----------
// The phone copy is always written first; GitHub follows when there is signal.
// The token is typed in once on the phone and kept only in this browser.
let gh = store.get('fb3.gh', { repo:'sayedrian/fitness', branch:'main', token:'' });
let syncing = false, syncError = '', deleted = store.get('fb3.deleted', []);
const ghReady = () => !!(gh.token && gh.repo);
const b64enc = s => btoa(unescape(encodeURIComponent(s)));
const b64dec = s => decodeURIComponent(escape(atob(s.replace(/\n/g, ''))));
const pathFor = s => `data/workouts/${new Date(s.startedAt).toISOString().slice(0,10)}-${s.day}-${s.id}.json`;
async function api(path, opts = {}){
  const r = await fetch(`https://api.github.com/repos/${gh.repo}/contents/${path}`, { ...opts, headers:{
    Authorization:`Bearer ${gh.token}`, Accept:'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28' } });
  if(r.status === 401 || r.status === 403) throw new Error('GitHub refused the token — check it and its access to the repo.');
  if(r.status === 404 && opts.method !== 'PUT') return null;
  if(!r.ok) throw new Error(`GitHub error ${r.status}`);
  return r.status === 204 ? {} : r.json();
}
function syncText(){
  if(!ghReady()) return 'Saved in this browser on this phone only — add GitHub below to keep a copy in your repo.';
  const waiting = history.filter(s => !s.synced).length;
  if(syncError) return `Saved on this phone. GitHub: ${syncError}`;
  return waiting ? `Saved on this phone; ${waiting} waiting to upload to GitHub.` : 'Saved on this phone and in GitHub ✓';
}
async function sync(){
  if(!ghReady() || syncing || !navigator.onLine) return;
  syncing = true; syncError = '';
  try{
    for(const d of [...deleted]){
      const f = await api(d.path + `?ref=${gh.branch}`);
      if(f) await api(d.path, { method:'DELETE', body:JSON.stringify({ message:`Delete workout ${d.path}`, sha:f.sha, branch:gh.branch }) });
      deleted = deleted.filter(x => x.path !== d.path); store.set('fb3.deleted', deleted);
    }
    for(const s of history.filter(s => !s.synced)){
      const { synced, ...body } = s, path = pathFor(s);
      const existing = await api(path + `?ref=${gh.branch}`);   // already there from an earlier, half-finished upload
      if(!existing) await api(path, { method:'PUT', body:JSON.stringify({
        message:`Log ${PLAN[s.day]?.title || s.day} workout ${path.slice(14, 24)}`, content:b64enc(JSON.stringify(body, null, 2)), branch:gh.branch }) });
      s.synced = true; save();
    }
    // and the other way: workouts saved from another phone (or a new phone) come in by themselves
    const added = await pullNew();
    if(added){ toast(`Loaded ${added} workout${added === 1 ? '' : 's'} from GitHub`); render(); }
  }catch(e){ syncError = e.message.startsWith('GitHub') ? e.message : 'no connection — will retry.'; }
  syncing = false;
  if(view === 'log') render();
}
// Fetches workouts that are in GitHub but not on this phone. Returns how many were added.
async function pullNew(){
  const list = await api(`data/workouts?ref=${gh.branch}`) || [];
  const have = new Set(history.map(s => s.id)), gone = new Set(deleted.map(d => d.path));
  let added = 0;
  for(const f of list.filter(f => f.name.endsWith('.json') && !gone.has(f.path))){
    const id = f.name.replace(/\.json$/, '').split('-').pop();
    if(have.has(id)) continue;
    const file = await api(f.path + `?ref=${gh.branch}`);
    history.push({ ...JSON.parse(b64dec(file.content)), synced:true }); added++;
  }
  if(added){ history.sort((a, b) => a.startedAt - b.startedAt); save(); }
  return added;
}
async function pullFromGitHub(){
  if(!ghReady()){ toast('Add the GitHub token first'); return; }
  try{
    const added = await pullNew(); render();
    toast(`Loaded ${added} workout${added === 1 ? '' : 's'} from GitHub`);
  }catch(e){ toast(e.message.startsWith('GitHub') ? e.message : 'No connection'); }
}
window.addEventListener('online', sync);
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') sync(); });
sync();

let toastT;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2000); }

render();

// Offline helper: lets the installed app open with no signal (see sw.js).
if('serviceWorker' in navigator && location.protocol !== 'file:'){
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
